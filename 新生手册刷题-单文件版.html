在校学生，以属于加分项目的是（）。","options":[["A","学习优秀"],["B","科技创新能力强"],["C","组织能力突出"],["D","具有文体特长"],["E","积极参加社会实践和志愿服务活动"],["F","自强不息"]],"answer":["A","B","C","D","E","F"],"source":"《中国石油大学（华东）十大学生标兵评选实施细则》","category":"其他","excerpt":"二、评选条件：（一）基本条件：1.具备爱国主义思想和集体主义观念，在学习生活中能够做到团结协作、诚实守信、自强不息。讲文明、懂礼仪，具有良好的道德品质和精神面貌；2.遵纪守法，遵守公民道德规范，遵守学校的各项规章制度，具有良好的行为习惯；3.学习目的明确、态度端正，勤奋刻苦，成绩优异。（二）同时在下列某一方面有突出表现者：1.学习优秀：学习成绩突出，成绩一直……"},{"id":238,"type":"multi","stem":"申请国家励志奖学金者需具备以下条件（）。","options":[["A","热爱祖国,拥护中国共产党的领导,坚持四项基本原则,积极践行社会主义核心价值观"],["B","参评学生应为二年级以上(含二年级)的全日制普通本科在校生,且学习态度端正,勤奋刻苦,当学年修读的课程不低于30学分,原则上专业学习测评成绩与综合素质测评成绩排名均位于前30%。"],["C","家庭经济困难，生活简朴"],["D","品行端正,诚实守信,当学年基础性素质测评等级为“B”及以上"]],"answer":["A","B","C","D"],"source":"《中国石油大学（华东）“国家奖学金”、“国家励志奖学金”、“国家助学金”评选实施细则》","category":"奖学金与资助","excerpt":"第十条申请国家励志奖学金者还需具备以下条件：（一）在校生中二年级以上（含二年级）的学生，在校期间学习成绩优秀；（二）家庭经济困难，生活俭朴；（三）当学年基础性素质测评等级为“B”以上（含“B”）；（四）当学年修读的课程不低于30学分，原则上专业学习测评成绩与综合素质测评成绩排名均位于前30%（含30%）。"},{"id":239,"type":"multi","stem":"申请国家助学金者需具备以下条件（）。","options":[["A","热爱祖国,拥护中国共产党的领导,坚持四项基本原则,积极践行社会主义核心价值观"],["B","自觉遵守国家法律,无违法违纪记录;遵守各项校规校纪,未受警告及以上处分"],["C","品行端正,诚实守信,当学年基础性素质测评等级为“C”及以上"],["D","家庭经济困难，生活简朴"]],"answer":["A","B","C","D"],"source":"《中国石油大学（华东）“国家奖学金”、“国家励志奖学金”、“国家助学金”评选实施细则》","category":"奖学金与资助","excerpt":"中国石油大学（华东）学生文明行为规范一、品德修养篇（一）爱国荣校1.认真学习马克思列宁主义、毛泽东思想、邓小平理论、“三个代表”重要思想、科学发展观理论和习近平总书记系列重要讲话精神，坚持四项基本原则，拥护党的政策，维护党和国家的利益，关心时事，在思想和行动上与党中央保持一致。2.热爱祖国，坚决维护祖国统一和民族团结，坚决与分裂祖国和破坏民族团结的行为作斗争……"},{"id":240,"type":"multi","stem":"以下属于对违反学校纪律的学生的处分的是（）。","options":[["A","警告"],["B","严重警告"],["C","记过"],["D","留校察看"],["E","开除学籍"],["F","开除党籍"]],"answer":["A","B","C","D","E"],"source":"《中国石油大学（华东）学生纪律处分规定》","category":"学生纪律处分","excerpt":"第五条对有违反法律法规、《普通高等学校学生管理规定》以及学校纪律行为的学生，学校给予批评教育，并视情节轻重，给予如下纪律处分：（一）警告；（二）严重警告；（三）记过；（四）留校察看；（五）开除学籍。"},{"id":241,"type":"multi","stem":"违反治安管理处罚法,受行政拘留者,视情节轻重，给予（）处分。","options":[["A","严重警告"],["B","记过"],["C","留校察看"],["D","开除学籍"]],"answer":["B","C","D"],"source":"《中国石油大学（华东）学生纪律处分规定》","category":"学生纪律处分","excerpt":"第十条对触犯国家法律法规，受处罚者，给予如下处分：（一）构成刑事犯罪，受刑事处罚者，给予开除学籍处分；因过失犯罪者，给予留校察看或者开除学籍处分；（二）违反治安管理处罚法，受行政拘留者，视情节轻重，给予记过、留校察看或者开除学籍处分；受警告或者罚款者，给予警告或者严重警告处分。"},{"id":242,"type":"multi","stem":"对侵犯学校知识产权行为者的处分（）。","options":[["A","未经许可,私自转让、许可使用学校知识产权者,给予严重警告处分,情节严重的,给予记过或者留校察看处分;"],["B","违反保密规定,泄露学校科技成果,包括技术秘密者,给予记过处分,造成严重后果的,给予留校察看或者开除学籍处分;"],["C","其他违反学校有关知识产权规定行为者,给予警告或者严重警告处分,使学校权益受到损失者,给予记过、留校察看或者开除学籍处分。"],["D","学生对于知识产权的概念不清的，可以从轻处分。"]],"answer":["A","B","C"],"source":"《中国石油大学（华东）学生纪律处分规定》","category":"学生纪律处分","excerpt":"第十七条对侵犯学校知识产权行为者的处分：（一）未经许可，私自转让、许可使用学校知识产权者，给予严重警告处分，情节严重的，给予记过或者留校察看处分；（二）违反保密规定，泄露学校科技成果，包括技术秘密者，给予记过处分，造成严重后果的，给予留校察看或者开除学籍处分；（三）其他违反学校有关知识产权规定行为者，给予警告或者严重警告处分，使学校权益受到损失者，给予记过、……"},{"id":243,"type":"multi","stem":"以下行为中，属于违反考试纪律的是（）。","options":[["A","未按考场规则就座。"],["B","携带规定以外的物品进入考场或者未放在指定位置"],["C","用自带的草稿纸和计算器进行演算"],["D","经过监考人员许可后，借用给其他人书、笔记、资料、计算器等"],["E","考试中东张西望,企图偷看他人试卷,不服从考试工作人员管理"]],"answer":["A","B","C","E"],"source":"《中国石油大学（华东）学生纪律处分规定》","category":"学生纪律处分","excerpt":"第二十条对违反考试纪律者的处分：对不遵守考场纪律，不服从考试工作人员的安排与要求，有下列行为之一的，认定为违反考试纪律：（一）未按考场规则就座；（二）携带规定以外的物品进入考场或者未放在指定位置；（三）不按规定自带空白答题纸或者草稿纸；（四）未经监考人员允许借用他人的书、笔记、资料、计算器等物品；（五）考试中东张西望，企图偷看他人试卷，不服从考试工作人员管理……"},{"id":244,"type":"multi","stem":"对有违纪行为的学生,学校给予批评教育,批评教育的方式包括（）。","options":[["A","口头批评"],["B","书面警示"],["C","通报批评"],["D","开除学籍"]],"answer":["A","B","C"],"source":"《中国石油大学（华东）学生纪律处分规定》","category":"学生纪律处分","excerpt":"第三十条本规定未列举的其他违纪行为，视情节轻重，可参照相关规定，给予相应纪律处分。第四章处分程序和管理第三十一条对有违纪行为的学生，学校给予批评教育，批评教育的方式包括口头批评、书面警示和通报批评等，具体由学院（部）负责实施。通报批评下达后5天内报党委学生工作部、武装部备案。"},{"id":245,"type":"multi","stem":"心理咨询服务的时间为每周一至周五的（）。","options":[["A","上午8:00-12:00"],["B","上午8:00-11:00"],["C","下午14:00-17:30"],["D","下午14:00-18:00"]],"answer":["A","C"],"source":"《心理咨询来访者须知》","category":"心理咨询","excerpt":"六、读者借阅图书资料逾期、损坏或遗失的处理。根据石大东发暡1996暢100号文件规定，对读者借阅图书资料逾期、损坏及遗失的处理规定如下。1.所借图书超过借阅期限，须将超期图书归还或续借后，方能继续借书。2.读者如遗失所借图书资料，需在应还日期之前向唐岛湾校区图书馆总馆一楼大厅总服务台或古镇口东区学习中心三楼服务台、古镇口西区图书馆二楼服务台登记，并在1个月内……"},{"id":246,"type":"multi","stem":"自主发展计划学分里至少要取得2个学分的有哪些模块","options":[["A","社会实践"],["B","创新创业"],["C","文体发展"],["D","技能培训"]],"answer":["A","B","C"],"source":"中国石油大学(华东)本科生自主发展计划","category":"自主发展计划","excerpt":"第三条对学生按照学校本科生自主发展计划要求取得的自主发展计划学分，明确具体要求，其中思想成长类不少于1个学分，创新创业类不少于1.5个学分，社会实践与志愿服务类不少于1.5个学分，文体发展类不少于1个学分，工作履历与技能培训不做学分要求。"},{"id":247,"type":"multi","stem":"“第二课堂成绩单”思想成长类课程主要包括（）","options":[["A","入党入团情况"],["B","党团主题教育"],["C","社会实践"],["D","形式政策教育"]],"answer":["A","B","D"],"source":"中国石油大学(华东)“第二课堂成绩单实施细则”","category":"自主发展计划","excerpt":"第四条校内各有关单位、各学院（部）负责第二课堂活动的内容设计和组织实施，通过优化项目供给，切实提升第二课堂活动品质，满足学生素质拓展和修读学分的需求；学生根据第二课堂的教育教学要求，结合自己的专业、能力、特长、兴趣和爱好，自主选择参加相应的第二课堂活动和课程，取得规定的学分。第二章课程设置第五条“第二课堂成绩单”制度设置的5类课程具体为：（一）思想成长类，主……"},{"id":248,"type":"multi","stem":"创业训练项目是本科生团队，在导师指导下，团队中每个学生在项目实施过程中扮演一个或多个角色，完成（）等工作","options":[["A","编制商业计划书"],["B","开展可行性研究"],["C","模拟企业运行"],["D","参加企业实践"],["E","撰写创业报告"],["F","实际项目运营"]],"answer":["A","B","C","D","E"],"source":"中国石油大学(华东)大学生创新创业训练计划项目管理办法","category":"创新创业","excerpt":"三、计划内容大学生创新创业训练计划内容包括创新训练项目、创业训练项目和创业实践项目三类。创新训练项目是本科生个人或团队，在导师指导下，自主完成创新性研究项目设计、研究条件准备和项目实施、研究报告撰写、成果（学术）交流等工作。创业训练项目是本科生团队，在导师指导下，团队中每个学生在项目实施过程中扮演一个或多个具体的角色，完成编制商业计划书、开展可行性研究、模拟……"},{"id":249,"type":"multi","stem":"大学生创新创业训练计划内容包括（）","options":[["A","创新训练项目"],["B","创业训练项目"],["C","创业实践项目"],["D","创新实践项目"]],"answer":["A","B","C"],"source":"中国石油大学(华东)大学生创新创业训练计划项目管理办法","category":"创新创业","excerpt":"三、计划内容大学生创新创业训练计划内容包括创新训练项目、创业训练项目和创业实践项目三类。创新训练项目是本科生个人或团队，在导师指导下，自主完成创新性研究项目设计、研究条件准备和项目实施、研究报告撰写、成果（学术）交流等工作。创业训练项目是本科生团队，在导师指导下，团队中每个学生在项目实施过程中扮演一个或多个具体的角色，完成编制商业计划书、开展可行性研究、模拟……"},{"id":250,"type":"multi","stem":"申请“三进”计划学生须具备以下条件（）","options":[["A","思想品德良好, 遵纪守法, 在校期间无违反校规校纪行为"],["B","学习态度端正,对科研创新有浓厚兴趣,愿意加入科研团队从事科学研究"],["C","学有余力,必修课程没有不及格现象"],["D","非本研一体化班学生"]],"answer":["A","B","C","D"],"source":"优秀本科生\"三进\"提升计划实施办法","category":"三进提升计划","excerpt":"第十条申请学生须具备以下条件：1.思想品德良好，遵纪守法，在校期间无违反校规校纪行为；2.学习态度端正，对科研创新有浓厚兴趣，愿意加入科研团队从事科学研究；3.学有余力，必修课程没有不及格现象；4.非本研一体化班学生。"},{"id":251,"type":"multi","stem":"“三大赛”包括（）","options":[["A","中国国际“ 互联网+ ”大学生创新创业大赛"],["B","”挑战杯”全国大学生课外学术科技作品竞赛"],["C","“ 挑战杯”中国大学生创业计划竞赛"],["D","大学生创新创业大赛"]],"answer":["A","B","C"],"source":"本科生学科竞赛管理办法","category":"学科竞赛","excerpt":"一、竞赛分类根据竞赛的主办部门、参赛高校情况、竞赛声誉度及实际参赛费用等因素，将竞赛分为A、B、C、D四个类别。凡有下级对应选拔赛的，原则上按照最高级别赛事进行分类。（一）分类标准1.A类：由教育部、科技部、文化部等部委主办或由国际权威机构组织，在国内外有很大影响力，具有很强的学术权威性和业内认可度高的全国范围的学科竞赛。2.B类：由教育部委托国家级教学指导……"},{"id":252,"type":"judge","stem":"学分制收费是按照专业注册学费和学分学费两部分计收学费的收费管理制度。","options":[["A","对"],["B","错"]],"answer":["A"],"source":"《中国石油大学（华东）学分制收费管理暂行办法》","category":"学分制收费","excerpt":"第四条本办法所称学分制收费，是按照专业注册学费和学分学费两部分计收学费的收费管理制度。学分制收费执行政府定价或政府指导价。第二章收费项目及标准第五条专业注册学费是学生进行专业学习注册取得专业课程选修资格需缴纳的费用。专业注册学费由学校按照不同专业生均培养成本等因素合理确定。专业注册学费按学年计收。学校在每学年初向学生收取专业注册学费，为学生办理专业注册手续，……"},{"id":253,"type":"judge","stem":"学分学费根据学生每学期选课的总学分收取。无论是否取得该学分，均收取学分学费。","options":[["A","对"],["B","错"]],"answer":["A"],"source":"《中国石油大学（华东）学分制收费管理暂行办法》","category":"学分制收费","excerpt":"第六条学分学费是学生选择修读课程并取得课程考核资格缴纳的费用。学分学费按学期计收，实行先选课后缴费。学校根据每学期学生选课情况，按照课程对应学分数与收费标准，在学生完成选课后即时收取。"},{"id":254,"type":"judge","stem":"考试结束时，考生须将试卷、草稿纸全部交回，禁止带出考场。","options":[["A","对"],["B","错"]],"answer":["A"],"source":"中国石油大学（华东）学生考试工作管理规定（修订）","category":"考试管理","excerpt":"第二十六条试卷和草稿纸由监考人员统一发放，禁止考生自带草稿纸。考试结束时，考生须将试卷、草稿纸全部交回，禁止带出考场。提前交卷应举手示意，交回试卷并经监考人员同意后，方可离开。考试结束，考生应立即停止答题，在座位上等待监考人员收取试卷。待监考人员清点完试卷并下达允许离场的指令后，方可离开。"},{"id":255,"type":"judge","stem":"考试时，所有考试规定以外的物品必须按监考人员的要求放置。未经监考人员同意，不得两人共用一套文具或计算器。","options":[["A","对"],["B","错"]],"answer":["A"],"source":"中国石油大学（华东）学生考试工作管理规定（修订）","category":"考试管理","excerpt":"第二十七条考试时，所有考试规定以外的物品必须按监考人员的要求放置。未经监考人员同意，不得两人共用一套文具或计算器。"},{"id":256,"type":"judge","stem":"考试时，为他人提供偷看自己试卷的机会，自己没有偷看，不是作弊。","options":[["A","对"],["B","错"]],"answer":["B"],"source":"中国石油大学（华东）学生考试工作管理规定（修订）","category":"考试管理","excerpt":"第三十条考试过程中有下列情况之一者，以考试作弊认定，该门课程总成绩以零分记：（一）请人代考或代人考试；（二）强拿他人试卷、草稿纸（不论是否抄用）；（三）为他人提供偷看机会，或偷看他人试卷、草稿纸；（四）用某种示意、动作互相传递有关考试信息；（五）考试中直接或以借用工具书、文具、计算器等方式传接答卷或纸条的行为双方；（六）违反考场规则使用有文字存储功能的电子设……"},{"id":257,"type":"judge","stem":"考试违纪或作弊了，只要不在《考试违纪情况登记表》上签字，就不会受到处分。","options":[["A","对"],["B","错"]],"answer":["B"],"source":"中国石油大学（华东）学生考试工作管理规定（修订）","category":"考试管理","excerpt":"第二十二条考试过程中，监考人员应认真核对考生证件和试卷上填写的姓名，如有不符，应立即查处。如发现考生有违纪作弊苗头，应及时给予警告。如发现考生有违纪作弊行为，须立即予以制止，收回其试卷并暂扣作弊的材料、工具等物证，如实填写《考试违纪情况登记表》并要求考生签字确认后，将其清理出考场。考生拒不签字的，监考人员应在登记表中予以说明。"},{"id":258,"type":"judge","stem":"请人代考或代人考试，以考试作弊认定，该门课程总成绩以零分记。","options":[["A","对"],["B","错"]],"answer":["A"],"source":"中国石油大学（华东）学生考试工作管理规定（修订）","category":"考试管理","excerpt":"第三十条考试过程中有下列情况之一者，以考试作弊认定，该门课程总成绩以零分记：（一）请人代考或代人考试；（二）强拿他人试卷、草稿纸（不论是否抄用）；（三）为他人提供偷看机会，或偷看他人试卷、草稿纸；（四）用某种示意、动作互相传递有关考试信息；（五）考试中直接或以借用工具书、文具、计算器等方式传接答卷或纸条的行为双方；（六）违反考场规则使用有文字存储功能的电子设……"},{"id":259,"type":"judge","stem":"强拿他人试卷、草稿纸（不论是否抄用），以考试违纪认定。","options":[["A","对"],["B","错"]],"answer":["B"],"source":"中国石油大学（华东）学生考试工作管理规定（修订）","category":"考试管理","excerpt":"第三十条考试过程中有下列情况之一者，以考试作弊认定，该门课程总成绩以零分记：（一）请人代考或代人考试；（二）强拿他人试卷、草稿纸（不论是否抄用）；（三）为他人提供偷看机会，或偷看他人试卷、草稿纸；（四）用某种示意、动作互相传递有关考试信息；（五）考试中直接或以借用工具书、文具、计算器等方式传接答卷或纸条的行为双方；（六）违反考场规则使用有文字存储功能的电子设……"},{"id":260,"type":"judge","stem":"为他人提供偷看机会，或偷看他人试卷、草稿纸，以考试作弊认定。","options":[["A","对"],["B","错"]],"answer":["A"],"source":"中国石油大学（华东）学生考试工作管理规定（修订）","category":"考试管理","excerpt":"第三十条考试过程中有下列情况之一者，以考试作弊认定，该门课程总成绩以零分记：（一）请人代考或代人考试；（二）强拿他人试卷、草稿纸（不论是否抄用）；（三）为他人提供偷看机会，或偷看他人试卷、草稿纸；（四）用某种示意、动作互相传递有关考试信息；（五）考试中直接或以借用工具书、文具、计算器等方式传接答卷或纸条的行为双方；（六）违反考场规则使用有文字存储功能的电子设……"},{"id":261,"type":"judge","stem":"用某种示意、动作互相传递有关考试信息，以考试违纪认定。","options":[["A","对"],["B","错"]],"answer":["B"],"source":"中国石油大学（华东）学生考试工作管理规定（修订）","category":"考试管理","excerpt":"第三十条考试过程中有下列情况之一者，以考试作弊认定，该门课程总成绩以零分记：（一）请人代考或代人考试；（二）强拿他人试卷、草稿纸（不论是否抄用）；（三）为他人提供偷看机会，或偷看他人试卷、草稿纸；（四）用某种示意、动作互相传递有关考试信息；（五）考试中直接或以借用工具书、文具、计算器等方式传接答卷或纸条的行为双方；（六）违反考场规则使用有文字存储功能的电子设……"},{"id":262,"type":"judge","stem":"考试中直接或以借用工具书、文具、计算器等方式传接答卷或纸条的行为双方，以考试作弊认定。","options":[["A","对"],["B","错"]],"answer":["A"],"source":"中国石油大学（华东）学生考试工作管理规定（修订）","category":"考试管理","excerpt":"第三十条考试过程中有下列情况之一者，以考试作弊认定，该门课程总成绩以零分记：（一）请人代考或代人考试；（二）强拿他人试卷、草稿纸（不论是否抄用）；（三）为他人提供偷看机会，或偷看他人试卷、草稿纸；（四）用某种示意、动作互相传递有关考试信息；（五）考试中直接或以借用工具书、文具、计算器等方式传接答卷或纸条的行为双方；（六）违反考场规则使用有文字存储功能的电子设……"},{"id":263,"type":"judge","stem":"用某种示意、动作互相传递有关考试信息，以违反考试纪律认定。","options":[["A","对"],["B","错"]],"answer":["B"],"source":"中国石油大学（华东）学生考试工作管理规定（修订）","category":"考试管理","excerpt":"第三十条考试过程中有下列情况之一者，以考试作弊认定，该门课程总成绩以零分记：（一）请人代考或代人考试；（二）强拿他人试卷、草稿纸（不论是否抄用）；（三）为他人提供偷看机会，或偷看他人试卷、草稿纸；（四）用某种示意、动作互相传递有关考试信息；（五）考试中直接或以借用工具书、文具、计算器等方式传接答卷或纸条的行为双方；（六）违反考场规则使用有文字存储功能的电子设……"},{"id":264,"type":"judge","stem":"违反考场规则使用有文字存储功能的电子设备，或使用手机等无线通讯工具查看信息，以考试违纪认定。","options":[["A","对"],["B","错"]],"answer":["B"],"source":"中国石油大学（华东）学生考试工作管理规定（修订）","category":"考试管理","excerpt":"第三十条考试过程中有下列情况之一者，以考试作弊认定，该门课程总成绩以零分记：（一）请人代考或代人考试；（二）强拿他人试卷、草稿纸（不论是否抄用）；（三）为他人提供偷看机会，或偷看他人试卷、草稿纸；（四）用某种示意、动作互相传递有关考试信息；（五）考试中直接或以借用工具书、文具、计算器等方式传接答卷或纸条的行为双方；（六）违反考场规则使用有文字存储功能的电子设……"},{"id":265,"type":"judge","stem":"偷看有关考试内容的资料,或与他人交谈有关考试内容，以考试作弊认定。","options":[["A","对"],["B","错"]],"answer":["A"],"source":"中国石油大学（华东）学生考试工作管理规定（修订）","category":"考试管理","excerpt":"第三十条考试过程中有下列情况之一者，以考试作弊认定，该门课程总成绩以零分记：（一）请人代考或代人考试；（二）强拿他人试卷、草稿纸（不论是否抄用）；（三）为他人提供偷看机会，或偷看他人试卷、草稿纸；（四）用某种示意、动作互相传递有关考试信息；（五）考试中直接或以借用工具书、文具、计算器等方式传接答卷或纸条的行为双方；（六）违反考场规则使用有文字存储功能的电子设……"},{"id":266,"type":"judge","stem":"故意损毁试卷、答题卡、答题纸等考试材料，以考试违纪认定。","options":[["A","对"],["B","错"]],"answer":["B"],"source":"中国石油大学（华东）学生考试工作管理规定（修订）","category":"考试管理","excerpt":"第三十条考试过程中有下列情况之一者，以考试作弊认定，该门课程总成绩以零分记：（一）请人代考或代人考试；（二）强拿他人试卷、草稿纸（不论是否抄用）；（三）为他人提供偷看机会，或偷看他人试卷、草稿纸；（四）用某种示意、动作互相传递有关考试信息；（五）考试中直接或以借用工具书、文具、计算器等方式传接答卷或纸条的行为双方；（六）违反考场规则使用有文字存储功能的电子设……"},{"id":267,"type":"judge","stem":"监考人员发现的考生违纪作弊行为会进行处理，巡考人员发现的，不进行处理。","options":[["A","对"],["B","错"]],"answer":["B"],"source":"中国石油大学（华东）学生考试工作管理规定（修订）","category":"考试管理","excerpt":"第三十三条巡考人员发现考生违纪作弊，应立即向考场监考人员说明情况，由监考人员按上述办法处理。巡考人员应在《考场情况记录表》上签名。教师在阅卷或其他情况下发现有作弊问题时，要及时将书面报告（连同物证）交教务处。"},{"id":268,"type":"judge","stem":"学校内部的考试，迟到40分钟以内，可以入场。","options":[["A","对"],["B","错"]],"answer":["B"],"source":"中国石油大学（华东）学生考试工作管理规定（修订）","category":"考试管理","excerpt":"第五条承担监考工作是教师的工作职责和义务，任课教师参加监考是其所承担的教学任务的一个必要环节。教学院部要把教师是否每学期承担一定场次（由学院确定）的监考作为教师考核的重要内容。禁止安排学生担任监考。第三章考务工作第六条考试组织（一）考试周设置。根据学校校历，一般将学期最后1周设置为考试周，用于安排期末考试。期末考试周期间，统一考试铃声。（二）考试安排。考试周……"},{"id":269,"type":"judge","stem":"考试中东张西望，企图偷看他人试卷，但没有成功，不属于考试违纪行为。","options":[["A","对"],["B","错"]],"answer":["B"],"source":"中国石油大学（华东）学生考试工作管理规定（修订）","category":"考试管理","excerpt":"第二十八条考生要严格遵守考场规则，在规定的时间内独立完成答卷。凡不服从监考人员安排，违反考试纪律或作弊者，按学校有关规定处理。第八章考试违纪、作弊的认定及处理第二十九条考生有下列情况之一者，视为违反考试纪律，要当场给予口头警告并予以纠正：（一）未按考场规则就座；（二）闭卷考试至发试卷时仍将规定以外物品等带入座位；（三）自带空白答题纸或草稿纸；（四）未经监考人……"},{"id":270,"type":"judge","stem":"提前交卷后，在不影响他人的情况下，可以继续坐在考场中。","options":[["A","对"],["B","错"]],"answer":["B"],"source":"中国石油大学（华东）学生考试工作管理规定（修订）","category":"考试管理","excerpt":"第二十八条考生要严格遵守考场规则，在规定的时间内独立完成答卷。凡不服从监考人员安排，违反考试纪律或作弊者，按学校有关规定处理。第八章考试违纪、作弊的认定及处理第二十九条考生有下列情况之一者，视为违反考试纪律，要当场给予口头警告并予以纠正：（一）未按考场规则就座；（二）闭卷考试至发试卷时仍将规定以外物品等带入座位；（三）自带空白答题纸或草稿纸；（四）未经监考人……"},{"id":271,"type":"judge","stem":"闭卷考试中，桌内、座位旁有翻开的或试卷下面垫有与考试内容相关的书、笔记、讲义、复习提纲等物品，没有翻看的话，不算考试作弊。","options":[["A","对"],["B","错"]],"answer":["B"],"source":"中国石油大学（华东）学生考试工作管理规定（修订）","category":"考试管理","excerpt":"第三十条考试过程中有下列情况之一者，以考试作弊认定，该门课程总成绩以零分记：（一）请人代考或代人考试；（二）强拿他人试卷、草稿纸（不论是否抄用）；（三）为他人提供偷看机会，或偷看他人试卷、草稿纸；（四）用某种示意、动作互相传递有关考试信息；（五）考试中直接或以借用工具书、文具、计算器等方式传接答卷或纸条的行为双方；（六）违反考场规则使用有文字存储功能的电子设……"},{"id":272,"type":"judge","stem":"闭卷考试中，利用文具盒、衣物或其他用品夹带与考试内容相关的笔记、复习提纲、纸条，拿出观看的，以考试作弊认定，未拿出观看的认定为违反考试纪律。","options":[["A","对"],["B","错"]],"answer":["B"],"source":"中国石油大学（华东）学生考试工作管理规定（修订）","category":"考试管理","excerpt":"第三十条考试过程中有下列情况之一者，以考试作弊认定，该门课程总成绩以零分记：（一）请人代考或代人考试；（二）强拿他人试卷、草稿纸（不论是否抄用）；（三）为他人提供偷看机会，或偷看他人试卷、草稿纸；（四）用某种示意、动作互相传递有关考试信息；（五）考试中直接或以借用工具书、文具、计算器等方式传接答卷或纸条的行为双方；（六）违反考场规则使用有文字存储功能的电子设……"},{"id":273,"type":"judge","stem":"用某种示意、动作互相传递有关考试信息，没有实物证据，不以考试作弊认定，可从轻处理。","options":[["A","对"],["B","错"]],"answer":["B"],"source":"中国石油大学（华东）学生考试工作管理规定（修订）","category":"考试管理","excerpt":"第三十条考试过程中有下列情况之一者，以考试作弊认定，该门课程总成绩以零分记：（一）请人代考或代人考试；（二）强拿他人试卷、草稿纸（不论是否抄用）；（三）为他人提供偷看机会，或偷看他人试卷、草稿纸；（四）用某种示意、动作互相传递有关考试信息；（五）考试中直接或以借用工具书、文具、计算器等方式传接答卷或纸条的行为双方；（六）违反考场规则使用有文字存储功能的电子设……"},{"id":274,"type":"judge","stem":"实验课如因特殊情况请假的，须经指导教师同意，可不用进行补做。","options":[["A","对"],["B","错"]],"answer":["B"],"source":"《中国石油大学（华东）本科实验教学管理办法》","category":"实验教学与实习","excerpt":"第十五条实验课原则上不允许请假，如因特殊情况需请假的，须经指导教师同意，并及时进行补做。"},{"id":275,"type":"judge","stem":"实验课成绩考核可采用百分制或五级记分制记载。","options":[["A","对"],["B","错"]],"answer":["A"],"source":"《中国石油大学（华东）本科实验教学管理办法》","category":"实验教学与实习","excerpt":"第十八条实验课成绩应从学生实验态度、预习情况、操作表现、实验数据、实验报告、考核等多方面进行综合评定，可采用百分制（60分为及格）或五级记分制（优秀、良好、中等、及格、不及格）记载。"},{"id":276,"type":"judge","stem":"大学生创新创业训练计划中的创业实践项目实行学校和企业双导师制。","options":[["A","对"],["B","错"]],"answer":["A"],"source":"《中国石油大学（华东）大学生创新创业训练计划项目管理办法》","category":"创新创业","excerpt":"五、项目申报1.凡在校全日制本科生均可参加项目申报。创新训练和创业训练项目负责人须为四年制学生中1至2年级学生或五年制学生中1至3年级学生。创业实践项目负责人须为四年制学生中1至3年级学生或五年制学生中1至4年级学生。其他年级学生可作为项目组成员参加，但不能作为项目负责人。2.每个创新训练项目参与学生总数一般不超过5人，要求品学兼优，学有余力，具有良好的科研……"},{"id":277,"type":"judge","stem":"大学生创新创业训练计划项目负责人可以任意更换。","options":[["A","对"],["B","错"]],"answer":["B"],"source":"《中国石油大学（华东）大学生创新创业训练计划项目管理办法》","category":"创新创业","excerpt":"八、经费管理1.大学生创新创业训练计划项目经费由教育部专项经费和学校配套经费组成，项目经费专款专用。2.学生在导师指导下自主使用项目经费。经费主要用于资助项目实验、材料、书籍、论文发表、学术交流、调研差旅等项目运行所需费用，不得挪作他用。导师不得使用学生项目经费。3.经费报销严格遵守学校财务制度，报销不得超过项目经费总额。报销单据须由项目负责人和导师签字，由……"},{"id":278,"type":"judge","stem":"大学生创新创业训练计划项目中，对未能通过中期检查或工作无明显进展的项目，学校将终止其运行并追回垫付费用。","options":[["A","对"],["B","错"]],"answer":["B"],"source":"《中国石油大学（华东）大学生创新创业训练计划项目管理办法》","category":"创新创业","excerpt":"七、项目运行1.项目批准立项后，项目负责人须与学校签订项目管理合同书，并严格按照合同规定内容执行。不签订合同者视为放弃。2.项目运行时间为1至3年，原则上要求在项目负责人毕业前完成。项目组须每周填写实施情况记录，导师每月检查项目进展。学校定期对项目实施情况进行检查。3.项目运行时间过半开展中期检查。项目组须提交项目中期检查报告和项目运行原始记录。教学院（部）……"},{"id":279,"type":"judge","stem":"申报大学生创新创业训练计划项目时，同一研究内容已获学校其他项目资助的只要研究主题符合，可重复申报。","options":[["A","对"],["B","错"]],"answer":["B"],"source":"《中国石油大学（华东）大学生创新创业训练计划项目管理办法》","category":"创新创业","excerpt":"五、项目申报1.凡在校全日制本科生均可参加项目申报。创新训练和创业训练项目负责人须为四年制学生中1至2年级学生或五年制学生中1至3年级学生。创业实践项目负责人须为四年制学生中1至3年级学生或五年制学生中1至4年级学生。其他年级学生可作为项目组成员参加，但不能作为项目负责人。2.每个创新训练项目参与学生总数一般不超过5人，要求品学兼优，学有余力，具有良好的科研……"},{"id":280,"type":"judge","stem":"对存在学术不端兴伟或经费使用不当的大学生创新创业训练计划项目，学校将终止项目运行并收回资助费用。","options":[["A","对"],["B","错"]],"answer":["A"],"source":"《中国石油大学（华东）大学生创新创业训练计划项目管理办法》","category":"创新创业","excerpt":"八、经费管理1.大学生创新创业训练计划项目经费由教育部专项经费和学校配套经费组成，项目经费专款专用。2.学生在导师指导下自主使用项目经费。经费主要用于资助项目实验、材料、书籍、论文发表、学术交流、调研差旅等项目运行所需费用，不得挪作他用。导师不得使用学生项目经费。3.经费报销严格遵守学校财务制度，报销不得超过项目经费总额。报销单据须由项目负责人和导师签字，由……"},{"id":281,"type":"judge","stem":"学生在实习期间，经指导教师批准，可以调换实习岗位。","options":[["A","对"],["B","错"]],"answer":["A"],"source":"《中国石油大学（华东）本科实习教学管理办法》","category":"实验教学与实习","excerpt":"第十条论文撰写要求与查重检测1.学生撰写毕业论文可采用学校给出的毕业论文模板或学院规定的统一格式，应符合学术规范，论文结构严谨、完整，各部分内容所占比例合理，图、表、公式格式规范，文字准确通畅。2.毕业论文的正文字数应不少于1万字，外语专业原则上用外文撰写，不少于2万字符。设计类的图纸内容、图纸规格、图纸张数，由学院结合专业要求制定。3.学校实行毕业设计查重……"},{"id":282,"type":"judge","stem":"毕业设计题目为防止工作量计算上的困难，须一人一题。","options":[["A","对"],["B","错"]],"answer":["B"],"source":"《中国石油大学（华东）本科毕业设计（论文）管理规定》","category":"其他","excerpt":"第六条对学生的要求1.原则上，学生应具备进行毕业设计的知识和能力，正式开始毕业设计时未取得培养方案规定的理论课（含选修）学分累计不得超过15个，否则不具备参加毕业设计的资格。学院应根据学校要求严格审核学生的毕业设计资格。学院对毕业设计资格有特殊要求的，应于毕业设计开始前报学校审核。2.学生须严格遵守学校和学院有关管理规定，保证充足的时间和精力开展毕业设计，不……"},{"id":283,"type":"judge","stem":"在校外做毕业设计的学生不需要配备校内指导教师。","options":[["A","对"],["B","错"]],"answer":["B"],"source":"《中国石油大学（华东）本科毕业设计（论文）管理规定》","category":"其他","excerpt":"第二十二条对毕业设计检查中发现的其他问题，根据具体情况及影响程度，给予责任人或责任单位相应的处理。第五章其他第二十三条校外毕业设计1.在保证毕业设计质量的前提下，鼓励学生到校外结合生产实践、社会实际等开展毕业设计工作。2.学生在校外做毕业设计的接受单位可以是学校教学实践基地、大中型企事业单位或科研院所等。学院要严格审核校外毕业设计接收单位的条件，确保满足毕业……"},{"id":284,"type":"judge","stem":"对在创新创业实践活动中取得优秀成绩的学生，学校将给予自主发展计划学分认定、综合素质测评加分等奖励，并在研究生“推免”工作中予以政策倾斜。","options":[["A","对"],["B","错"]],"answer":["A"],"source":"《中国石油大学（华东）本科生创新创业教育保障与激励暂行办法》","category":"创新创业","excerpt":"三、激励措施学校设立创新创业奖励基金（300万元/年），用于表彰和奖励在创新创业实践活动中取得突出成绩的学生和在创新创业教育中做出突出贡献的教师。（一）面向学生的激励措施1.创新创业卓越奖（100万元/年）。“创新创业实践卓越之星”奖学金（40万元/年），“三进”提升计划优秀生卓越奖（10万元/年），用于奖励在创新创业科研和实践活动中取得优异成绩的学生，评选……"},{"id":285,"type":"judge","stem":"学校设有创新创业专项奖学金。","options":[["A","对"],["B","错"]],"answer":["A"],"source":"《中国石油大学（华东）本科生创新创业教育保障与激励暂行办法》","category":"创新创业","excerpt":"评选要求：各院部根据《中国石油大学（华东）学生突出成绩奖学金管理细则》，制定本院部评选细则，评出获奖个人或团队，报党委学生工作部、武装部备案。参评成果已获学校其他部门奖励的不再参评突出成绩奖学金。（三）专项奖学金1.创新创业实践卓越之星奖学金奖励对象：奖励在创新创业实践活动中取得优异成绩的学生。奖励标准：设一等、二等、三等奖学金，分别奖励5000元/人、30……"},{"id":286,"type":"judge","stem":"因健康原因不能正常上体育课的学生,经校医院或校医院指定的二级甲等以上医院诊断证明,并经体育教学部同意后,可改修保健课并免予执行《学生体质健康标准》。","options":[["A","对"],["B","错"]],"answer":["A"],"source":"《中国石油大学（华东）本科生学籍管理规定》","category":"学籍管理","excerpt":"第十八条体育课成绩和《学生体质健康标准》成绩须分别进行评定。体育课成绩评定应突出过程管理，根据考勤、课内教学、课外锻炼活动和体质健康等情况综合评定。因健康原因不能正常上体育课的学生，经校医院或校医院指定的二级甲等以上医院诊断证明，并经体育教学部同意后，可改修保健课并免予执行《学生体质健康标准》。"},{"id":287,"type":"judge","stem":"新生入学后，学校在3个月内按照国家招生规定对其进行复查。","options":[["A","对"],["B","错"]],"answer":["A"],"source":"《中国石油大学（华东）本科生学籍管理规定》","category":"学籍管理","excerpt":"第七条新生入学后，学校在3个月内按照国家招生规定对其进行复查。复查内容主要包括以下方面：1.录取手续及程序等是否合乎国家招生规定；2.所获得的录取资格是否真实、合乎相关规定；3.本人及身份证明与录取通知、考生档案等是否一致；4.身心健康状况是否符合报考专业或者专业类别体检要求，能否保证在校正常学习、生活；5.艺术、体育等特殊类型录取学生的专业水平是否符合录取……"},{"id":288,"type":"judge","stem":"学生不请假或请假未获批准而无故缺席的,以旷课论处,并根据学校学生纪律处分相关规定给予批评教育;情节严重的,直接给予开除学籍的纪律处分。","options":[["A","对"],["B","错"]],"answer":["B"],"source":"《中国石油大学（华东）本科生学籍管理规定》","category":"学籍管理","excerpt":"第十条学生应当按照本科培养方案的要求，认真参加各项教育教学活动。学生因病或其他原因不能按时参加的，应当事先请假并获得批准。学生不请假或请假未获批准而无故缺席的，以旷课论处，并根据学校学生纪律处分相关规定给予批评教育；情节严重的，给予相应的纪律处分。理论课旷课时间的计算以学生课程表的课时数为准。对于本科培养方案规定的实践性教学环节和学校规定必须参加的其他各项教……"},{"id":289,"type":"judge","stem":"学生对本科培养方案规定的课程通过自学等途径确已掌握,可以申请免修。","options":[["A","对"],["B","错"]],"answer":["A"],"source":"《中国石油大学（华东）本科生学籍管理规定》","category":"学籍管理","excerpt":"第十五条学生可根据自身情况申请课程免修、免听。1.课程免修（1）学生对本科培养方案规定的课程通过自学等途径确已掌握，可以申请免修；（2）学生申请免修原则上应在学期初2周内向开课院部提出申请；（3）开课院部根据课程学习要求等情况，决定是否接受免修申请。同意免修的，由开课院部确定课程的考核方式、考核内容、评价标准等报教务处审批。批准通过的，由教务处统一组织考核；……"},{"id":290,"type":"judge","stem":"学生补考时间为每学期的开学初,补考课程为前一学期考核不及格的必修或限选课程,且申请补考的课程成绩必须达45分（含）以上。","options":[["A","对"],["B","错"]],"answer":["B"],"source":"《中国石油大学（华东）本科生学籍管理规定》","category":"学籍管理","excerpt":"第十七条凡结课（含免修）考核不及格的课程，可通过重新选课修读或补考取得该课程的学分。考核成绩合格，但成绩不理想的课程，也可重新选课修读。1.在学校规定的最长学习年限内，重新选课修读不限制次数，所有修读成绩均如实记载；2.补考时间为每学期的开学初，补考课程为前一学期考核不及格的必修或限选课程，且申请补考的课程成绩必须达50分（含）以上；3.实验课程、实习实训、……"},{"id":291,"type":"judge","stem":"本校学生学分绩的计算方式为：学分绩=Σ（修读课程成绩X课程总学分）/Σ修读课程学分。","options":[["A","对"],["B","错"]],"answer":["B"],"source":"《中国石油大学（华东）本科生学籍管理规定》","category":"学籍管理","excerpt":"第二十一条学分绩、课程绩点、平均学分绩点的计算方法：1.学分绩=暺（修读课程成绩暳课程学分）/暺修读课程学分；2.课程绩点=修读课程成绩/10-5；3.平均学分绩点=暺（修读课程绩点暳课程学分）/暺修读课程学分；4.课程成绩不足60分的，课程绩点记为0；五级记分制与百分制的对应关系：优秀-95，良好-85，中等-75，及格-65，不及格-40；二级记分制与百……"},{"id":292,"type":"judge","stem":"因病（持校医院或校医院指定的二级甲等以上医院诊断证明）或其他特殊原因确实不能参加结课考核的学生,应于考试前提出申请并提供相关证明材料办理缓考手续,经所在院部同意,报教务处审批。","options":[["A","对"],["B","错"]],"answer":["A"],"source":"《中国石油大学（华东）本科生学籍管理规定》","category":"学籍管理","excerpt":"第十九条因病（持校医院或校医院指定的二级甲等以上医院诊断证明）或其他特殊原因确实不能参加结课考核的学生，应于考试前提出申请并提供相关证明材料办理缓考手续，经所在院部同意，报教务处审批。"},{"id":293,"type":"judge","stem":"转专业学生须达到原专业本科培养方案规定的要求方可毕业。","options":[["A","对"],["B","错"]],"answer":["B"],"source":"《中国石油大学（华东）本科生学籍管理规定》","category":"学籍管理","excerpt":"第三十一条转专业学生须达到转入专业本科培养方案规定的要求方可毕业。转专业前已取得学分的课程，如果符合转入专业本科培养方案的要求，可办理课程学分冲抵手续。"},{"id":294,"type":"judge","stem":"学生转专业,应按学校规定办理手续;在未完成相关手续办理前,应参加两个专业共有的或可完成学分认证的相应课程。","options":[["A","对"],["B","错"]],"answer":["B"],"source":"《中国石油大学（华东）本科生学籍管理规定》","category":"学籍管理","excerpt":"第三十二条学生转专业，应按学校规定办理手续；在未完成相关手续办理前，须参加原专业的学习。第六章休学、保留学籍与复学第三十三条学生有以下情形之一者，应申请休学：1.因病经校医院或校医院指定的二级甲等以上医院诊断后，须停课治疗、休养超过6周的（肝炎、肺结核等传染病患者须休学）；2.请假超过6周的；3.经学校认定同意创业休学的；4.因某种特殊原因，本人申请休学或学……"},{"id":295,"type":"judge","stem":"学生毕业时未修满本科培养方案规定的学分要求,可申请延长学习年限或结业。","options":[["A","对"],["B","错"]],"answer":["A"],"source":"《中国石油大学（华东）本科生学籍管理规定》","category":"学籍管理","excerpt":"第四十六条学生毕业时未修满本科培养方案规定的学分要求，可申请延长学习年限或结业。1.延长学习年限（1）延长学习年限应由学生本人提出申请，所在院部审核批准后报教务处备案，但其累计在校时间不能超过学校规定的最长学习年限；（2）延长学习年限的学生，享受在校生待遇。2.结业（1）毕业时累计欠本科培养方案规定的学分要求15学分以内（含15学分）的学生，经本人申请，所在……"},{"id":296,"type":"judge","stem":"学校所发的毕业证书、学位证书、结业证书和肄业证书等如有遗失或者损坏,经本人申请,学校可提供其副本。","options":[["A","对"],["B","错"]],"answer":["B"],"source":"《中国石油大学（华东）本科生学籍管理规定》","category":"学籍管理","excerpt":"第五十一条学校所发的毕业证书、学位证书、结业证书和肄业证书均属一次性证件。如有遗失或者损坏，经本人申请，学校可出具相应的证明书，证明书与原证书具有同等效力。第十章附则第五十二条学校对学生作出取消入学资格、取消学籍、退学、转学等涉及学生重大利益的决定，事先进行合法性审查，并提交校长办公会或者校长授权的专门会议研究决定。学生对学籍处理决定有异议的，可按照学校学生……"},{"id":297,"type":"judge","stem":"学生退学且学满2学年以上的,学校可发给肄业证书。","options":[["A","对"],["B","错"]],"answer":["B"],"source":"《中国石油大学（华东）本科生学籍管理规定》","category":"学籍管理","excerpt":"第四十九条学生退学且学满1学年以上的，学校可发给肄业证书。开除学籍或未满1学年退学的学生，学校只出具学习证明。"},{"id":298,"type":"judge","stem":"新生和在校学生应征参加中国人民解放军（含中国人民武装警察部队）,学校保留其入学资格或学籍至退役后2年,保留学籍时间不计入学习年限。","options":[["A","对"],["B","错"]],"answer":["A"],"source":"《中国石油大学（华东）本科生学籍管理规定》","category":"学籍管理","excerpt":"第三十七条新生和在校学生应征参加中国人民解放军（含中国人民武装警察部队），学校保留其入学资格或学籍至退役后2年，保留学籍时间不计入学习年限。"},{"id":299,"type":"judge","stem":"学生应当诚实守信,遵从学术规范,恪守学术道德,遵守保护知识产权的有关规定。 对学生学业、学术、品行等方面有严重失信行为的,可按相关规定给予相应的纪律处分,对违背学术诚信的,学校将对其获得学位及学术称号、荣誉等作出限制。","options":[["A","对"],["B","错"]],"answer":["A"],"source":"《中国石油大学（华东）本科生学籍管理规定》","category":"学籍管理","excerpt":"第十二条学生应当诚实守信，遵从学术规范，恪守学术道德，遵守保护知识产权的有关规定。对学生学业、学术、品行等方面有严重失信行为的，可按相关规定给予相应的纪律处分，对违背学术诚信的，学校将对其获得学位及学术称号、荣誉等作出限制。第四章课程考核与成绩记载第十三条学生应当参加学校本科培养方案规定的课程和各项教育教学环节（以下统称课程）的考核，其考核成绩记入成绩单，并……"},{"id":300,"type":"judge","stem":"对违反国家招生规定入学者,学校取消其学籍,不发给学历、学位证书;已发的学历、学位证书,学校依法予以撤销。","options":[["A","对"],["B","错"]],"answer":["A"],"source":"《中国石油大学（华东）本科生学籍管理规定》","category":"学籍管理","excerpt":"第五十条对违反国家招生规定入学者，学校取消其学籍，不发给学历、学位证书；已发的学历、学位证书，学校依法予以撤销。对以作弊、剽窃、抄袭等学术不端行为或者其他不正当手段获得学历证书、学位证书的，学校依法予以撤销。被撤销的学历证书、学位证书已注册的，学校予以注销并报教育行政部门宣布无效。"},{"id":301,"type":"judge","stem":"学业警示级别根据学生已选必修课程中累计未取得学分数（Q）或每学期选课学分数（X）确定,分为一级警示、二级警示、三级警示等3个级别。","options":[["A","对"],["B","错"]],"answer":["A"],"source":"《中国石油大学（华东）本科生学籍管理规定》","category":"学籍管理","excerpt":"第三十八条休学期满，学生复学按下列规定办理：1.休学或保留学籍期满后1周内，学生应持本人休学证明（因病休学者还需持校医院或校医院指定的二级甲等以上医院诊断复查证明）或保留学籍证明向所在院部申请复学，经院部审核，学校批准后，办理复学手续；2.院部应对申请复学的学生进行必要的审查。如发现其在休学期间有严重违法乱纪行为，取消复学资格；3.学生复学后，由其所在院部根……"},{"id":302,"type":"judge","stem":"学校真实、完整地记载、出具学生学业成绩,学生重学成绩、补考成绩视情况予以标注。","options":[["A","对"],["B","错"]],"answer":["B"],"source":"《中国石油大学（华东）本科生学籍管理规定》","category":"学籍管理","excerpt":"第十二条学生应当诚实守信，遵从学术规范，恪守学术道德，遵守保护知识产权的有关规定。对学生学业、学术、品行等方面有严重失信行为的，可按相关规定给予相应的纪律处分，对违背学术诚信的，学校将对其获得学位及学术称号、荣誉等作出限制。第四章课程考核与成绩记载第十三条学生应当参加学校本科培养方案规定的课程和各项教育教学环节（以下统称课程）的考核，其考核成绩记入成绩单，并……"},{"id":303,"type":"judge","stem":"学生入学后,一般不予转学。 如因患病或者确有特殊困难和需要,无法继续在校学习者或不适应学校学习要求的,可以申请转学。","options":[["A","对"],["B","错"]],"answer":["A"],"source":"《中国石油大学（华东）本科生学籍管理规定》","category":"学籍管理","excerpt":"第二十四条学生因退学等情况中止学业，其在校学习期间所修课程及已获得学分，予以记录。学生退学后2年内重新参加普通高等学校招生全国统一考试，被学校录取并取得学籍的，其已获得学分，经学校认定符合相关专业本科培养方案要求，可予以承认。第五章转学与转专业第二十五条学生入学后，一般不予转学。如因患病或者确有特殊困难和需要，无法继续在校学习者或不适应学校学习要求的，可以申……"},{"id":304,"type":"judge","stem":"本科毕业生，曾有记过及以上处分，不可授予学士学位。","options":[["A","对"],["B","错"]],"answer":["A"],"source":"《中国石油大学（华东）学士学位授予办法》","category":"学籍管理","excerpt":"第三条本细则适用于学校普通高等教育全日制本科毕业生。第二章学位授予标准第四条达到以下标准者，可在规定时间内向学校提出申请，经学校学位评定委员会审查通过后，授予学士学位：（一）拥护中国共产党的领导、拥护社会主义制度，遵守宪法和法律法规，遵守学校规章制度，遵守学术道德和学术规范。（二）在校学习且学习时间在学校规定最长学习年限内，或结业后不满1年。（三）完成本专业……"},{"id":305,"type":"judge","stem":"学生因退学、转学等原因终止学业的，按月结算专业注册学费；每学年按10个月计算，不足1个月的，按1个月计算。学分学费按实际修读学分结算。","options":[["A","对"],["B","错"]],"answer":["A"],"source":"《中国石油大学（华东）学分制收费管理暂行办法》","category":"学分制收费","excerpt":"第十七条学生退学的，根据学生实际学习时间按月计退专业注册学费。专业注册费按每学年10个月计算，不足1个月的，按1个月计算，学生办理完成退学手续时即时退费。学生学分学费已缴纳但未修完课程的，按照课程学分及收费标准于每学期末或下学期初全部退还。"},{"id":306,"type":"judge","stem":"学生参加自主发展计划第二课堂活动的，免交学分学费。","options":[["A","对"],["B","错"]],"answer":["A"],"source":"《中国石油大学（华东）学分制收费管理暂行办法》","category":"学分制收费","excerpt":"第十二条学生参加自主发展计划第二课堂活动的，免交学分学费。"},{"id":307,"type":"judge","stem":"入学复查不合格取消入学资格的新生，学校不予退还已交学费。","options":[["A","对"],["B","错"]],"answer":["B"],"source":"《中国石油大学（华东）学分制收费管理暂行办法》","category":"学分制收费","excerpt":"第十六条学生放弃入学资格或入学复查不合格取消入学资格的，学校退还已交学费。"},{"id":308,"type":"judge","stem":"学生确因家庭经济困难无法及时足额交费的，可通过学校大学生资助中心申请缓交，经认定后方可注册、选课，学费缓交期间课程成绩暂不登记入档。","options":[["A","对"],["B","错"]],"answer":["A"],"source":"《中国石油大学（华东）学分制收费管理暂行办法》","category":"学分制收费","excerpt":"第四条本办法所称学分制收费，是按照专业注册学费和学分学费两部分计收学费的收费管理制度。学分制收费执行政府定价或政府指导价。第二章收费项目及标准第五条专业注册学费是学生进行专业学习注册取得专业课程选修资格需缴纳的费用。专业注册学费由学校按照不同专业生均培养成本等因素合理确定。专业注册学费按学年计收。学校在每学年初向学生收取专业注册学费，为学生办理专业注册手续，……"},{"id":309,"type":"judge","stem":"凡在校普通全日制本科生，品学兼优、学有余力者均可申请修读双学位。","options":[["A","对"],["B","错"]],"answer":["A"],"source":"《中国石油大学（华东）本科生双学位培养管理办法》","category":"双学位与辅修","excerpt":"五、项目申报1.凡在校全日制本科生均可参加项目申报。创新训练和创业训练项目负责人须为四年制学生中1至2年级学生或五年制学生中1至3年级学生。创业实践项目负责人须为四年制学生中1至3年级学生或五年制学生中1至4年级学生。其他年级学生可作为项目组成员参加，但不能作为项目负责人。2.每个创新训练项目参与学生总数一般不超过5人，要求品学兼优，学有余力，具有良好的科研……"},{"id":310,"type":"judge","stem":"双学位专业开设院部对申请双学位的同学进行必要考核，并根据考核择优录取。","options":[["A","对"],["B","错"]],"answer":["A"],"source":"《中国石油大学（华东）本科生双学位培养管理办法》","category":"双学位与辅修","excerpt":"二、跨专业学习介绍1.跨学科课程为培养学生的跨领域知识融通能力，拓宽学生多学科思维视野，我校在2024版本科专业人才培养方案中设置了跨学科课程，学生须跨专业类选择修读其他专业的专业课程不少于4学分。从2024级学生开始，4个学分跨学科课程是完成学业的必要条件（具体以本专业培养方案为准）。同学们在选课的时候，根据自己的兴趣合理安排修读计划。如果同学们学有余力，……"},{"id":311,"type":"judge","stem":"双学位单个专业人数较少且公共时间难以调整，因此不单独组班上课。","options":[["A","对"],["B","错"]],"answer":["B"],"source":"《中国石油大学（华东）本科生双学位培养管理办法》","category":"双学位与辅修","excerpt":"二、跨专业学习介绍1.跨学科课程为培养学生的跨领域知识融通能力，拓宽学生多学科思维视野，我校在2024版本科专业人才培养方案中设置了跨学科课程，学生须跨专业类选择修读其他专业的专业课程不少于4学分。从2024级学生开始，4个学分跨学科课程是完成学业的必要条件（具体以本专业培养方案为准）。同学们在选课的时候，根据自己的兴趣合理安排修读计划。如果同学们学有余力，……"},{"id":312,"type":"judge","stem":"修读双学位学生须获得主修专业学士学位，同时达到双学位专业培养方案的要求，方可授予双学位。","options":[["A","对"],["B","错"]],"answer":["A"],"source":"《中国石油大学（华东）本科生双学位培养管理办法》","category":"双学位与辅修","excerpt":"二、跨专业学习介绍1.跨学科课程为培养学生的跨领域知识融通能力，拓宽学生多学科思维视野，我校在2024版本科专业人才培养方案中设置了跨学科课程，学生须跨专业类选择修读其他专业的专业课程不少于4学分。从2024级学生开始，4个学分跨学科课程是完成学业的必要条件（具体以本专业培养方案为准）。同学们在选课的时候，根据自己的兴趣合理安排修读计划。如果同学们学有余力，……"},{"id":313,"type":"judge","stem":"辅修专业开设院部和学生所在院部共同负责辅修学生的学习成绩管理。","options":[["A","对"],["B","错"]],"answer":["B"],"source":"《中国石油大学（华东）本科生辅修培养管理办法》","category":"双学位与辅修","excerpt":"二、跨专业学习介绍1.跨学科课程为培养学生的跨领域知识融通能力，拓宽学生多学科思维视野，我校在2024版本科专业人才培养方案中设置了跨学科课程，学生须跨专业类选择修读其他专业的专业课程不少于4学分。从2024级学生开始，4个学分跨学科课程是完成学业的必要条件（具体以本专业培养方案为准）。同学们在选课的时候，根据自己的兴趣合理安排修读计划。如果同学们学有余力，……"},{"id":314,"type":"judge","stem":"主、辅修专业应属于相同专业类。","options":[["A","对"],["B","错"]],"answer":["B"],"source":"《中国石油大学（华东）本科生辅修培养管理办法》","category":"双学位与辅修","excerpt":"二、跨专业学习介绍1.跨学科课程为培养学生的跨领域知识融通能力，拓宽学生多学科思维视野，我校在2024版本科专业人才培养方案中设置了跨学科课程，学生须跨专业类选择修读其他专业的专业课程不少于4学分。从2024级学生开始，4个学分跨学科课程是完成学业的必要条件（具体以本专业培养方案为准）。同学们在选课的时候，根据自己的兴趣合理安排修读计划。如果同学们学有余力，……"},{"id":315,"type":"judge","stem":"在校本科生学生因创业需要,可申请创业休学。","options":[["A","对"],["B","错"]],"answer":["A"],"source":"《中国石油大学（华东）本科生创新创业学籍管理办法（试行）》","category":"创新创业","excerpt":"中国石油大学（华东）本科生创新创业学籍管理办法（中石大东发[2023]34号）第一章总则第一条为贯彻落实《国务院办公厅关于进一步支持大学生创新创业的指导意见》（国办发暡2021暢35号）等相关文件精神，支持本科生创新创业，结合学校学籍管理有关规定，特制定本办法。第二章学习年限第二条学生因创业需要，可申请创业休学。"},{"id":316,"type":"judge","stem":"对于在创业休学期间创业项目无实际进展,或从事与创业计划无关活动,经认定不适合继续创业者,应终止休学。","options":[["A","对"],["B","错"]],"answer":["A"],"source":"《中国石油大学（华东）本科生创新创业学籍管理办法（试行）》","category":"创新创业","excerpt":"第六条每年12月底前，创业休学学生须向所在院（部）提交项目进展报告，创业满1年的还需提交完税证明或免税证明，由院（部）创新创业教育领导小组认定、学校创新创业教育工作领导小组办公室审定。对于在创业休学期间创业项目无实际进展，或从事与创业计划无关活动，经认定不适合继续创业者，应终止休学。第四章学分认定第七条学生参加创新活动、创业实践，可申请学分认定。同一创新创业……"},{"id":317,"type":"judge","stem":"连续创业2年及以上,且表现突出、成效显著的,可免修自主发展计划全部学分。","options":[["A","对"],["B","错"]],"answer":["B"],"source":"《中国石油大学（华东）本科生创新创业学籍管理办法（试行）》","category":"创新创业","excerpt":"第八条学生参加学科竞赛、课外科技活动、创新项目研究、发表论文、获得专利等创新活动，可申请认定为自主发展计划（第二课堂）中的创新创业学分。"},{"id":318,"type":"judge","stem":"学生参与创新活动,研究过程和取得成绩确能体现其学科专长和创新潜质,且转入相关专业更利于其发展的,可申请转专业。","options":[["A","对"],["B","错"]],"answer":["A"],"source":"《中国石油大学（华东）本科生创新创业学籍管理办法（试行）》","category":"创新创业","excerpt":"第十四条复学按以下规定办理：1.每学期初2周内，向所在院（部）提出申请，填写《创业复学申请表》，经院（部）创新创业教育领导小组认定、学校创新创业教育工作领导小组办公室审定后，报学校审批。审批通过者，办理复学手续。2.院（部）要对申请复学的学生进行必要的审查，如发现其在休学期间有严重的违法违纪行为，取消复学资格。3.休学期满或年度审查认定不适合继续创业者，在学……"},{"id":319,"type":"judge","stem":"“优良学风班”评选每年组织一次,同一个行政班级在两年内不可以连续申报。","options":[["A","对"],["B","错"]],"answer":["B"],"source":"《中国石油大学(华东)优良学风班评选办法》","category":"优良学风班","excerpt":"四、其他1.“优良学风班”每年组织一次，符合条件者可连续申报。2.获得“优良学风班”和“优良学风标兵班”的班级，学校颁发荣誉证书并给予奖励。3.本办法自公布之日施行，由教务处负责解释。原《石油大学（华东）建设、评选优良学风班办法》（石大东发暡1998暢105号）同时废止。"},{"id":320,"type":"judge","stem":"宿舍夜间断电后，违规使用计算机影响他人休息者，学校师生、宿舍管理人员等均有权进行劝说、制止。","options":[["A","对"],["B","错"]],"answer":["A"],"source":"《中国石油大学（华东）学生公寓管理规定》","category":"学生公寓","excerpt":"第四十七条宿舍内使用计算机应自觉遵守管理规定和作息制度，不影响他人学习和休息。宿舍夜间断电后，违规使用计算机影响他人休息者，学校师生、宿舍管理人员等均有权进行劝说、制止。第五节维修管理第四十八条学生公寓设施日常维修由物业公司负责，物业工作人员定期或不定期进行巡检，专项维修由物业公司上报后勤管理处后安排实施。"},{"id":321,"type":"judge","stem":"严禁私自在学生公寓内安装使用洗衣机。","options":[["A","对"],["B","错"]],"answer":["A"],"source":"《中国石油大学（华东）学生公寓管理规定》","category":"学生公寓","excerpt":"第四十六条严禁私自在学生公寓内安装使用洗衣机。"},{"id":322,"type":"judge","stem":"学生在公寓中的表现纳入学生素质综合评价体系，与学生荣誉称号评选及奖学金评定等结合。","options":[["A","对"],["B","错"]],"answer":["A"],"source":"《中国石油大学（华东）学生公寓管理规定》","category":"学生公寓","excerpt":"第六十九条学生在公寓中的表现纳入学生素质综合评价体系，与学生荣誉称号评选及奖学金评定等结合。"},{"id":323,"type":"judge","stem":"学生公寓卫生的总体要求是：洁净、整齐。","options":[["A","对"],["B","错"]],"answer":["A"],"source":"《中国石油大学（华东）学生公寓管理规定》","category":"学生公寓","excerpt":"第三十条学生公寓实行传染病申报制度。凡有《中华人民共和国传染病防治法》规定的各类传染病患者，应主动报告学生工作部门或校医院，在治愈前或排除传染病嫌疑前，应服从学校安排。第三节卫生管理第三十一条学生公寓卫生的总体要求是：洁净、整齐。"},{"id":324,"type":"judge","stem":"学生公寓内学生在使用充电器具时，房间内无须有人，但离开宿舍须切断电源。","options":[["A","对"],["B","错"]],"answer":["B"],"source":"《中国石油大学（华东）学生公寓管理规定》","category":"学生公寓","excerpt":"第二十九条学生在使用充电器具时，房间内必须有人，离开宿舍须切断电源。"},{"id":325,"type":"judge","stem":"学生进入学生公寓时，对尾随跟入的陌生人，有义务劝止。","options":[["A","对"],["B","错"]],"answer":["A"],"source":"《中国石油大学（华东）学生公寓管理规定》","category":"学生公寓","excerpt":"第十九条学生凭校园一卡通刷卡（或智能门禁识别）进入学生公寓，严禁以攀爬阳台、护栏、窗户等非正常手段强行进入，严禁将校园一卡通转借他人，严禁带领陌生人进入公寓。对尾随跟入的陌生人，有义务劝止。"},{"id":326,"type":"judge","stem":"毕业生办理完退宿手续后不必保持学生公寓房间内卫生洁净、整齐。","options":[["A","对"],["B","错"]],"answer":["B"],"source":"《中国石油大学（华东）学生公寓管理规定》","category":"学生公寓","excerpt":"第三十八条毕业生办理完退宿手续后应保持房间内卫生洁净、整齐。第四节秩序管理第三十九条学生公寓早5：30开门，晚23：00关门，学生要严格遵守学校作息制度和学生公寓管理规定，按时归宿。晚归或断电后外出学生需主动出示有效证件，配合物业管理人员做好登记后方可出入。"},{"id":327,"type":"judge","stem":"学生公寓楼道内严禁停放自行车。","options":[["A","对"],["B","错"]],"answer":["A"],"source":"《中国石油大学（华东）学生公寓管理规定》","category":"学生公寓","excerpt":"第四十一条楼道及房间内严禁停放自行车，自行车要整齐停放在“停车线”内。"},{"id":328,"type":"judge","stem":"学生公寓严禁乱拉线（灯），特殊情况须经后勤管理处批准，由物业公司统一布线，违者拆除。","options":[["A","对"],["B","错"]],"answer":["A"],"source":"《中国石油大学（华东）学生公寓管理规定》","category":"学生公寓","excerpt":"第二十八条学生公寓严禁乱拉线（灯），特殊情况须经后勤管理处批准，由物业公司统一布线，违者拆除。"},{"id":329,"type":"judge","stem":"学生公寓用电按照“满足基本需要、杜绝浪费、定额管理、超额自负”的原则，实行定额内免费供电和超定额部分自己承担费用相结合的管理办法.","options":[["A","对"],["B","错"]],"answer":["A"],"source":"《中国石油大学（华东）学生公寓管理规定》","category":"学生公寓","excerpt":"第五十五条学生公寓用电按照“满足基本需要、杜绝浪费、定额管理、超额自负”的原则，实行定额内免费供电和超定额部分自己承担费用相结合的管理办法。"},{"id":330,"type":"judge","stem":"学生公寓原则上不允许异性进入，特殊情况须持有效证件登记后方可进入。","options":[["A","对"],["B","错"]],"answer":["A"],"source":"《中国石油大学（华东）学生公寓管理规定》","category":"学生公寓","excerpt":"第四十二条学生公寓原则上不允许异性进入，特殊情况须持有效证件登记后方可进入。"},{"id":331,"type":"judge","stem":"学生公寓内发现可疑人员应及时报告公寓值班人员或公安（保卫）处。","options":[["A","对"],["B","错"]],"answer":["A"],"source":"《中国石油大学（华东）学生公寓管理规定》","category":"学生公寓","excerpt":"第二十一条学生离开宿舍时要关好门窗，现金及贵重物品妥善保管。发现可疑人员应及时报告公寓值班人员或保卫处。"},{"id":332,"type":"judge","stem":"学生公寓配备消防设备，可以移动、挪用，但不能损坏消防器材。","options":[["A","对"],["B","错"]],"answer":["B"],"source":"《中国石油大学（华东）学生公寓管理规定》","category":"学生公寓","excerpt":"第二十五条学生公寓配备消防设备，严禁移动、挪用、损坏消防器材。"},{"id":333,"type":"judge","stem":"学生公寓实行传染病申报制度。凡有《中华人民共和国传染病防治法》规定的各类传染病患者，应主动报告学生工作部门或校医院，在治愈前或排除传染病嫌疑前，应服从学校安排。","options":[["A","对"],["B","错"]],"answer":["A"],"source":"《中国石油大学（华东）学生公寓管理规定》","category":"学生公寓","excerpt":"第三十条学生公寓实行传染病申报制度。凡有《中华人民共和国传染病防治法》规定的各类传染病患者，应主动报告学生工作部门或校医院，在治愈前或排除传染病嫌疑前，应服从学校安排。第三节卫生管理第三十一条学生公寓卫生的总体要求是：洁净、整齐。"},{"id":334,"type":"judge","stem":"学生公寓早5:30开门，晚24：00关门。晚归或断电后外出学生需主动出示有效证件，配合物业管理人员做好登记后方可出入。","options":[["A","对"],["B","错"]],"answer":["B"],"source":"《中国石油大学（华东）学生公寓管理规定》","category":"学生公寓","excerpt":"第三十八条毕业生办理完退宿手续后应保持房间内卫生洁净、整齐。第四节秩序管理第三十九条学生公寓早5：30开门，晚23：00关门，学生要严格遵守学校作息制度和学生公寓管理规定，按时归宿。晚归或断电后外出学生需主动出示有效证件，配合物业管理人员做好登记后方可出入。"},{"id":335,"type":"judge","stem":"本校本科生、硕士生毕业后继续在我校攻读硕士学位、博士学位者，应按时办理毕业离校退宿手续，在规定时间入校时，再按相关要求办理住宿手续。","options":[["A","对"],["B","错"]],"answer":["A"],"source":"《中国石油大学（华东）学生公寓管理规定》","category":"学生公寓","excerpt":"第十条学生毕业、退学、休学、转学、出国、开除学籍以及自愿申请退宿的，应当按照学校规定的流程办理退宿手续，物业公司对学生宿舍进行检查，对丢失或损坏公共物品者，要追究赔偿责任。对故意损坏者，责令其赔偿相应损失，结清相关费用后，在规定时间内搬离宿舍。本校本科生、硕士生毕业后继续在我校攻读硕士学位、博士学位者，应按时办理毕业离校退宿手续，在规定时间入校时，再按相关要……"},{"id":336,"type":"judge","stem":"宿舍内可以储藏但不能使用易燃、易爆、强腐蚀性物品。","options":[["A","对"],["B","错"]],"answer":["B"],"source":"《中国石油大学（华东）学生公寓管理规定》","category":"学生公寓","excerpt":"第二十七条宿舍内严禁储藏或使用易燃、易爆、强腐蚀性物品，严禁使用明火、违章电器、防限电插座，严禁盗用公共用电。"},{"id":337,"type":"judge","stem":"学生要爱护公物，养成节水、节电的良好习惯，严禁有踢、拆、砸、烧等损坏公共设施的行为。","options":[["A","对"],["B","错"]],"answer":["A"],"source":"《中国石油大学（华东）学生公寓管理规定》","category":"学生公寓","excerpt":"第四十四条学生要爱护公物，养成节水、节电的良好习惯，严禁有踢、拆、砸、烧等损坏公共设施的行为。严禁在学生公寓内赌博、打麻将、酗酒、打架、斗殴及其他违法违纪活动。严禁在公寓内饲养和携带动物。"},{"id":338,"type":"judge","stem":"申诉委应在接到书面申诉之日起15日内作出复查结论，告知申诉人，并出具复查决定书。情况复杂不能在规定限期内作出结论的，经学校负责人批准，可延长15日。","options":[["A","对"],["B","错"]],"answer":["A"],"source":"《中国石油大学（华东）学生申诉处理办法（修订）》","category":"申诉处理","excerpt":"第十二条申诉委应在接到书面申诉之日起15日内作出复查结论，告知申诉人，并出具复查决定书。情况复杂不能在规定限期内作出结论的，经学校负责人批准，可延长15日。"},{"id":339,"type":"judge","stem":"学生申诉过程中，自处理、处分或者复查决定书送达之日起，学生在申诉期内未提出申诉的视为放弃申诉，学校或者省级教育行政部门不再受理其提出的申诉。","options":[["A","对"],["B","错"]],"answer":["A"],"source":"《普通高等学校学生管理规定》（教育部令第 号）》","category":"其他","excerpt":"第四十条自处分或者复查决定书送达之日起，学生在申诉期内未提出申诉的视为放弃申诉，学校不再受理其提出的申诉。"},{"id":340,"type":"judge","stem":"学校本科专业标准学制四年（建筑学专业学制五年），实行学分制管理和弹性学习年限，学生可在标准学制的基础上提前两年或延长一年毕业。","options":[["A","对"],["B","错"]],"answer":["B"],"source":"《中国石油大学（华东）本科生学籍管理规定》","category":"学籍管理","excerpt":"第三条学校本科专业标准学制四年（建筑学专业学制五年），实行学分制管理和弹性学习年限，学生可在标准学制的基础上提前一年或延长两年毕业。"},{"id":341,"type":"judge","stem":"成绩的评定，可采用百分制（60分为及格）、五级记分制（优秀、良好、中等、及格、不及格）或二级记分制（及格、不及格）记载，及格及以上成绩取得该门课程学分。","options":[["A","对"],["B","错"]],"answer":["B"],"source":"《中国石油大学（华东）本科生学籍管理规定》","category":"学籍管理","excerpt":"第十四条成绩的评定，可采用百分制（60分为及格）、五级记分制（优秀、良好、中等、及格、不及格）或二级记分制（通过、不通过）记载，及格及以上成绩（或通过）取得该门课程学分。"},{"id":342,"type":"judge","stem":"连续4学期每学期选课学分数均小于20学分的学生，学校应予退学处理。","options":[["A","对"],["B","错"]],"answer":["B"],"source":"《中国石油大学（华东）本科生学籍管理规定》","category":"学籍管理","excerpt":"第四十条学生有以下情形之一者，学校应予退学处理：1.已选必修课程中累计未取得学分数达到25学分及以上的；2.连续4学期每学期选课学分数均小于15学分的；3.休学、保留学籍期满，在学校规定的期限内未提出复学申请或者申请复学经复查不合格的；4.经校医院或校医院指定的二级甲等以上医院诊断，患有疾病或者意外伤残不能继续在校学习的；5.未经批准连续两周未参加学校规定的……"},{"id":343,"type":"judge","stem":"学分制收费，是按照学分计收学费的收费管理制度。","options":[["A","对"],["B","错"]],"answer":["B"],"source":"中国石油大学（华东）学分制收费管理暂行办法","category":"学分制收费","excerpt":"第四条本办法所称学分制收费，是按照专业注册学费和学分学费两部分计收学费的收费管理制度。学分制收费执行政府定价或政府指导价。第二章收费项目及标准第五条专业注册学费是学生进行专业学习注册取得专业课程选修资格需缴纳的费用。专业注册学费由学校按照不同专业生均培养成本等因素合理确定。专业注册学费按学年计收。学校在每学年初向学生收取专业注册学费，为学生办理专业注册手续，……"},{"id":344,"type":"judge","stem":"社团会员可以不是我校学生。","options":[["A","对"],["B","错"]],"answer":["B"],"source":"中国石油大学（华东）学生社团管理办法","category":"学生社团","excerpt":"第三条本办法所指借款学生为我校全日制家庭经济困难本科生、研究生和第二学士学位学生。贷款人是指受理国家助学贷款的中国银行东营石大支行。第二章贷款模式第四条按照学生申办地点及工作流程不同，国家助学贷款分为校园地国家助学贷款与生源地信用助学贷款两种模式。全日制普通本专科生在同一学年不得重复申请获得校园地国家助学贷款和生源地信用助学贷款，只能选择申请办理其中一种贷款……"},{"id":345,"type":"judge","stem":"本专科生奖学金每人每年最高不超过6000元，研究生奖学金每人每年最高不超过10000元。","options":[["A","对"],["B","错"]],"answer":["B"],"source":"中国石油大学（华东）国家助学贷款实施办法（修订）","category":"奖学金与资助","excerpt":"第三条本办法所指借款学生为我校全日制家庭经济困难本科生、研究生和第二学士学位学生。贷款人是指受理国家助学贷款的中国银行东营石大支行。第二章贷款模式第四条按照学生申办地点及工作流程不同，国家助学贷款分为校园地国家助学贷款与生源地信用助学贷款两种模式。全日制普通本专科生在同一学年不得重复申请获得校园地国家助学贷款和生源地信用助学贷款，只能选择申请办理其中一种贷款……"},{"id":346,"type":"judge","stem":"学生公寓严禁酗酒、抽烟、点蜡烛、焚烧物品、燃放鞭炮等，严禁用任何方式自炊。","options":[["A","对"],["B","错"]],"answer":["A"],"source":"中国石油大学（华东）学生公寓管理规定","category":"学生公寓","excerpt":"第二十六条学生公寓严禁酗酒、抽烟、点蜡烛、焚烧物品、燃放鞭炮等，严禁用任何方式自炊。"},{"id":347,"type":"judge","stem":"获得计算机三级等级证书，可以计2学分。","options":[["A","对"],["B","错"]],"answer":["B"],"source":"中国石油大学(华东)本科生自主发展计划","category":"自主发展计划","excerpt":"二、跨专业学习介绍1.跨学科课程为培养学生的跨领域知识融通能力，拓宽学生多学科思维视野，我校在2024版本科专业人才培养方案中设置了跨学科课程，学生须跨专业类选择修读其他专业的专业课程不少于4学分。从2024级学生开始，4个学分跨学科课程是完成学业的必要条件（具体以本专业培养方案为准）。同学们在选课的时候，根据自己的兴趣合理安排修读计划。如果同学们学有余力，……"},{"id":348,"type":"judge","stem":"校级大学生创业基地入驻条件中要求项目负责人为我校在读学生。","options":[["A","对"],["B","错"]],"answer":["B"],"source":"中国石油大学(华东)大学生创业实践管理办法","category":"创新创业","excerpt":"第五条基地入驻条件：1.项目负责人为我校全日制在校学生。2.具有较好市场前景且落地实体运转的创业项目、拥有自主知识产权的创业项目、在国家级或省级创业比赛中获奖的创业项目优先考虑。"},{"id":349,"type":"judge","stem":"大学生创业基地入驻项目应定期向办公室提交项目运行情况报告,并接受中期检查和期满验收考核","options":[["A","对"],["B","错"]],"answer":["A"],"source":"中国石油大学(华东)大学生创业实践管理办法","category":"创新创业","excerpt":"第十一条基金运作管理：1.受资助的项目应定期向办公室提交基金使用情况的财务报告和项目运行情况报告，并接受中期检查和期满验收考核。2.受资助的项目因客观原因需对目标、进度和经费等进行调整时，应向办公室提出书面申请，经审核通过方可执行。3.受资助的项目提前退出时，须提前提出书面申请，报办公室审核后，办理清算核销手续。4.受资助项目如有盈利，根据项目收益情况，将项……"},{"id":350,"type":"judge","stem":"读者可以通过“网上图书馆”或在各服务台预约图书，预约仅限不在馆藏图书，每次预约仅限5册。","options":[["A","对"],["B","错"]],"answer":["B"],"source":"中国石油大学（华东）图书馆开架书库借阅管理规定","category":"图书馆","excerpt":"四、借书数量与期限，预约与续借。读者类型最大续借次数最大借书量|借期教职工、研究生2次不限|120天本科生、留学生2次不限|30天校外读者2次2册|60天读者所借图书须按期归还，有逾期未还图书将导致无法继续借阅图书。凡借阅图书超过规定期限，均需缴纳超期资源占用费，每册书每超一天需缴纳超期资源占用费0.1元。对于累积超期30日以上仍未还书的读者，图书馆将取消其……"},{"id":351,"type":"judge","stem":"文艺书库每日开放时间为上午8点至12点，下午2点至5点半，晚上7点至10点。","options":[["A","对"],["B","错"]],"answer":["B"],"source":"中国石油大学（华东）图书馆开架书库借阅管理规定","category":"图书馆","excerpt":"六、读者借阅图书资料逾期、损坏或遗失的处理。根据石大东发暡1996暢100号文件规定，对读者借阅图书资料逾期、损坏及遗失的处理规定如下。1.所借图书超过借阅期限，须将超期图书归还或续借后，方能继续借书。2.读者如遗失所借图书资料，需在应还日期之前向唐岛湾校区图书馆总馆一楼大厅总服务台或古镇口东区学习中心三楼服务台、古镇口西区图书馆二楼服务台登记，并在1个月内……"},{"id":352,"type":"judge","stem":"借书时需要消磁，人工还书时需要充磁。","options":[["A","对"],["B","错"]],"answer":["A"],"source":"中国石油大学（华东）图书馆开架书库借阅管理规定","category":"图书馆","excerpt":""},{"id":353,"type":"judge","stem":"自助还书机无法识别的图书，在工作时间交给值班人员，非工作时间扔在还书台的台面上即可。","options":[["A","对"],["B","错"]],"answer":["B"],"source":"中国石油大学（华东）图书馆开架书库借阅管理规定","category":"图书馆","excerpt":"二、出入书库。书库开放时间：唐岛湾校区图书馆总馆、东馆与古镇口校区东区学习中心和古镇口校区西区图书馆：08：00-22：00。读者可以带包进入开架书库。读者入库后可自由选书，从书架上取下的图书如不借出应放回原处或放在书架空位，请不要随意放置，以免造成乱架，影响其他读者借阅。出入书库均须经过安全门。若安全门鸣响，请读者确认是否携带未借阅图书并联系值班工作人员帮……"},{"id":354,"type":"judge","stem":"书太多，背来背去很 "奖学金与资助","excerpt":"第三条本办法所指借款学生为我校全日制家庭经济困难本科生、研究生和第二学士学位学生。贷款人是指受理国家助学贷款的中国银行东营石大支行。第二章贷款模式第四条按照学生申办地点及工作流程不同，国家助学贷款分为校园地国家助学贷款与生源地信用助学贷款两种模式。全日制普通本专科生在同一学年不得重复申请获得校园地国家助学贷款和生源地信用助学贷款，只能选择申请办理其中一种贷款……"},{"id":376,"type":"judge","stem":"全日制普通本专科生在同一学年可以重复申请获得校园地国家助学贷款和生源地信用助学贷款。","options":[["A","对"],["B","错"]],"answer":["B"],"source":"《中国石油大学（华东）国家助学贷款实施办法》","category":"奖学金与资助","excerpt":"第三条本办法所指借款学生为我校全日制家庭经济困难本科生、研究生和第二学士学位学生。贷款人是指受理国家助学贷款的中国银行东营石大支行。第二章贷款模式第四条按照学生申办地点及工作流程不同，国家助学贷款分为校园地国家助学贷款与生源地信用助学贷款两种模式。全日制普通本专科生在同一学年不得重复申请获得校园地国家助学贷款和生源地信用助学贷款，只能选择申请办理其中一种贷款……"},{"id":377,"type":"judge","stem":"校园地国家助学贷款借款学生在校学习期间利息全部由财政补贴,毕业后的利息由借款学生本人全额支付。","options":[["A","对"],["B","错"]],"answer":["A"],"source":"《中国石油大学（华东）国家助学贷款实施办法》","category":"奖学金与资助","excerpt":"第三条本办法所指借款学生为我校全日制家庭经济困难本科生、研究生和第二学士学位学生。贷款人是指受理国家助学贷款的中国银行东营石大支行。第二章贷款模式第四条按照学生申办地点及工作流程不同，国家助学贷款分为校园地国家助学贷款与生源地信用助学贷款两种模式。全日制普通本专科生在同一学年不得重复申请获得校园地国家助学贷款和生源地信用助学贷款，只能选择申请办理其中一种贷款……"},{"id":378,"type":"judge","stem":"校园地国家助学贷款借款学生毕业后,在还款期内继续攻读学位的,可申请继续财政贴息。","options":[["A","对"],["B","错"]],"answer":["A"],"source":"《中国石油大学（华东）国家助学贷款实施办法》","category":"奖学金与资助","excerpt":"第三条本办法所指借款学生为我校全日制家庭经济困难本科生、研究生和第二学士学位学生。贷款人是指受理国家助学贷款的中国银行东营石大支行。第二章贷款模式第四条按照学生申办地点及工作流程不同，国家助学贷款分为校园地国家助学贷款与生源地信用助学贷款两种模式。全日制普通本专科生在同一学年不得重复申请获得校园地国家助学贷款和生源地信用助学贷款，只能选择申请办理其中一种贷款……"},{"id":379,"type":"judge","stem":"生源地信用助学贷款申请学生在新学期开始前,需向家庭所在县（市、区）的学生资助管理中心提出贷款申请（有的地区直接到相关金融机构申请）。","options":[["A","对"],["B","错"]],"answer":["A"],"source":"《中国石油大学（华东）国家助学贷款实施办法》","category":"奖学金与资助","excerpt":"第三条本办法所指借款学生为我校全日制家庭经济困难本科生、研究生和第二学士学位学生。贷款人是指受理国家助学贷款的中国银行东营石大支行。第二章贷款模式第四条按照学生申办地点及工作流程不同，国家助学贷款分为校园地国家助学贷款与生源地信用助学贷款两种模式。全日制普通本专科生在同一学年不得重复申请获得校园地国家助学贷款和生源地信用助学贷款，只能选择申请办理其中一种贷款……"},{"id":380,"type":"judge","stem":"生源地信用助学贷款借款学生在校学习期间利息全部由财政补贴,毕业后的利息由借款学生本人全额支付。","options":[["A","对"],["B","错"]],"answer":["B"],"source":"《中国石油大学（华东）国家助学贷款实施办法》","category":"奖学金与资助","excerpt":"第三条本办法所指借款学生为我校全日制家庭经济困难本科生、研究生和第二学士学位学生。贷款人是指受理国家助学贷款的中国银行东营石大支行。第二章贷款模式第四条按照学生申办地点及工作流程不同，国家助学贷款分为校园地国家助学贷款与生源地信用助学贷款两种模式。全日制普通本专科生在同一学年不得重复申请获得校园地国家助学贷款和生源地信用助学贷款，只能选择申请办理其中一种贷款……"},{"id":381,"type":"judge","stem":"生源地信用助学贷款借款学生毕业后,在还款期内继续攻读学位的,可申请继续财政贴息。","options":[["A","对"],["B","错"]],"answer":["A"],"source":"《中国石油大学（华东）国家助学贷款实施办法》","category":"奖学金与资助","excerpt":"第三条本办法所指借款学生为我校全日制家庭经济困难本科生、研究生和第二学士学位学生。贷款人是指受理国家助学贷款的中国银行东营石大支行。第二章贷款模式第四条按照学生申办地点及工作流程不同，国家助学贷款分为校园地国家助学贷款与生源地信用助学贷款两种模式。全日制普通本专科生在同一学年不得重复申请获得校园地国家助学贷款和生源地信用助学贷款，只能选择申请办理其中一种贷款……"},{"id":382,"type":"judge","stem":"同一学年内,获得国家奖学金的家庭经济困难学生可以同时申请并获得国家助学金,但不能同时获得国家励志奖学金。","options":[["A","对"],["B","错"]],"answer":["A"],"source":"《中国石油大学（华东）“国家奖学金”、“国家励志奖学金”、“国家助学金”评选实施细则》","category":"奖学金与资助","excerpt":"第二十四条各学院（部）要通过多种措施加强对获奖、受助学生自立自强、诚信感恩的教育，引导获奖、受助学生合理使用奖助学金，树立正确的消费观念。第七章奖助学金的发放第二十五条学校在收到教育部全国学生资助管理中心拨付的国家奖学金、国家励志奖学金、国家助学金后，于每年12月31日前将国家奖学金、国家励志奖学金一次性发放给获奖学生，并颁发荣誉证书，记入学生的学籍档案。国……"},{"id":383,"type":"judge","stem":"十大学生标兵的事迹将通过校报、网络等媒体进行广泛宣传,并将在此范围内推荐山东省十大优秀学生人选。","options":[["A","对"],["B","错"]],"answer":["A"],"source":"《中国石油大学（华东）十大学生标兵评选实施细则》","category":"其他","excerpt":"四、奖励事项：十大学生标兵事迹将通过校报、网络等媒体进行广泛宣传，并将在此范围内推荐山东省十大优秀学生人选。"},{"id":384,"type":"judge","stem":"个别同学出现违纪行为是个人行为，不应该让其他班级同学受到牵连，其所在班级仍然具有参评先进班集体的资格，但应按相关规定扣除一部分分数。","options":[["A","对"],["B","错"]],"answer":["B"],"source":"《中国石油大学（华东）先进班集体、优秀学生、优秀学生干部评选标准》","category":"优良学风班","excerpt":"一、先进班集体评选标准1.班集体成员热爱祖国，拥护党的路线、方针、政策，积极培育和践行社会主义核心价值观，政治上积极要求进步，具有较高的思想政治素质，自觉维护国家和学校的稳定团结。2.班委成员政治坚定，作风优良，勇于创新，团结协作，以身作则，凝聚力强，能充分发挥班委在班级中的核心作用，带领全班同学积极开展思想教育、科技文化和文娱体育活动，课余活动丰富多彩。3……"},{"id":385,"type":"judge","stem":"同一学年内,获得国家奖学金、国家励志奖学金的学生只要条件符合，可重复获得其它1000元（含1000元）以上奖学金。","options":[["A","对"],["B","错"]],"answer":["B"],"source":"《中国石油大学（华东）“国家奖学金”、“国家励志奖学金”、“国家助学金”评选实施细则》","category":"奖学金与资助","excerpt":"第二十四条各学院（部）要通过多种措施加强对获奖、受助学生自立自强、诚信感恩的教育，引导获奖、受助学生合理使用奖助学金，树立正确的消费观念。第七章奖助学金的发放第二十五条学校在收到教育部全国学生资助管理中心拨付的国家奖学金、国家励志奖学金、国家助学金后，于每年12月31日前将国家奖学金、国家励志奖学金一次性发放给获奖学生，并颁发荣誉证书，记入学生的学籍档案。国……"},{"id":386,"type":"judge","stem":"学生违反法律法规，并依照有关法律追究其法律责任的，学校应以法律优先，不再予以其校内处分。","options":[["A","对"],["B","错"]],"answer":["B"],"source":"《中国石油大学（华东）学生纪律处分规定》","category":"学生纪律处分","excerpt":"第三条学校给予学生处分，应当坚持教育与惩戒相结合，与学生违法、违纪行为的性质和过错的严重程度相适应。学校对学生的处分，要做到证据充分、依据明确、定性准确、程序正当、处分适当。第二章处分的种类和适用第四条学生有违反法律法规的行为，应依照有关法律规定追究法律责任，同时依照本规定给予纪律处分。"},{"id":387,"type":"judge","stem":"在违纪过程中,主动有效地制止事件（事态）发生、发展的，可以减轻处分。","options":[["A","对"],["B","错"]],"answer":["A"],"source":"《中国石油大学（华东）学生纪律处分规定》","category":"学生纪律处分","excerpt":"第七条学生有以下情形之一的，可以从轻或者减轻处分：（一）在违纪过程中，主动有效地制止事件（事态）发生、发展；（二）主动交代错误事实，承认错误，且有明显悔改表现；（三）积极配合有关部门调查、核实情况或者提供重要证据、线索，能主动提供情况揭发他人违纪行为并经查证属实；（四）被他人胁迫或者诱骗，并能主动揭发事件；（五）其他可以从轻或者减轻处分的情形。"},{"id":388,"type":"judge","stem":"主动交待错误事实,承认错误,且有明显悔改表现的，可以减轻处分。","options":[["A","对"],["B","错"]],"answer":["A"],"source":"《中国石油大学（华东）学生纪律处分规定》","category":"学生纪律处分","excerpt":"第七条学生有以下情形之一的，可以从轻或者减轻处分：（一）在违纪过程中，主动有效地制止事件（事态）发生、发展；（二）主动交代错误事实，承认错误，且有明显悔改表现；（三）积极配合有关部门调查、核实情况或者提供重要证据、线索，能主动提供情况揭发他人违纪行为并经查证属实；（四）被他人胁迫或者诱骗，并能主动揭发事件；（五）其他可以从轻或者减轻处分的情形。"},{"id":389,"type":"judge","stem":"积极配合有关部门调查、核实情况或者提供重要证据、线索,能主动提供情况揭发他人违纪行为并经查证属实的，可以减轻处分。","options":[["A","对"],["B","错"]],"answer":["A"],"source":"《中国石油大学（华东）学生纪律处分规定》","category":"学生纪律处分","excerpt":"第七条学生有以下情形之一的，可以从轻或者减轻处分：（一）在违纪过程中，主动有效地制止事件（事态）发生、发展；（二）主动交代错误事实，承认错误，且有明显悔改表现；（三）积极配合有关部门调查、核实情况或者提供重要证据、线索，能主动提供情况揭发他人违纪行为并经查证属实；（四）被他人胁迫或者诱骗，并能主动揭发事件；（五）其他可以从轻或者减轻处分的情形。"},{"id":390,"type":"judge","stem":"被他人胁迫或者诱骗,并能主动揭发事件，可以减轻处分。","options":[["A","对"],["B","错"]],"answer":["A"],"source":"《中国石油大学（华东）学生纪律处分规定》","category":"学生纪律处分","excerpt":"第七条学生有以下情形之一的，可以从轻或者减轻处分：（一）在违纪过程中，主动有效地制止事件（事态）发生、发展；（二）主动交代错误事实，承认错误，且有明显悔改表现；（三）积极配合有关部门调查、核实情况或者提供重要证据、线索，能主动提供情况揭发他人违纪行为并经查证属实；（四）被他人胁迫或者诱骗，并能主动揭发事件；（五）其他可以从轻或者减轻处分的情形。"},{"id":391,"type":"judge","stem":"曾为学校获得过较高荣誉的，可凭对学校的突出贡献减轻处分。","options":[["A","对"],["B","错"]],"answer":["B"],"source":"《中国石油大学（华东）学生纪律处分规定》","category":"学生纪律处分","excerpt":"第十二条学生应当诚实守信，遵从学术规范，恪守学术道德，遵守保护知识产权的有关规定。对学生学业、学术、品行等方面有严重失信行为的，可按相关规定给予相应的纪律处分，对违背学术诚信的，学校将对其获得学位及学术称号、荣誉等 处分。","options":[["A","对"],["B","错"]],"answer":["A"],"source":"《中国石油大学（华东）学生纪律处分规定》","category":"学生纪律处分","excerpt":"第十九条对无故缺席不参加教育教学计划规定的活动者，情节严重的，给予如下处分，以一学期为限计算：（一）累计无故缺席10~19学时者，给予警告处分；（二）累计无故缺席20~39学时者，给予严重警告处分；（三）累计无故缺席40~59学时者，给予记过处分；（四）累计无故缺席60~80学时者，给予留校察看处分；（五）受到留校察看处分，经教育不改，因无故缺席再次达到纪律……"},{"id":415,"type":"judge","stem":"对无故缺席不参加教育教学计划规定的活动者,情节严重的,应给与一定处分。辅导员及班委有责任做好日常考勤，自入学起算，建个人档案。","options":[["A","对"],["B","错"]],"answer":["B"],"source":"《中国石油大学（华东）学生纪律处分规定》","category":"学生纪律处分","excerpt":"第十九条对无故缺席不参加教育教学计划规定的活动者，情节严重的，给予如下处分，以一学期为限计算：（一）累计无故缺席10~19学时者，给予警告处分；（二）累计无故缺席20~39学时者，给予严重警告处分；（三）累计无故缺席40~59学时者，给予记过处分；（四）累计无故缺席60~80学时者，给予留校察看处分；（五）受到留校察看处分，经教育不改，因无故缺席再次达到纪律……"},{"id":416,"type":"judge","stem":"考试结束后，应将试卷、答题卡、答题纸一律交予监考老师，草稿纸不做要求。","options":[["A","对"],["B","错"]],"answer":["B"],"source":"《中国石油大学（华东）学生纪律处分规定》","category":"学生纪律处分","excerpt":"第二十条对违反考试纪律者的处分：对不遵守考场纪律，不服从考试工作人员的安排与要求，有下列行为之一的，认定为违反考试纪律：（一）未按考场规则就座；（二）携带规定以外的物品进入考场或者未放在指定位置；（三）不按规定自带空白答题纸或者草稿纸；（四）未经监考人员允许借用他人的书、笔记、资料、计算器等物品；（五）考试中东张西望，企图偷看他人试卷，不服从考试工作人员管理……"},{"id":417,"type":"judge","stem":"携带与考试内容相关的文字材料或者存储有与考试内容相关资料的电子设备参加考试的,给予记过处分,情节严重的,给予留校察看处分。","options":[["A","对"],["B","错"]],"answer":["A"],"source":"《中国石油大学（华东）学生纪律处分规定》","category":"学生纪律处分","excerpt":"第二十一条对考试作弊者的处分：违背考试公平、公正原则，以不正当手段获得或者企图获得试题答案、考试成绩的，认定为考试作弊。（一）携带与考试内容相关的文字材料或者存储有与考试内容相关资料的电子设备参加考试的，给予记过处分，情节严重的，给予留校察看处分；（二）考试过程中直接或以借用工具书、文具、计算器等方式传接与考试内容相关信息的，给予记过处分，情节严重的，给予留……"},{"id":418,"type":"judge","stem":"考试过程中直接或以借用工具书、文具、计算器等方式传接与考试内容相关信息的,给予记过处分,情节严重的,给予留校察看处分。","options":[["A","对"],["B","错"]],"answer":["A"],"source":"《中国石油大学（华东）学生纪律处分规定》","category":"学生纪律处分","excerpt":"第二十一条对考试作弊者的处分：违背考试公平、公正原则，以不正当手段获得或者企图获得试题答案、考试成绩的，认定为考试作弊。（一）携带与考试内容相关的文字材料或者存储有与考试内容相关资料的电子设备参加考试的，给予记过处分，情节严重的，给予留校察看处分；（二）考试过程中直接或以借用工具书、文具、计算器等方式传接与考试内容相关信息的，给予记过处分，情节严重的，给予留……"},{"id":419,"type":"judge","stem":"故意损毁试卷、答题卡、答题纸等考试材料的,给予记过处分,情节严重的,给予留校察看处分。","options":[["A","对"],["B","错"]],"answer":["A"],"source":"《中国石油大学（华东）学生纪律处分规定》","cate 者开除学籍处分；（三……"},{"id":441,"type":"judge","stem":"以暴力、威胁、贿赂等方式干扰证人作证或者指使他人作伪证者,视情节轻重,给予记过、留校察看或者开除学籍处分。","options":[["A","对"],["B","错"]],"answer":["A"],"source":"《中国石油大学（华东）学生纪律处分规定》","category":"学生纪律处分","excerpt":"第二十九条对干扰违纪行为调查者的处分：（一）包庇、纵容违纪人员，造成不良影响者，给予严重警告处分；（二）作伪证，或者帮助违纪人员毁灭证据，给调查造成困难者，视情节轻重，给予严重警告或者记过处分；（三）以暴力、威胁、贿赂等方式干扰证人作证或者指使他人作伪证者，视情节轻重，给予记过、留校察看或者开除学籍处分。"},{"id":442,"type":"judge","stem":"处分告知书及处分决定书,应当直接送达学生本人,学生拒绝签收的,以本人拒收的实际情况记录作知情送达处理。","options":[["A","对"],["B","错"]],"answer":["B"],"source":"《中国石油大学（华东）学生纪律处分规定》","category":"学生纪律处分","excerpt":"第三十六条处分告知书及处分决定书，应当直接送达学生本人，学生拒绝签收的，以留置方式送达；已离校的，采取邮寄方式送达；难于联系的，利用学校网站、新闻媒体等以公告方式送达。"},{"id":443,"type":"judge","stem":"已离校的,采取邮寄的方式送达处分告知书及处分决定书，难于联系的,利用学校网站、新闻媒体等以公告方式送达。","options":[["A","对"],["B","错"]],"answer":["A"],"source":"《中国石油大学（华东）学生纪律处分规定》","category":"学生纪律处分","excerpt":"第三十六条处分告知书及处分决定书，应当直接送达学生本人，学生拒绝签收的，以留置方式送达；已离校的，采取邮寄方式送达；难于联系的，利用学校网站、新闻媒体等以公告方式送达。"},{"id":444,"type":"judge","stem":"学生在处分期间内表现良好,未再发生违纪行为的,处分期满后,由本人申请,学院（部）审核,主管部门召开专门会议审议批准,可予以解除,并以书面形式通知本人。","options":[["A","对"],["B","错"]],"answer":["A"],"source":"《中国石油大学（华东）学生纪律处分规定》","category":"学生纪律处分","excerpt":"第三十七条学生在处分期间内表现良好，未再发生违纪行为的，处分期满后，由本人申请，学院（部）审核，主管部门召开专门会议审议批准，可予以解除，并以书面形式通知本人。"},{"id":445,"type":"judge","stem":"受处分学生因表现良好解除处分的，其处分及解除处分材料不归入学校文书档案和本人档案。","options":[["A","对"],["B","错"]],"answer":["B"],"source":"《中国石油大学（华东）学生纪律处分规定》","category":"学生纪律处分","excerpt":"第四十一条处分决定、解除处分决定自下达之日起生效。学生的处分及解除处分材料归入学校文书档案和本人档案。第五章附则第四十二条我校保留学籍赴校外参加校际交流或联合培养的学生，在交流期间发生违纪行为的，参照本规定执行；若所在校际交流或联合培养的单位已给予处分的，我校不再追加处分。在我校借读的、进修的学生，在借读或进修期间发生违纪行为的，视情况参照本规定执行或将违纪……"},{"id":446,"type":"judge","stem":"学生心理健康教育中心的每一位心理咨询老师,将以真诚的心,接纳,尊重每一位来访的学生,中心遵循为来访者保密的原则。","options":[["A","对"],["B","错"]],"answer":["A"],"source":"《心理咨询来访者须知》","category":"心理咨询","excerpt":"六、读者借阅图书资料逾期、损坏或遗失的处理。根据石大东发暡1996暢100号文件规定，对读者借阅图书资料逾期、损坏及遗失的处理规定如下。1.所借图书超过借阅期限，须将超期图书归还或续借后，方能继续借书。2.读者如遗失所借图书资料，需在应还日期之前向唐岛湾校区图书馆总馆一楼大厅总服务台或古镇口东区学习中心三楼服务台、古镇口西区图书馆二楼服务台登记，并在1个月内……"},{"id":447,"type":"judge","stem":"根据“第二课堂成绩单”制度要求，若第二课堂学分在毕业前不能满足毕业要求，能按时正常毕业。","options":[["A","对"],["B","错"]],"answer":["B"],"source":"中国石油大学(华东)“第二课堂成绩单实施细则”","category":"自主发展计划","excerpt":"第四条校内各有关单位、各学院（部）负责第二课堂活动的内容设计和组织实施，通过优化项目供给，切实提升第二课堂活动品质，满足学生素质拓展和修读学分的需求；学生根据第二课堂的教育教学要求，结合自己的专业、能力、特长、兴趣和爱好，自主选择参加相应的第二课堂活动和课程，取得规定的学分。第二章课程设置第五条“第二课堂成绩单”制度设置的5类课程具体为：（一）思想成长类，主……"},{"id":448,"type":"judge","stem":"早进实验室、早进团队、早进项目, 为优秀生继续深造提供发展平台,学校决定实施优秀本科生“ 三进提”升计划","options":[["A","对"],["B","错"]],"answer":["A"],"source":"优秀本科生\"三进\"提升计划实施办法","category":"三进提升计划","excerpt":"中国石油大学（华东）优秀本科生“三进”提升计划实施办法（中石大东发[2020]18号）第一章总则第一条为推进本科人才培养模式改革，促使优秀本科生（以下简称优秀生）早进实验室、早进团队、早进项目，为优秀生继续深造提供发展平台，学校决定实施优秀本科生“三进”提升计划（以下简称该计划），特制定本办法。"},{"id":449,"type":"judge","stem":"对于“三进”培养周期的考核合格的优秀生，可获得自主发展计划创新创业类2学分","options":[["A","对"],["B","错"]],"answer":["A"],"source":"优秀本科生\"三进\"提升计划实施办法","category":"三进提升计划","excerpt":"第十五条参与该计划培养优秀生是教授岗位职责和聘期任务，教授在一个岗位聘期内应指导至少一名该计划优秀生。第六章政策支持第十六条学校为该计划实施提供政策和激励保障。优秀生除享有本科生相关奖励外，还享有该计划相关激励和政策支持。1.在优秀生同等参评“创新创业实践卓越之星”奖学金的基础上，另外增设该计划优秀生卓越奖，每学年评定一次。优秀生卓越奖与“创新创业实践卓越之……"},{"id":450,"type":"judge","stem":"对于“三进”培养周期的考核合格的优秀生，在满足学校推荐免试研究生基本条件基础上, 培养周期考核合格的优秀生,管理院部研究生推免领导小组同意,可获得推荐免试研究生资格。","options":[["A","对"],["B","错"]],"answer":["A"],"source":"优秀本科生\"三进\"提升计划实施办法","category":"三进提升计划","excerpt":"第十五条参与该计划培养优秀生是教授岗位职责和聘期任务，教授在一个岗位聘期内应指导至少一名该计划优秀生。第六章政策支持第十六条学校为该计划实施提供政策和激励保障。优秀生除享有本科生相关奖励外，还享有该计划相关激励和政策支持。1.在优秀生同等参评“创新创业实践卓越之星”奖学金的基础上，另外增设该计划优秀生卓越奖，每学年评定一次。优秀生卓越奖与“创新创业实践卓越之……"},{"id":451,"type":"judge","stem":"获国家级银奖（一等奖） 的项目,团队成员本科生中排前3,经审核认定做出重要贡献者,可获得推荐免试攻读研究生资格","options":[["A","对"],["B","错"]],"answer":["A"],"source":"本科生学科竞赛管理办法","category":"学科竞赛","excerpt":"五、保障与激励1.学校设立学科竞赛专项基金，用于资助竞赛报名费、差旅费、材料消耗费和资料费等。资助经费必须全部用于竞赛本身。2.竞赛费用采取学校与承办单位共同承担的方式，鼓励各承办单位积极筹措资金用于学科竞赛的开展。3.鼓励企业或事业单位等为竞赛提供一定额度的赞助经费，提供赞助的单位经竞赛主办单位同意，可以获得竞赛冠名权。4.凡国家一等奖及以上获得者，如主办……"},{"id":452,"type":"judge","stem":"获省级金奖（ 特等奖） 的项目, 本科生作为项目负责人, 可获得推荐免试攻读研究生资格","options":[["A","对"],["B","错"]],"answer":["A"],"source":"本科生学科竞赛管理办法","category":"学科竞赛","excerpt":"二、组织与管理1.教务处为学科竞赛的管理部门，负责竞赛的管理与协调，主要包括制定竞赛管理办法、认定竞赛类别、确定竞赛承办单位、组织竞赛的总结、交流与奖励等工作。2.各教学单位为相关学科竞赛的承办单位，具体负责竞赛的组织与实施，主要包括竞赛的宣传动员、报名、指导教师配备、培训、参赛、材料归档和竞赛所需的仪器、设备、场地等条件的提供等工作。3.对省级及以上学科竞……"},{"id":453,"type":"judge","stem":"对在创新创业实践活动中取得优秀成绩的本科生,学校给予自主发展计划学分认定、综合素质测评加分、同层次成果 认定等奖励,并在研究生“推免”工作中予以政策倾斜。","options":[["A","对"],["B","错"]],"answer":["A"],"source":"本科生学科竞赛管理办法","category":"学科竞赛","excerpt":"五、保障与激励1.学校设立学科竞赛专项基金，用于资助竞赛报名费、差旅费、材料消耗费和资料费等。资助经费必须全部用于竞赛本身。2.竞赛费用采取学校与承办单位共同承担的方式，鼓励各承办单位积极筹措资金用于学科竞赛的开展。3.鼓励企业或事业单位等为竞赛提供一定额度的赞助经费，提供赞助的单位经竞赛主办单位同意，可以获得竞赛冠名权。4.凡国家一等奖及以上获得者，如主办……"},{"id":454,"type":"multi","stem":"“第二课堂成绩单”制度设置的课程具体为：","options":[["A","思想成长类"],["B","创新创业类"],["C","社会实践与志愿服务类"],["D","文体发展类"],["E","工作履历与技能培训类"]],"answer":["A","B","C","D","E"],"source":"中国石油大学(华东)“第二课堂成绩单实施细则”","category":"自主发展计划","excerpt":"第四条校内各有关单位、各学院（部）负责第二课堂活动的内容设计和组织实施，通过优化项目供给，切实提升第二课堂活动品质，满足学生素质拓展和修读学分的需求；学生根据第二课堂的教育教学要求，结合自己的专业、能力、特长、兴趣和爱好，自主选择参加相应的第二课堂活动和课程，取得规定的学分。第二章课程设置第五条“第二课堂成绩单”制度设置的5类课程具体为：（一）思想成长类，主……"},{"id":455,"type":"multi","stem":"大学生创业基金主要来源于（）","options":[["A","学校拨款"],["B","个人储蓄"],["C","社会捐赠"],["D","创业项目自身投资收益"]],"answer":["A","C","D"],"source":"中国石油大学(华东)大学生创业实践管理办法","category":"创新创业","excerpt":"第七条基地管理服务：1.入驻的项目由办公室统一管理，应定期向办公室提交项目运行情况报告，并接受中期检查和期满验收考核。2.入驻的项目可免缴场地租用费，免费享受创业培训、创业指导等服务，免费参加创业经验交流等活动。3.入驻的项目提前退出时，须提前提出书面申请，报办公室审核后，办理退出手续。第四章创业基金第八条创业基金主要来源于学校拨款、社会捐赠及创业项目自身投……"},{"id":456,"type":"fillin","stem":"学校于（　）年建校，时称北京石油学院，（　）年迁校山东，改称华东石油学院。（　）年，学校更名为石油大学。（　）年1月，学校更名为中国石油大学。","options":[],"answer":[["1953"],["1969"],["1988"],["2005"]],"source":"《学校概况》校史","note":"","category":"学校概况","excerpt":"中国石油大学（华东）学生文明行为规范一、品德修养篇（一）爱国荣校1.认真学习马克思列宁主义、毛泽东思想、邓小平理论、“三个代表”重要思想、科学发展观理论和习近平总书记系列重要讲话精神，坚持四项基本原则，拥护党的政策，维护党和国家的利益，关心时事，在思想和行动上与党中央保持一致。2.热爱祖国，坚决维护祖国统一和民族团结，坚决与分裂祖国和破坏民族团结的行为作斗争……"},{"id":457,"type":"fillin","stem":"除开除学籍处分以外，给予学生处分设置一定期限：警告处分期限为（　）个月，严重警告处分期限为（　）个月，记过处分期限为（　）个月，留校察看处分期限为（　）个月。","options":[],"answer":[["6","六"],["8","八"],["10","十"],["12","十二"]],"source":"《中国石油大学（华东）学生纪律处分规定》","note":"","category":"学生纪律处分","excerpt":"第六条除开除学籍处分以外，给予学生处分设置一定期限，警告处分期限为6个月，严重警告处分期限为8个月，记过处分期限为10个月，留校察看处分期限为12个月，处分期限从处分决定下达之日起计算。受纪律处分的学生，其处分期限可减至退学或者毕业等离校日止。"},{"id":458,"type":"fillin","stem":"修读双学位的学生，获得主修专业学位但达不到双学位专业和教学培养方案要求的，低于（　）学分者，其所修双学位课程作为通识教育选修课记入《中国石油大学（华东）学生成绩记载表》。","options":[],"answer":[["30","30学分"]],"source":"《中国石油大学（华东）本科生双学位培养管理办法》","note":"","category":"双学位与辅修","excerpt":"二、跨专业学习介绍1.跨学科课程为培养学生的跨领域知识融通能力，拓宽学生多学科思维视野，我校在2024版本科专业人才培养方案中设置了跨学科课程，学生须跨专业类选择修读其他专业的专业课程不少于4学分。从2024级学生开始，4个学分跨学科课程是完成学业的必要条件（具体以本专业培养方案为准）。同学们在选课的时候，根据自己的兴趣合理安排修读计划。如果同学们学有余力，……"},{"id":459,"type":"fillin","stem":"修读双学位的学生，获得主修专业学位但达不到双学位专业和教学培养方案要求的，若所修双学位课程的总学分（　）学分者，颁发辅修专业证书。","options":[],"answer":[["≥25","25","达到25","不少于25"]],"source":"《中国石油大学（华东）本科生双学位培养管理办法》","note":"题库单选第25题：总学分≥25学分者颁发辅修专业证书。","category":"双学位与辅修","excerpt":"二、跨专业学习介绍1.跨学科课程为培养学生的跨领域知识融通能力，拓宽学生多学科思维视野，我校在2024版本科专业人才培养方案中设置了跨学科课程，学生须跨专业类选择修读其他专业的专业课程不少于4学分。从2024级学生开始，4个学分跨学科课程是完成学业的必要条件（具体以本专业培养方案为准）。同学们在选课的时候，根据自己的兴趣合理安排修读计划。如果同学们学有余力，……"},{"id":460,"type":"fillin","stem":"辅修专业培养方案由辅修专业开设院部制定，所设课程应是本专业基础课程和专业课，总学分一般为（　）左右。","options":[],"answer":[["30","30学分"]],"source":"《中国石油大学（华东）本科生辅修培养管理办法》","note":"（原整理标注答案为30）","category":"双学位与辅修","excerpt":"二、跨专业学习介绍1.跨学科课程为培养学生的跨领域知识融通能力，拓宽学生多学科思维视野，我校在2024版本科专业人才培养方案中设置了跨学科课程，学生须跨专业类选择修读其他专业的专业课程不少于4学分。从2024级学生开始，4个学分跨学科课程是完成学业的必要条件（具体以本专业培养方案为准）。同学们在选课的时候，根据自己的兴趣合理安排修读计划。如果同学们学有余力，……"},{"id":461,"type":"fillin","stem":"对于可以优先推荐免试攻读硕士研究生的优异生的数量约占本年级在校生总数的（　）左右。","options":[],"answer":[["3%","0.03","3％","百分之三"]],"source":"《本科生优异生培养实施办法》","note":"","category":"其他","excerpt":"第三条本办法所指借款学生为我校全日制家庭经济困难本科生、研究生和第二学士学位学生。贷款人是指受理国家助学贷款的中国银行东营石大支行。第二章贷款模式第四条按照学生申办地点及工作流程不同，国家助学贷款分为校园地国家助学贷款与生源地信用助学贷款两种模式。全日制普通本专科生在同一学年不得重复申请获得校园地国家助学贷款和生源地信用助学贷款，只能选择申请办理其中一种贷款……"},{"id":462,"type":"fillin","stem":"独立设置的实验（上机）课程，缺做实验（　）或缺交实验报告（　）及以上者，成绩以零分记载。","options":[],"answer":[["1/3","三分之一","1／3"],["1/3","三分之一","1／3"]],"source":"《中国石油大学（华东）本科实验教学管理办法》","note":"记住关键数据 1/3 以上，成绩以 0 分记载。","category":"实验教学与实习","excerpt":"第十九条独立设置的实验（上机）课程，缺做实验1/3或缺交实验报告1/3及以上者，成绩以零分记载。"},{"id":463,"type":"fillin","stem":"建校近70年来，学校形成了鲜明的办学特色。在新的历史时期，学校坚持特色发展、内涵发展、高质量发展，正向着“（　）”的办学目标奋力迈进。","options":[],"answer":[["中国特色石油领域中国一流大学"]],"source":"《学校概况》","note":"别写少字了。","category":"学校概况","excerpt":"中国石油大学（华东）学生文明行为规范一、品德修养篇（一）爱国荣校1.认真学习马克思列宁主义、毛泽东思想、邓小平理论、“三个代表”重要思想、科学发展观理论和习近平总书记系列重要讲话精神，坚持四项基本原则，拥护党的政策，维护党和国家的利益，关心时事，在思想和行动上与党中央保持一致。2.热爱祖国，坚决维护祖国统一和民族团结，坚决与分裂祖国和破坏民族团结的行为作斗争……"},{"id":464,"type":"fillin","stem":"学分学费按学生修读学分计收，学分收费标准为每学分（　）元。","options":[],"answer":[["100","100元","一百"]],"source":"《中国石油大学（华东）学分制收费管理暂行办法》","note":"","category":"学分制收费","excerpt":"第六条学分学费是学生选择修读课程并取得课程考核资格缴纳的费用。学分学费按学期计收，实行先选课后缴费。学校根据每学期学生选课情况，按照课程对应学分数与收费标准，在学生完成选课后即时收取。"},{"id":465,"type":"fillin","stem":"我校现有在校本科生近（　）人，研究生7000余人，留学生1100余人。","options":[],"answer":[["19000","19000人","1.9万","近19000"]],"source":"《学校概况》","note":"","category":"学校概况","excerpt":"第三条本办法所指借款学生为我校全日制家庭经济困难本科生、研究生和第二学士学位学生。贷款人是指受理国家助学贷款的中国银行东营石大支行。第二章贷款模式第四条按照学生申办地点及工作流程不同，国家助学贷款分为校园地国家助学贷款与生源地信用助学贷款两种模式。全日制普通本专科生在同一学年不得重复申请获得校园地国家助学贷款和生源地信用助学贷款，只能选择申请办理其中一种贷款……"},{"id":466,"type":"fillin","stem":"在中国国际“互联网+”大学生创新创业大赛获得金奖、银奖、铜奖，分别获得奖金（　）。","options":[],"answer":[["5万、3万、1万","50000、30000、10000","5万/3万/1万","50000/30000/10000","5万，3万，1万"]],"source":"《中国石油大学（华东）本科生创新成果奖励办法》","note":"金奖5万、银奖3万、铜奖1万。","category":"学科竞赛","excerpt":"三、激励措施学校设立创新创业奖励基金（300万元/年），用于表彰和奖励在创新创业实践活动中取得突出成绩的学生和在创新创业教育中做出突出贡献的教师。（一）面向学生的激励措施1.创新创业卓越奖（100万元/年）。“创新创业实践卓越之星”奖学金（40万元/年），“三进”提升计划优秀生卓越奖（10万元/年），用于奖励在创新创业科研和实践活动中取得优异成绩的学生，评选……"},{"id":467,"type":"fillin","stem":"学生免修课程应向所在院部提出书面申请，院部主管领导批准，经过考核，成绩达到（　）分以上，取得该课程学分。","options":[],"answer":[["70","70分","七十分"]],"source":"《中国石油大学（华东）本科生学籍管理规定》","note":"判断题如果说“及格及以上取得该学分”就是错的，必须要70分以上。","category":"学籍管理","excerpt":"第三十五条学生休学、保留学籍应向所在院部提出书面申请，并提交必要的证明，经院部审核，学校批准，办理相关手续。"},{"id":468,"type":"fillin","stem":"学生申请学分认定，应于每学期初（　）向所在院（部）提出申请，并提供能体现创新创业实践过程及成果的支撑材料，经院（部）创新创业教育领导小组认定、学校创新创业教育工作领导小组办公室审定后，报学校备案。","options":[],"answer":[["3周内","三周内","3周","前三周"]],"source":"《中国石油大学（华东）本科生创新创业学籍管理办法（试行）》","note":"","category":"创新创业","excerpt":"第十一条学生申请学分认定，应于每学期初3周内向所在院（部）提出申请，并提供能体现创新创业实践过程及成果的支撑材料，经院（部）创新创业教育领导小组认定、学校创新创业教育工作领导小组办公室审定后，报学校备案。必要时，由学校组织专家论证，通过者取得相应学分。因创业休学，未按时申请学分认定的，可复学后提出申请。"},{"id":469,"type":"fillin","stem":"学生对学校的处分决定有异议的，应在接到学校处分决定书之日起（　）日内，向学校学生申诉处理委员会提出书面申诉。","options":[],"answer":[["10","10日","十日"]],"source":"《中国石油大学（华东）学生申诉处理办法》","note":"","category":"申诉处理","excerpt":"第三十九条学生对学校的处分决定有异议的，可以在接到学校处分决定书之日起10日内，向学校学生申诉处理委员会提出书面申诉。学生申诉处理委员会对学生提出的申诉进行复查，作出复查决定。学生对复查决定有异议的，在接到学校复查决定书之日起15日内，可以向山东省教育厅提出书面申诉。"},{"id":470,"type":"fillin","stem":"国家助学贷款本专科生每人每年最高不超过（　）元。","options":[],"answer":[["8000","8000元","八千"]],"source":"《国家助学贷款管理规定》","note":"","category":"奖学金与资助","excerpt":"第三条本办法所指借款学生为我校全日制家庭经济困难本科生、研究生和第二学士学位学生。贷款人是指受理国家助学贷款的中国银行东营石大支行。第二章贷款模式第四条按照学生申办地点及工作流程不同，国家助学贷款分为校园地国家助学贷款与生源地信用助学贷款两种模式。全日制普通本专科生在同一学年不得重复申请获得校园地国家助学贷款和生源地信用助学贷款，只能选择申请办理其中一种贷款……"},{"id":471,"type":"fillin","stem":"凡结课（含免修）考核不及格的课程，可通过重新选课修读或补考取得该课程的学分。考核成绩合格但成绩不理想的课程，也可重新选课修读。在学校规定的最长学习年限内，重新选课修读（　）。","options":[],"answer":[["不限制次数","不限次数","不限制"]],"source":"《中国石油大学（华东）本科生学籍管理规定》","note":"","category":"学籍管理","excerpt":"第十七条凡结课（含免修）考核不及格的课程，可通过重新选课修读或补考取得该课程的学分。考核成绩合格，但成绩不理想的课程，也可重新选课修读。1.在学校规定的最长学习年限内，重新选课修读不限制次数，所有修读成绩均如实记载；2.补考时间为每学期的开学初，补考课程为前一学期考核不及格的必修或限选课程，且申请补考的课程成绩必须达50分（含）以上；3.实验课程、实习实训、……"},{"id":472,"type":"fillin","stem":"学校本科专业标准学制四年（建筑学专业学制五年），实行学分制管理和弹性学习年限，学生可在标准学制的基础上（　）或（　）毕业。","options":[],"answer":[["提前1年","提前一年","提前","提前1-2年"],["延长2年","延长两年","延长","推迟2年","推迟"]],"source":"《中国石油大学（华东）本科生学籍管理规定》","note":"原整理答案为“1、2”（提前1年/延长2年）。建筑学专业可延长至…以学籍管理规定为准。","category":"学籍管理","excerpt":"第三条学校本科专业标准学制四年（建筑学专业学制五年），实行学分制管理和弹性学习年限，学生可在标准学制的基础上提前一年或延长两年毕业。"},{"id":473,"type":"fillin","stem":"受资助项目如有盈利，根据项目收益情况，将项目净利润的（　）%上交学校大学生创业基金，用以滚动支持更多创业项目。","options":[],"answer":[["5","5%","百分之五"]],"source":"《中国石油大学（华东）大学生创业实践管理办法》","note":"","category":"创新创业","excerpt":"第十一条基金运作管理：1.受资助的项目应定期向办公室提交基金使用情况的财务报告和项目运行情况报告，并接受中期检查和期满验收考核。2.受资助的项目因客观原因需对目标、进度和经费等进行调整时，应向办公室提出书面申请，经审核通过方可执行。3.受资助的项目提前退出时，须提前提出书面申请，报办公室审核后，办理清算核销手续。4.受资助项目如有盈利，根据项目收益情况，将项……"},{"id":474,"type":"fillin","stem":"学生结业后（　）之内回校完成相关课程修读，达到本科培养方案规定的学分要求的，学校准予毕业，符合学士学位授予标准的，授予学士学位。","options":[],"answer":[["1年","一年","1"]],"source":"《中国石油大学（华东）本科生学籍管理规定》","note":"","category":"学籍管理","excerpt":"第四十六条学生毕业时未修满本科培养方案规定的学分要求，可申请延长学习年限或结业。1.延长学习年限（1）延长学习年限应由学生本人提出申请，所在院部审核批准后报教务处备案，但其累计在校时间不能超过学校规定的最长学习年限；（2）延长学习年限的学生，享受在校生待遇。2.结业（1）毕业时累计欠本科培养方案规定的学分要求15学分以内（含15学分）的学生，经本人申请，所在……"},{"id":475,"type":"fillin","stem":"专业注册学费是指以不同专业的（　）为基础，对不同专业收取的年度学费。","options":[],"answer":[["生均培养成本"]],"source":"《中国石油大学（华东）学分制收费管理暂行办法》","note":"","category":"学分制收费","excerpt":"第四条本办法所称学分制收费，是按照专业注册学费和学分学费两部分计收学费的收费管理制度。学分制收费执行政府定价或政府指导价。第二章收费项目及标准第五条专业注册学费是学生进行专业学习注册取得专业课程选修资格需缴纳的费用。专业注册学费由学校按照不同专业生均培养成本等因素合理确定。专业注册学费按学年计收。学校在每学年初向学生收取专业注册学费，为学生办理专业注册手续，……"},{"id":476,"type":"fillin","stem":"已知英语（4-2）3学分，数学（2-2）5学分，军事理论1学分，小李同学英语、数学、军理的成绩分别是85、98、91，那么小李同学的这三门功课的专业学习测评成绩绩点为（　）。","options":[],"answer":[["4.29","约4.29"]],"source":"《中国石油大学（华东）学生综合素质测评办法》","note":"计算方法：85/10-5=3.5，98/10-5=4.8，91/10-5=4.1，（3.5×3+4.8×5+4.1×1）/（3+5+1）≈4.29。","category":"综合素质测评","excerpt":"第七条各院部依据本办法，制定本院部学生综合素质测评实施细则。第三章测评流程第八条学生综合素质测评工作分个人自评、班级测评、年级测评、院部复核和学校审批五个步骤进行。（一）个人自评：学生根据自己日常表现，向班级测评小组提交相关证明材料。（二）班级测评：班级测评小组据实做好每名学生的专业学习、基础性素质和发展性素质测评工作。其中，基础性素质成绩根据记实和评议得出……"},{"id":477,"type":"fillin","stem":"凡我校本科生在取得本专业培养计划规定学分的同时，还需至少取得（　）个自主发展计划学分。","options":[],"answer":[["10","10个","十"]],"source":"《中国石油大学（华东）本科生自主发展计划》","note":"","category":"自主发展计划","excerpt":"二、跨专业学习介绍1.跨学科课程为培养学生的跨领域知识融通能力，拓宽学生多学科思维视野，我校在2024版本科专业人才培养方案中设置了跨学科课程，学生须跨专业类选择修读其他专业的专业课程不少于4学分。从2024级学生开始，4个学分跨学科课程是完成学业的必要条件（具体以本专业培养方案为准）。同学们在选课的时候，根据自己的兴趣合理安排修读计划。如果同学们学有余力，……"},{"id":478,"type":"fillin","stem":"创业基金初期拨付资助金额的（　）。","options":[],"answer":[["50%","0.5","50％","一半","百分之五十"]],"so
