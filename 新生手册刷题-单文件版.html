<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0d5b9e">
  <title>新生手册刷题</title>
  <style>
/* ============ 基础 ============ */
:root {
  --primary: #0d5b9e;
  --primary-deep: #094a80;
  --primary-light: #e8f2fb;
  --accent: #f5a623;
  --bg: #f0f4f8;
  --card: #ffffff;
  --text: #1f2d3d;
  --text-sub: #6b7a8c;
  --line: #e3e9ef;
  --green: #1e9e5a;
  --green-bg: #e9f9f0;
  --red: #d93838;
  --red-bg: #fdeeee;
  --radius: 14px;
  --shadow: 0 2px 10px rgba(16, 42, 67, 0.07);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html { -webkit-text-size-adjust: 100%; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.65;
  font-size: 15px;
}
.app { max-width: 760px; margin: 0 auto; min-height: 100vh; display: flex; flex-direction: column; }

button { font-family: inherit; font-size: 15px; cursor: pointer; border: none; background: none; }
input[type="text"] { font-family: inherit; font-size: 15px; }

/* ============ 通用组件 ============ */
.topbar {
  position: sticky; top: 0; z-index: 20;
  display: flex; align-items: center; gap: 10px;
  padding: 12px 16px;
  background: linear-gradient(135deg, var(--primary) 0%, #1173c4 100%);
  color: #fff;
}
.topbar .title { font-size: 17px; font-weight: 600; flex: 1; }
.topbar .btn-ghost {
  color: #fff; padding: 5px 12px; border-radius: 999px;
  background: rgba(255, 255, 255, 0.16); font-size: 13px;
}
.topbar .btn-ghost:active { background: rgba(255, 255, 255, 0.28); }

.page { padding: 16px; flex: 1; }

.card {
  background: var(--card); border-radius: var(--radius);
  box-shadow: var(--shadow); padding: 18px 16px; margin-bottom: 14px;
}

.btn-main {
  display: block; width: 100%; padding: 14px;
  background: linear-gradient(135deg, var(--primary) 0%, #1173c4 100%);
  color: #fff; border-radius: 12px; font-size: 17px; font-weight: 600;
  letter-spacing: 2px;
}
.btn-main:active { opacity: 0.88; }
.btn-main[disabled] { opacity: 0.5; cursor: not-allowed; }
.btn-sub {
  display: block; width: 100%; padding: 12px;
  background: var(--primary-light); color: var(--primary-deep);
  border-radius: 12px; font-size: 15px; font-weight: 500;
}
.btn-sub:active { opacity: 0.8; }
.btn-row { display: flex; gap: 10px; }
.btn-row > button { flex: 1; }

.badge {
  display: inline-block; padding: 1px 9px; border-radius: 999px;
  font-size: 12px; line-height: 1.7; margin-right: 6px; white-space: nowrap;
}
.badge.type { background: var(--primary-light); color: var(--primary-deep); }
.badge.cat { background: #f2f0eb; color: #8a7440; }
.badge.ok { background: var(--green-bg); color: var(--green); }
.badge.bad { background: var(--red-bg); color: var(--red); }

/* ============ 首页 ============ */
.hero {
  background: linear-gradient(135deg, var(--primary) 0%, #1173c4 100%);
  border-radius: var(--radius); color: #fff;
  padding: 26px 20px 22px; margin-bottom: 14px; box-shadow: var(--shadow);
}
.hero h1 { font-size: 24px; letter-spacing: 1px; }
.hero p { opacity: 0.85; font-size: 13px; margin-top: 4px; }
.hero .total {
  margin-top: 14px; display: flex; align-items: baseline; gap: 8px;
}
.hero .total b { font-size: 30px; font-weight: 700; }
.hero .total span { font-size: 13px; opacity: 0.85; }

.stat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 14px; }
.stat-cell {
  background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow);
  padding: 12px 8px; text-align: center;
}
.stat-cell b { display: block; font-size: 19px; color: var(--primary-deep); }
.stat-cell span { font-size: 12px; color: var(--text-sub); }

.section-title { font-size: 15px; font-weight: 600; margin: 4px 2px 10px; display: flex; align-items: center; justify-content: space-between; }
.section-title .hint { font-size: 12px; color: var(--text-sub); font-weight: 400; }

.chip-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.chip-grid.type-grid { grid-template-columns: repeat(4, 1fr); }
.chip {
  position: relative; text-align: center; padding: 10px 4px;
  border: 1.5px solid var(--line); border-radius: 10px;
  background: #fff; color: var(--text-sub); font-size: 13px;
  transition: all .15s;
}
.chip b { display: block; font-size: 17px; color: var(--text); font-weight: 600; }
.chip.on { border-color: var(--primary); background: var(--primary-light); color: var(--primary-deep); }
.chip.on b { color: var(--primary-deep); }
.chip.mini { padding: 6px 4px; font-size: 12.5px; }
.link-btn { color: var(--primary); font-size: 13px; }
.link-btn:active { opacity: .6; }

.wrong-entry {
  display: flex; align-items: center; gap: 12px;
  background: var(--card); border-radius: var(--radius);
  box-shadow: var(--shadow); padding: 16px; margin-bottom: 14px; width: 100%; text-align: left;
}
.wrong-entry .icon {
  width: 44px; height: 44px; border-radius: 12px; flex: none;
  background: var(--red-bg); color: var(--red);
  display: flex; align-items: center; justify-content: center; font-size: 22px;
}
.wrong-entry .info { flex: 1; }
.wrong-entry .info b { font-size: 15px; }
.wrong-entry .info span { display: block; font-size: 12.5px; color: var(--text-sub); }
.wrong-entry .arrow { color: var(--text-sub); font-size: 18px; }

/* ============ 答题页 ============ */
.quiz-top { padding: 10px 16px 12px; }
.quiz-top .meta { display: flex; justify-content: space-between; align-items: baseline; color: #fff; }
.quiz-top .meta .no { font-size: 16px; font-weight: 600; }
.quiz-top .meta .no b { font-size: 22px; }
.quiz-top .meta .timer { font-size: 13px; opacity: .9; font-variant-numeric: tabular-nums; }
.quiz-top .quit { background: rgba(255,255,255,.16); color: #fff; border-radius: 999px; padding: 3px 12px; font-size: 12.5px; margin-top: 6px; }

.anscard { display: grid; grid-template-columns: repeat(10, 1fr); gap: 6px; padding: 12px 16px 4px; }
.anscard button {
  aspect-ratio: 1; border-radius: 8px; background: rgba(255,255,255,.92);
  color: var(--text-sub); font-size: 12.5px; font-weight: 600;
}
.anscard button.answered { background: #fff; color: var(--primary-deep); box-shadow: inset 0 0 0 2px var(--primary); }
.anscard button.current { background: var(--accent); color: #fff; box-shadow: none; }

.qcard { animation: fadein .18s ease; }
@keyframes fadein { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
.qcard .qhead { display: flex; flex-wrap: wrap; align-items: center; margin-bottom: 10px; }
.qcard .stem { font-size: 16px; white-space: pre-wrap; }
.qcard .note {
  margin-top: 10px; font-size: 12.5px; color: #8a7440;
  background: #faf6ec; border-radius: 8px; padding: 8px 10px;
}

.opts { margin-top: 16px; display: flex; flex-direction: column; gap: 10px; }
.opt {
  display: flex; align-items: flex-start; gap: 10px; text-align: left;
  padding: 12px 14px; border: 1.5px solid var(--line); border-radius: 12px;
  background: #fff; font-size: 15px; line-height: 1.55; color: var(--text);
  width: 100%;
}
.opt .letter {
  flex: none; width: 26px; height: 26px; border-radius: 50%;
  border: 1.5px solid #c3cfdb; color: var(--text-sub);
  display: flex; align-items: center; justify-content: center;
  font-size: 13px; font-weight: 600; margin-top: 1px;
}
.opt.on { border-color: var(--primary); background: var(--primary-light); }
.opt.on .letter { background: var(--primary); border-color: var(--primary); color: #fff; }
.opt.correct { border-color: var(--green); background: var(--green-bg); }
.opt.correct .letter { background: var(--green); border-color: var(--green); color: #fff; }
.opt.wrong { border-color: var(--red); background: var(--red-bg); }
.opt.wrong .letter { background: var(--red); border-color: var(--red); color: #fff; }

.judge-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 16px; }
.judge-btns .opt { justify-content: center; align-items: center; padding: 18px; font-size: 17px; font-weight: 600; }
.judge-btns .opt .letter { display: none; }

.fills { margin-top: 16px; display: flex; flex-direction: column; gap: 10px; }
.fill-item { display: flex; align-items: center; gap: 10px; }
.fill-item label { flex: none; font-size: 13px; color: var(--text-sub); width: 44px; }
.fill-item input {
  flex: 1; padding: 11px 12px; border: 1.5px solid var(--line); border-radius: 10px;
  outline: none; background: #fff; transition: border .15s;
}
.fill-item input:focus { border-color: var(--primary); }
.fill-item input.ok { border-color: var(--green); background: var(--green-bg); }
.fill-item input.bad { border-color: var(--red); background: var(--red-bg); }
.fill-item .std { flex: 1; font-size: 14px; padding: 8px 10px; border-radius: 8px; }

.quiz-nav { display: flex; gap: 10px; margin-top: 16px; }
.quiz-nav button {
  flex: 1; padding: 13px; border-radius: 12px; font-size: 15px; font-weight: 500;
  background: var(--primary-light); color: var(--primary-deep);
}
.quiz-nav button:disabled { opacity: .4; }
.quiz-nav button.primary {
  background: linear-gradient(135deg, var(--primary) 0%, #1173c4 100%);
  color: #fff; font-weight: 600;
}

/* 即时反馈面板 */
.feedback { margin-top: 16px; border-radius: 12px; padding: 14px; font-size: 14px; }
.feedback.good { background: var(--green-bg); color: var(--green); }
.feedback.bad { background: var(--red-bg); color: var(--red); }
.feedback b { font-size: 15px; }
.feedback .why { margin-top: 6px; color: var(--text-sub); font-size: 13px; }
.feedback .why em { font-style: normal; color: var(--text); }

/* ============ 结果页 ============ */
.score-card { text-align: center; padding: 26px 16px; }
.score-ring {
  width: 132px; height: 132px; margin: 0 auto 12px; border-radius: 50%;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  background: conic-gradient(var(--primary) var(--p, 0%), #e6edf3 0);
  position: relative;
}
.score-ring::before {
  content: ""; position: absolute; inset: 10px; border-radius: 50%; background: #fff;
}
.score-ring .val { position: relative; font-size: 32px; font-weight: 700; color: var(--primary-deep); }
.score-ring .val small { font-size: 14px; font-weight: 400; color: var(--text-sub); }
.score-ring .lab { position: relative; font-size: 12px; color: var(--text-sub); }
.score-card .sub { color: var(--text-sub); font-size: 13.5px; }
.score-card .sub b { color: var(--text); }
.score-card .sub .sep { margin: 0 8px; color: var(--line); }

.r-item { padding: 14px 0; border-bottom: 1px solid var(--line); }
.r-item:last-child { border-bottom: none; }
.r-item .qline { display: flex; gap: 8px; align-items: flex-start; }
.r-item .mark { flex: none; font-size: 13px; font-weight: 700; margin-top: 2px; }
.r-item.right .mark { color: var(--green); }
.r-item.wrong .mark { color: var(--red); }
.r-item .stem { font-size: 14.5px; }
.r-detail { margin-top: 8px; font-size: 13.5px; display: flex; flex-direction: column; gap: 3px; }
.r-detail .row { display: flex; gap: 6px; }
.r-detail .k { flex: none; color: var(--text-sub); }
.r-detail .v { color: var(--text); word-break: break-all; }
.r-detail .v.you-bad { color: var(--red); }
.r-detail .v.ans { color: var(--green); font-weight: 600; }
.r-detail .src { color: var(--text-sub); font-size: 12.5px; }
.r-detail .row.excerpt { background: #f7f9fb; border-radius: 8px; padding: 8px 10px; margin-top: 4px; }
.r-detail .row.excerpt .k { color: var(--primary-deep); }
.r-detail .row.excerpt .v { font-size: 13px; line-height: 1.7; color: var(--text); }
.r-detail .fill-line { padding: 2px 0; }
.r-detail .fill-line .u { margin-right: 6px; }

/* ============ 错题集 ============ */
.w-item { padding: 14px 0; border-bottom: 1px solid var(--line); }
.w-item:last-child { border-bottom: none; }
.w-item .head { display: flex; align-items: center; gap: 8px; }
.w-item .head .stem-s { flex: 1; font-size: 14px; overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; }
.w-item .cnt { flex: none; font-size: 12px; color: var(--red); background: var(--red-bg); border-radius: 999px; padding: 1px 8px; }
.w-item .cnt.ok { color: var(--green); background: var(--green-bg); }

/* ============ 错题背诵 ============ */
.recite-hint { margin-top: 16px; font-size: 13px; color: var(--text-sub); text-align: center; padding: 22px 0; }
.recite-opts .opt { pointer-events: none; }
.recite-reveal { margin-top: 16px; animation: fadein .18s ease; }
.recite-reveal .recite-ans {
  background: var(--green-bg); color: var(--green); font-weight: 600;
  border-radius: 10px; padding: 12px 14px; font-size: 15px;
}
.recite-reveal .recite-src {
  margin-top: 8px; font-size: 13px; color: var(--text-sub);
  background: #f7f9fb; border-radius: 10px; padding: 10px 12px; line-height: 1.7;
}
.w-item .del { flex: none; color: var(--text-sub); font-size: 17px; padding: 0 4px; }
.w-item .body { display: none; margin-top: 10px; font-size: 13.5px; }
.w-item.open .body { display: block; }
.w-item .body .stem-full { font-size: 14.5px; margin-bottom: 8px; white-space: pre-wrap; }
.w-item .body .opts-mini { display: flex; flex-direction: column; gap: 4px; margin-bottom: 8px; color: var(--text-sub); }
.w-item .body .opts-mini .is-ans { color: var(--green); font-weight: 600; }

.empty { text-align: center; color: var(--text-sub); padding: 40px 0; font-size: 14px; }
.empty .big { font-size: 40px; margin-bottom: 8px; }

/* ============ 弹窗 & Toast ============ */
.toast {
  position: fixed; left: 50%; bottom: 12vh; transform: translateX(-50%);
  background: rgba(23, 32, 43, 0.92); color: #fff; font-size: 13.5px;
  border-radius: 999px; padding: 9px 20px; z-index: 99;
  max-width: 86vw; text-align: center;
}
.modal-mask {
  position: fixed; inset: 0; background: rgba(15, 25, 36, 0.5); z-index: 90;
  display: flex; align-items: center; justify-content: center; padding: 24px;
}
.modal {
  background: #fff; border-radius: 16px; padding: 22px 18px; max-width: 340px; width: 100%;
  box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
}
.modal h3 { font-size: 16px; margin-bottom: 8px; }
.modal p { font-size: 14px; color: var(--text-sub); margin-bottom: 18px; }
.modal .btn-row button { padding: 10px; border-radius: 10px; }
.modal .btn-danger { background: var(--red); color: #fff; font-weight: 500; }
.modal .btn-cancel { background: #eef2f6; color: var(--text-sub); }

@media (min-width: 600px) {
  body { font-size: 16px; }
  .anscard { grid-template-columns: repeat(20, 1fr); }
  .chip-grid { grid-template-columns: repeat(4, 1fr); }
  .chip-grid.type-grid { grid-template-columns: repeat(4, 1fr); }
}

</style>
</head>
<body>
  <div id="app" class="app"></div>
  <div id="toast" class="toast" hidden></div>
  <script>
var QUESTIONS = [{"id":1,"type":"single","stem":"学分学费每学年末根据实际修读学分结算一次，毕业时按实际修读学分多退少补，学生实际修读学分超过所属专业毕业要求总学分（）学分（不含）以上的，应补交超出的学分学费。","options":[["A","2"],["B","3"],["C","5"],["D","10"]],"answer":["C"],"source":"《中国石油大学（华东）学分制收费管理暂行办法》","category":"学分制收费","excerpt":"第十条学生毕业清算时，对实际修读学分超过所属专业毕业要求总学分5个学分以内（含5个学分）部分，学校可适当予以减免学分学费（具体政策以毕业当年学校公布优惠政策为准）；超过毕业要求总学分5个学分以上部分，学生应正常缴纳学分学费。"},{"id":2,"type":"single","stem":"考试时，要按规定时间提前15分钟入场，按（）就座。","options":[["A","个人意愿"],["B","监考人员安排"],["C","学号"],["D","以上皆可"]],"answer":["B"],"source":"中国石油大学（华东）学生考试工作管理规定（修订）","category":"考试管理","excerpt":"第二十四条监考人员须严格遵守教学纪律，认真履行监考职责，自始至终维持好考场秩序。对不认真履行职责者，按学校有关规定处理。第七章考试纪律第二十五条考生要按规定的考试时间提前15分钟进入考场，按照监考人员的安排就座；将有效证件放在桌面，无有效证件者不准参加考试。迟到30分钟以上和无故不参加考试者，按“缺考”处理。开考30分钟后，准予交卷出场。未交卷且未经监考人员……"},{"id":3,"type":"single","stem":"考试迟到（）分钟，禁止入场。","options":[["A","10"],["B","15"],["C","20"],["D","30"]],"answer":["D"],"source":"中国石油大学（华东）学生考试工作管理规定（修订）","category":"考试管理","excerpt":"第二十四条监考人员须严格遵守教学纪律，认真履行监考职责，自始至终维持好考场秩序。对不认真履行职责者，按学校有关规定处理。第七章考试纪律第二十五条考生要按规定的考试时间提前15分钟进入考场，按照监考人员的安排就座；将有效证件放在桌面，无有效证件者不准参加考试。迟到30分钟以上和无故不参加考试者，按“缺考”处理。开考30分钟后，准予交卷出场。未交卷且未经监考人员……"},{"id":4,"type":"single","stem":"考试开考（）分钟后，可以交卷出场。","options":[["A","15"],["B","20"],["C","30"],["D","60"]],"answer":["C"],"source":"中国石油大学（华东）学生考试工作管理规定（修订）","category":"考试管理","excerpt":"第二十四条监考人员须严格遵守教学纪律，认真履行监考职责，自始至终维持好考场秩序。对不认真履行职责者，按学校有关规定处理。第七章考试纪律第二十五条考生要按规定的考试时间提前15分钟进入考场，按照监考人员的安排就座；将有效证件放在桌面，无有效证件者不准参加考试。迟到30分钟以上和无故不参加考试者，按“缺考”处理。开考30分钟后，准予交卷出场。未交卷且未经监考人员……"},{"id":5,"type":"single","stem":"独立设置的实验（上机）课程，缺做实验（）或缺交实验报告（）及以上者，成绩以零分记载。","options":[["A","1/3，2/3"],["B","1/3，1/3"],["C","2/3，2/3"],["D","2/3，1/3"]],"answer":["B"],"source":"《中国石油大学（华东）本科实验教学管理办法》","category":"实验教学与实习","excerpt":"第十九条独立设置的实验（上机）课程，缺做实验1/3或缺交实验报告1/3及以上者，成绩以零分记载。"},{"id":6,"type":"single","stem":"关于大学生创新创业训练计划的以下哪种说法是正确的（）。","options":[["A","一人可以同时担任多个在研项目的负责人"],["B","一人只能担任一个在研项目的负责人，但可以作为多个在研项目的成员"],["C","一人只能参与一个在研项目，无论是负责人还是成员"],["D","一人只能担任一个在研项目的负责人，同时可以作为另一个在研项目的成员"]],"answer":["C"],"source":"《中国石油大学（华东）大学生创新创业训练计划项目管理办法》","category":"创新创业","excerpt":"十、保障机制1.全校所有实验教学中心、各级各类实验室均向参与项目的学生免费开放。国家大学科技园要积极承担大学生创新创业训练任务，为参与计划的学生提供技术、场地、政策、管理等支持和创业孵化服务。2.适合作为毕业设计（论文）的项目，由项目负责人申请，经教学院（部）毕业设计（论文）工作小组同意，可作为毕业设计（论文）继续研究。3.学校按相关规定对通过项目验收的学生……"},{"id":7,"type":"single","stem":"参加实习或缺勤（包括病、事假）累计达实习总时间（）及以上的，实习成绩为不及格。","options":[["A","1/2"],["B","1/3"],["C","1/4"],["D","1/5"]],"answer":["B"],"source":"《中国石油大学（华东）本科实习教学管理办法》","category":"实验教学与实习","excerpt":"第四十条有下列情形之一者，不得参加课程考核：（1）不参加实习或缺勤（包括病、事假等）累计达到实习总时间1/3的；（2）实习中有违纪行为，经教育不改，或有严重违纪行为的；（3）其他经认定不能参加考核的情形。第八章质量保障第四十一条教学院部是本单位实习教学质量的责任单位，应建立实习教学过程质量监控机制，明确实习各主要教学环节的质量要求，强化实习过程管理，确保实习……"},{"id":8,"type":"single","stem":"学校对在校本科生获得授权的发明专利奖励金额是多少","options":[["A","5000"],["B","4000"],["C","3000"],["D","2000"]],"answer":["C"],"source":"《中国石油大学（华东）本科生创新成果奖励办法》","category":"学科竞赛","excerpt":"三、激励措施学校设立创新创业奖励基金（300万元/年），用于表彰和奖励在创新创业实践活动中取得突出成绩的学生和在创新创业教育中做出突出贡献的教师。（一）面向学生的激励措施1.创新创业卓越奖（100万元/年）。“创新创业实践卓越之星”奖学金（40万元/年），“三进”提升计划优秀生卓越奖（10万元/年），用于奖励在创新创业科研和实践活动中取得优异成绩的学生，评选……"},{"id":9,"type":"single","stem":"在校生应在（）按学校规定缴纳学费，并在每学期（夏季小学期除外）开学后1周内办理学籍注册手续，取得本学期的学习资格。","options":[["A","每学期初"],["B","每学年初"],["C","每学期末"],["D","以上任意时间"]],"answer":["B"],"source":"《中国石油大学（华东）本科生学籍管理规定》","category":"学籍管理","excerpt":"第八条在校生应在每学年初按学校规定缴纳学费，并在每学期（夏季小学期除外）开学后1周内办理学籍注册手续，取得本学期的学习资格。未按照学校规定缴纳学费、超过最长学习年限或者其他不符合注册条件的，不予注册。因故不能如期注册的，须履行暂缓注册手续。逾期2周不办理注册手续者，按照退学处理。家庭经济困难的学生可以申请助学贷款或者其他形式资助，办理有关手续后注册。第三章学……"},{"id":10,"type":"single","stem":"凡结课（含免修）考核不及格的课程,可通过重新选课修读或补考取得该课程的学分。考核成绩合格,但成绩不理想的课程,也可重新选课修读。在学校规定的最长学习年限内,重新选课修读（）。","options":[["A","最多不超过3次"],["B","最多不超过4次"],["C","最多不超过5次"],["D","不限制次数"]],"answer":["D"],"source":"《中国石油大学（华东）本科生学籍管理规定》","category":"学籍管理","excerpt":"第十七条凡结课（含免修）考核不及格的课程，可通过重新选课修读或补考取得该课程的学分。考核成绩合格，但成绩不理想的课程，也可重新选课修读。1.在学校规定的最长学习年限内，重新选课修读不限制次数，所有修读成绩均如实记载；2.补考时间为每学期的开学初，补考课程为前一学期考核不及格的必修或限选课程，且申请补考的课程成绩必须达50分（含）以上；3.实验课程、实习实训、……"},{"id":11,"type":"single","stem":"学生退学后（）重新参加普通高等学校招生全国统一考试,被学校录取并取得学籍的,其已获得学分,经学校认定符合相关专业本科培养方案要求,可予以承认。","options":[["A","1年内"],["B","2年内"],["C","3年内"],["D","5年内"]],"answer":["B"],"source":"《中国石油大学（华东）本科生学籍管理规定》","category":"学籍管理","excerpt":"第二十四条学生因退学等情况中止学业，其在校学习期间所修课程及已获得学分，予以记录。学生退学后2年内重新参加普通高等学校招生全国统一考试，被学校录取并取得学籍的，其已获得学分，经学校认定符合相关专业本科培养方案要求，可予以承认。第五章转学与转专业第二十五条学生入学后，一般不予转学。如因患病或者确有特殊困难和需要，无法继续在校学习者或不适应学校学习要求的，可以申……"},{"id":12,"type":"single","stem":"因学业成绩不良达到退学情形者,可申请试读,试读期为（）,试读期间享受在校生待遇。","options":[["A","半年"],["B","1年"],["C","2年"],["D","不限"]],"answer":["B"],"source":"《中国石油大学（华东）本科生学籍管理规定》","category":"学籍管理","excerpt":"第四十二条因学业成绩不良达到退学情形者，可申请试读，试读期为1年，试读期间享受在校生待遇。试读期满已选必修课程中累计未取得学分数不超过15学分者，试读合格；试读期满不合格者，须办理退学手续。学生在校学习期间，只能试读1次。试读合格者，若已选必修课程中累计未取得学分数再次达到25学分者，予以退学。"},{"id":13,"type":"single","stem":"学生结业后（）之内回校完成相关课程修读,达到本科培养方案规定的学分要求的,学校准予毕业,符合学士学位授予标准的,授予学士学位。","options":[["A","1年"],["B","2年"],["C","3年"],["D","5年"]],"answer":["A"],"source":"《中国石油大学（华东）本科生学籍管理规定》","category":"学籍管理","excerpt":"第四十六条学生毕业时未修满本科培养方案规定的学分要求，可申请延长学习年限或结业。1.延长学习年限（1）延长学习年限应由学生本人提出申请，所在院部审核批准后报教务处备案，但其累计在校时间不能超过学校规定的最长学习年限；（2）延长学习年限的学生，享受在校生待遇。2.结业（1）毕业时累计欠本科培养方案规定的学分要求15学分以内（含15学分）的学生，经本人申请，所在……"},{"id":14,"type":"single","stem":"学生毕业时未完成本科培养方案规定的学分要求,所欠学分超过（）学分且未申请延长学习年限的,按肄业处理。","options":[["A","10"],["B","15"],["C","20"],["D","25"]],"answer":["B"],"source":"《中国石油大学（华东）本科生学籍管理规定》","category":"学籍管理","excerpt":"第四十七条学生毕业时未完成本科培养方案规定的学分要求，所欠学分超过15学分且未申请延长学习年限的，按肄业处理。肄业处理流程参照退学办理。第九章学业证书第四十八条学校严格按照招生时确定的办学类型和学习形式，以及学生招生录取时填报的个人信息，填写、颁发学历证书、学位证书及其他学业证书。学生在校期间申请变更姓名、出生日期等证书需填写的个人信息的，应当有合理、充分的……"},{"id":15,"type":"single","stem":"学生申请免修、免听课程每学期一般不超过（）门。","options":[["A","1"],["B","2"],["C","3"],["D","4"]],"answer":["B"],"source":"《中国石油大学（华东）本科生学籍管理规定》","category":"学籍管理","excerpt":"第十五条学生可根据自身情况申请课程免修、免听。1.课程免修（1）学生对本科培养方案规定的课程通过自学等途径确已掌握，可以申请免修；（2）学生申请免修原则上应在学期初2周内向开课院部提出申请；（3）开课院部根据课程学习要求等情况，决定是否接受免修申请。同意免修的，由开课院部确定课程的考核方式、考核内容、评价标准等报教务处审批。批准通过的，由教务处统一组织考核；……"},{"id":16,"type":"single","stem":"学生申请免听应在课程开始后（）内提交,并征得任课教师同意,开课院部批准后,报教务处备案。","options":[["A","4周"],["B","3周"],["C","2周"],["D","1周"]],"answer":["C"],"source":"《中国石油大学（华东）本科生学籍管理规定》","category":"学籍管理","excerpt":"第十五条学生可根据自身情况申请课程免修、免听。1.课程免修（1）学生对本科培养方案规定的课程通过自学等途径确已掌握，可以申请免修；（2）学生申请免修原则上应在学期初2周内向开课院部提出申请；（3）开课院部根据课程学习要求等情况，决定是否接受免修申请。同意免修的，由开课院部确定课程的考核方式、考核内容、评价标准等报教务处审批。批准通过的，由教务处统一组织考核；……"},{"id":17,"type":"single","stem":"对于本科培养方案规定的实践性教学环节和学校规定必须参加的其他各项教学活动,无故缺席的,按每天（）学时计旷课。","options":[["A","5"],["B","6"],["C","7"],["D","8"]],"answer":["B"],"source":"《中国石油大学（华东）本科生学籍管理规定》","category":"学籍管理","excerpt":"第十条学生应当按照本科培养方案的要求，认真参加各项教育教学活动。学生因病或其他原因不能按时参加的，应当事先请假并获得批准。学生不请假或请假未获批准而无故缺席的，以旷课论处，并根据学校学生纪律处分相关规定给予批评教育；情节严重的，给予相应的纪律处分。理论课旷课时间的计算以学生课程表的课时数为准。对于本科培养方案规定的实践性教学环节和学校规定必须参加的其他各项教……"},{"id":18,"type":"single","stem":"专业注册学费是指以不同专业的（）为基础，对不同专业收取的年度学费。","options":[["A","生均培养成本"],["B","专业建设需求"],["C","学生承受能力"],["D","家庭承受能力"]],"answer":["A"],"source":"《中国石油大学（华东）学分制收费管理暂行办法》","category":"学分制收费","excerpt":"第四条本办法所称学分制收费，是按照专业注册学费和学分学费两部分计收学费的收费管理制度。学分制收费执行政府定价或政府指导价。第二章收费项目及标准第五条专业注册学费是学生进行专业学习注册取得专业课程选修资格需缴纳的费用。专业注册学费由学校按照不同专业生均培养成本等因素合理确定。专业注册学费按学年计收。学校在每学年初向学生收取专业注册学费，为学生办理专业注册手续，……"},{"id":19,"type":"single","stem":"学分学费按学生修读学分计收，学分收费标准为每学分（）元。","options":[["A","30"],["B","50"],["C","100"],["D","200"]],"answer":["C"],"source":"《中国石油大学（华东）学分制收费管理暂行办法》","category":"学分制收费","excerpt":"第六条学分学费是学生选择修读课程并取得课程考核资格缴纳的费用。学分学费按学期计收，实行先选课后缴费。学校根据每学期学生选课情况，按照课程对应学分数与收费标准，在学生完成选课后即时收取。"},{"id":20,"type":"single","stem":"学生毕业时，按照多退少补原则结算学费，学生实际修读学分超过所属专业毕业要求总学分（），应补交超出的学分学费。","options":[["A","＞5学分"],["B","≥5学分"],["C","＞3学分"],["D","≥3学分"]],"answer":["A"],"source":"《中国石油大学（华东）学分制收费管理暂行办法》","category":"学分制收费","excerpt":"第十条学生毕业清算时，对实际修读学分超过所属专业毕业要求总学分5个学分以内（含5个学分）部分，学校可适当予以减免学分学费（具体政策以毕业当年学校公布优惠政策为准）；超过毕业要求总学分5个学分以上部分，学生应正常缴纳学分学费。"},{"id":21,"type":"single","stem":"学生费用清缴次序为（）。①代收费；②专业注册学费；③住宿费；④学分学费。","options":[["A","①②③④"],["B","①③②④"],["C","①④③②"],["D","①③④②"]],"answer":["B"],"source":"《中国石油大学（华东）学分制收费管理暂行办法》","category":"学分制收费","excerpt":"第四条本办法所称学分制收费，是按照专业注 ,{"id":37,"type":"single","stem":"下列选项哪一项不符合学生公寓室内卫生规范","options":[["A","卫生间异味"],["B","床面平整、洁净"],["C","桌面整洁"],["D","地面保持干净"]],"answer":["A"],"source":"《中国石油大学（华东）学生公寓管理规定》","category":"学生公寓","excerpt":"第三十六条室内卫生规范：1.地面保持干净。2.室内空气清新。3.门窗洁净、明亮。4.桌面整洁。5.学习、生活用品摆放整齐。6.床面平整、洁净。7.被子、枕头叠放基本符合军训要求。8.无乱拉线（绳）现象。9.卫生间整洁，无异味，无下水道堵塞现象。10.阳台干净，不乱堆放杂物。11.墙面及房顶无乱写乱划现象，张贴内容要健康、格调高雅。"},{"id":38,"type":"single","stem":"保留入学资格由新生本人提出书面申请，并附相关证明材料（因病需提交校医院或校医院指定的二级甲等以上医院诊断证明），经学校批准，可保留入学资格（）。保留入学资格期间不具有学籍。","options":[["A","半年"],["B","1年"],["C","2年"],["D","3年"]],"answer":["B"],"source":"《中国石油大学（华东）本科生学籍管理规定》","category":"学籍管理","excerpt":"第六条新生因患病或者其他正当理由的，可申请保留入学资格。保留入学资格由新生本人提出书面申请，并附相关证明材料（因病需提交校医院或校医院指定的二级甲等以上医院诊断证明），经学校批准，可保留入学资格1年。保留入学资格期间不具有学籍。新生保留入学资格期满前应向学校申请入学，因病保留入学资格者须同时提交校医院或校医院指定的二级甲等以上医院出具的病愈证明，经学校审查合……"},{"id":39,"type":"single","stem":"学生有以下情形之一者，不得参加该课程的结课考核（免听课程除外）：1.累计缺课达到该课程计划学时的（）者；2.累计缺交作业（含抄袭作业）达到该门课程所有作业量的（）者；3.独立设置的实验（上机）课程，缺做实验学时或缺交实验报告达到（）者。","options":[["A","1/3；1/3；1/3"],["B","1/2；1/2；1/2"],["C","1/3；1/2；1/3"],["D","1/2；1/3；1/2"]],"answer":["A"],"source":"《中国石油大学（华东）本科生学籍管理规定》","category":"学籍管理","excerpt":"第十六条学生有以下情形之一者，不得参加该课程的结课考核（免听课程除外）：1.累计缺课达到该课程计划学时的1/3者；2.累计缺交作业（含抄袭作业）达到该门课程所有作业量的1/3者；3.独立设置的实验（上机）课程，缺做实验学时或缺交实验报告达到1/3者。"},{"id":40,"type":"single","stem":"（）是学生社团的最高权力机构，依照本社团的章程行使职权。","options":[["A","学生社团主席团"],["B","学生社团代表大会"],["C","学生社团会员大会"],["D","学生社团主席"]],"answer":["C"],"source":"中国石油大学（华东）学生社团管理办法","category":"学生社团","excerpt":"中国石油大学（华东）学生勤工助学管理实施细则（中石大东发[2022]61号）第一章总则第一条为规范管理学生勤工助学工作，促进勤工助学活动健康、有序开展，保障学生的合法权益，帮助学生顺利完成学业，发挥勤工助学育人功能，培养学生热爱劳动、自立自强和创新创业精神，增强学生社会实践能力，根据教育部、财政部《高等学校学生勤工助学管理办法》（教财暡2018暢12号）等文……"},{"id":41,"type":"single","stem":"凡我校本科生在取得本专业培养计划规定学分的同时,还需至少取得（）个自主发展计划学分。","options":[["A","5"],["B","10"],["C","15"],["D","20"]],"answer":["B"],"source":"中国石油大学(华东)本科生自主发展计划","category":"自主发展计划","excerpt":"二、跨专业学习介绍1.跨学科课程为培养学生的跨领域知识融通能力，拓宽学生多学科思维视野，我校在2024版本科专业人才培养方案中设置了跨学科课程，学生须跨专业类选择修读其他专业的专业课程不少于4学分。从2024级学生开始，4个学分跨学科课程是完成学业的必要条件（具体 重警告或者记过处分；（三）以暴力、威胁、贿赂等方式干扰证人作证或者指使他人作伪证者，视情节轻重，给予记过、留校察看或者开除学籍处分。"},{"id":142,"type":"single","stem":"学生对学校的处分决定有异议的,应在接到学校处分决定书之日起（）日内,向学校学生申诉处理委员会提出书面申诉。","options":[["A","3"],["B","5"],["C","7"],["D","10"]],"answer":["D"],"source":"《中国石油大学（华东）学生纪律处分规定》","category":"学生纪律处分","excerpt":"第三十九条学生对学校的处分决定有异议的，可以在接到学校处分决定书之日起10日内，向学校学生申诉处理委员会提出书面申诉。学生申诉处理委员会对学生提出的申诉进行复查，作出复查决定。学生对复查决定有异议的，在接到学校复查决定书之日起15日内，可以向山东省教育厅提出书面申诉。"},{"id":143,"type":"single","stem":"学生对复查决定有异议的,在接到学校复查决定书之日起（）日内,可以向山东省教育厅提出书面申诉。","options":[["A","5"],["B","7"],["C","10"],["D","15"]],"answer":["D"],"source":"《中国石油大学（华东）学生纪律处分规定》","category":"学生纪律处分","excerpt":"第三十九条学生对学校的处分决定有异议的，可以在接到学校处分决定书之日起10日内，向学校学生申诉处理委员会提出书面申诉。学生申诉处理委员会对学生提出的申诉进行复查，作出复查决定。学生对复查决定有异议的，在接到学校复查决定书之日起15日内，可以向山东省教育厅提出书面申诉。"},{"id":144,"type":"single","stem":"心理咨询中心接待心理咨询的地点为（）。","options":[["A","学生事务中心三楼332房间心理咨询值班室"],["B","电话预约，上门服务"],["C","17号宿舍公寓楼下心理工作室"],["D","大学生活动中心三楼"]],"answer":["A"],"source":"《心理咨询来访者须知》","category":"心理咨询","excerpt":"六、读者借阅图书资料逾期、损坏或遗失的处理。根据石大东发暡1996暢100号文件规定，对读者借阅图书资料逾期、损坏及遗失的处理规定如下。1.所借图书超过借阅期限，须将超期图书归还或续借后，方能继续借书。2.读者如遗失所借图书资料，需在应还日期之前向唐岛湾校区图书馆总馆一楼大厅总服务台或古镇口东区学习中心三楼服务台、古镇口西区图书馆二楼服务台登记，并在1个月内……"},{"id":145,"type":"single","stem":"凡我校本科生在取得本专业培养计划规定学分的同时,还需至少取得（）个自主发展计划学分","options":[["A","5"],["B","10"],["C","15"],["D","20"]],"answer":["B"],"source":"中国石油大学(华东)本科生自主发展计划","category":"自主发展计划","excerpt":"二、跨专业学习介绍1.跨学科课程为培养学生的跨领域知识融通能力，拓宽学生多学科思维视野，我校在2024版本科专业人才培养方案中设置了跨学科课程，学生须跨专业类选择修读其他专业的专业课程不少于4学分。从2024级学生开始，4个学分跨学科课程是完成学业的必要条件（具体以本专业培养方案为准）。同学们在选课的时候，根据自己的兴趣合理安排修读计划。如果同学们学有余力，……"},{"id":146,"type":"single","stem":"“第二课堂成绩单”采用学分认证和学时记录的方法，每个学分对应（）个学时。","options":[["A","10"],["B","20"],["C","30"],["D","40"]],"answer":["B"],"source":"中国石油大学(华东)“第二课堂成绩单实施细则”","category":"自主发展计划","excerpt":"第四条校内各有关单位、各学院（部）负责第二课堂活动的内容设计和组织实施，通过优化项目供给，切实提升第二课堂活动品质，满足学生素质拓展和修读学分的需求；学生根据第二课堂的教育教学要求，结合自己的专业、能力、特长、兴趣和爱好，自主选择参加相应的第二课堂活动和课程，取得规定的学分。第二章课程设置第五条“第二课堂成绩单”制度设置的5类课程具体为：（一）思想成长类，主……"},{"id":147,"type":"single","stem":"对于“第二课堂成绩单”每学期各类课程修满（）个学分（不包括转换所得学分）后将不再进行累计，只进行活动记录。","options":[["A","1"],["B","2"],["C","3"],["D","4"]],"answer":["A"],"source":"中国石油大学(华东)“第二课堂成绩单实施细则”","category":"自主发展计划","excerpt":"第七条学时记录分为“参与学时”和“转换学时”。其中，“参与学时”主要指参加第二课堂活动所取得的学时，学时获得包括以下步骤：（一）组织方依托网络管理平台发布活动，并设定学时（通常以活动时长和活动重要程度为依据）；（二）管理员审核；（三）学生线上报名；（四）活动现场签到；（五）活动结束后，系统自动记录学时。“转换学时”主要指各类证书、成果转换成相应学时，同一类别……"},{"id":148,"type":"single","stem":"校级大学生创业基地入驻条件中要求项目负责人为（）","options":[["A","我校在校学生"],["B","我校全日制在校学生"],["C","全日制在校学生"],["D","我校在校教师"]],"answer":["B"],"source":"中国石油大学(华东)大学生创业实践管理办法","category":"创新创业","excerpt":"第五条基地入驻条件：1.项目负责人为我校全日制在校学生。2.具有较好市场前景且落地实体运转的创业项目、拥有自主知识产权的创业项目、在国家级或省级创业比赛中获奖的创业项目优先考虑。"},{"id":149,"type":"single","stem":"创业基金资助期原则上为（）年","options":[["A","半"],["B","一"],["C","两"],["D","三"]],"answer":["B"],"source":"中国石油大学(华东)大学生创业实践管理办法","category":"创新创业","excerpt":"第十条基金资助程序：1.项目申报。实行集中申报和评审，项目负责人向办公室提出申请，并提交创业基金申请表、项目可行性研究报告等材料。2.项目遴选。办公室对项目进行初审，并组织相关专家组成评审组对通过初审的项目进行评审，评审过程采用公开答辩的形式。根据评审意见，拟定资助额度。3.项目资助。项目负责人与办公室签订资助协议。基金资助期原则上为一年，初期拨付资助金额的……"},{"id":150,"type":"single","stem":"创业基金初期拨付资助金额的（）","options":[["A","0.3"],["B","0.4"],["C","0.5"],["D","0.6"]],"answer":["C"],"source":"中国石油大学(华东)大学生创业实践管理办法","category":"创新创业","excerpt":"第十条基金资助程序：1.项目申报。实行集中申报和评审，项目负责人向办公室提出申请，并提交创业基金申请表、项目可行性研究报告等材料。2.项目遴选。办公室对项目进行初审，并组织相关专家组成评审组对通过初审的项目进行评审，评审过程采用公开答辩的形式。根据评审意见，拟定资助额度。3.项目资助。项目负责人与办公室签订资助协议。基金资助期原则上为一年，初期拨付资助金额的……"},{"id":151,"type":"single","stem":"受资助项目如有盈利,根据项目收益情况,将项目净利润的（）%上交学校大学生创业基金,用以滚动支持更多创业项目。","options":[["A","5"],["B","10"],["C","15"],["D","20"]],"answer":["A"],"source":"中国石油大学(华东)大学生创业实践管理办法","category":"创新创业","excerpt":"第十一条基金运作管理：1.受资助的项目应定期向办公室提交基金使用情况的财务报告和项目运行情况报告，并接受中期检查和期满验收考核。2.受资助的项目因客观原因需对目标、进度和经费等进行调整时，应向办公室提出书面申请，经审核通过方可执行。3.受资助的项目提前退出时，须提前提出书面申请，报办公室审核后，办理清算核销手续。4.受资助项目如有盈利，根据项目收益情况，将项……"},{"id":152,"type":"single","stem":"大学生创业项目入驻期原则上为（）年","options":[["A","半"],["B","一"],["C","两"],["D","三"]],"answer":["B"],"source":"中国石油大学(华东)大学生创业实践管理办法","category":"创新创业","excerpt":"第六条基地入驻程序：1.项目申报。实行集中申报和评审，项目负责人向办公室提出申请，并提交创业基地入驻申请表、项目可行性研究报告等材料。2.项目遴选。办公室对项目进行初审，并组织相关专家组成评审组对通过初审的项目进行评审，评审过程采用公开答辩的形式。根据评审意见，拟定入驻方案。3.项目入驻。项目负责人与办公室签订入驻协议，办理入驻手续，入驻期原则上为一年。"},{"id":153,"type":"single","stem":"学校设立创新创业资助基金，其中自主创业扶持资金（），每年立项资助（）项左右","options":[["A","70万元/年；50"],["B","80万元/年；50"],["C","80万元/年；60"],["D","70万元/年；60"]],"answer":["B"],"source":"中国石油大学(华东)本科生创新创业教育保障与激励暂行办法","category":"创新创业","excerpt":"二、保障措施学校设立创新创业资助基金（700万元/年），包括创新创业实践基金、科研创新项目资助基金、学科竞赛资助基金、实验室开放资助基金、创业孵化基金、研究生创新创业专项资助基金等各类资助基金，用于保障学生创新创业实践活动开展。1.创新创业实践基金（150万元/年）。用于资助中国国际“互联网+”大学生创新创业大赛、“挑战杯”全国大学生课外学术科技作品竞赛、“……"},{"id":154,"type":"single","stem":"“三进”提升计划优秀生培养周期为（）年","options":[["A","2年"],["B","1年"],["C","3年"],["D","4年"]],"answer":["A"],"source":"优秀本科生\"三进\"提升计划实施办法","category":"三进提升计划","excerpt":"中国石油大学（华东）优秀本科生“三进”提升计划实施办法（中石大东发[2020]18号）第一章总则第一条为推进本科人才培养模式改革，促使优秀本科生（以下简称优秀生）早进实验室、早进团队、早进项目，为优秀生继续深造提供发展平台，学校决定实施优秀本科生“三进”提升计划（以下简称该计划），特制定本办法。"},{"id":155,"type":"single","stem":"按照每生每（）元的标准,给予科研团队优秀生培养经费资助,主要用于优秀生培养","options":[["A","1000-2000"],["B","3000-5000"],["C","4000-6000"],["D","5000-7000"]],"answer":["B"],"source":"优秀本科生\"三进\"提升计划实施办法","category":"三进提升计划","excerpt":"第十七条科研团队应坚持导学与育人相结合，注重优秀生创新思想、科学精神、团队协作能力等方面培养，建立良好师生关系。学校对科研团队给予政策支持和一定工作量认定。1.按照每生每年3000~5000元的标准，给予科研团队优秀生培养经费资助，主要用于优秀生培养。2.按照每生每年16个教学学时工作量纳入科研团队绩效分配。3.每三年开展该计划“卓越科研团队”、“优秀科研团……"},{"id":156,"type":"single","stem":"“三进”计划原则上面向（）年级本科生,秋季学期组织, 每年选拔300~500名","options":[["A","一"],["B","二"],["C","三"],["D","四"]],"answer":["B"],"source":"优秀本科生\"三进\"提升计划实施办法","category":"三进提升计划","excerpt":"第八条学校每三年开展一次科研团队评估和动态调整工作。第四章学生选拔第九条坚持“早选拔、早培养、早成才”思路，优秀生选拔原则上面向二年级本科生（建筑学专业三年级），秋季学期组织，每年选拔300~500名。"},{"id":157,"type":"single","stem":"在中国国际“ 互联网+ ”大学生创新创业大赛获得金奖、银奖、铜奖，分别获得奖金（）","options":[["A","5000;3000;1000"],["B","50000;30000;10000"],["C","4000;2000;1000"],["D","40000;20000;10000"]],"answer":["B"],"source":"本科生学科竞赛管理办法","category":"学科竞赛","excerpt":"中国石油大学（华东）本科生学科竞赛管理办法（中石大东发[2014]54号）学科竞赛是培养学生创新精神和实践能力的有效手段和重要载体。为进一步加强学科竞赛管理，促进学科竞赛工作的有效开展，营造良好的创新教育氛围，特制定本办法。"},{"id":158,"type":"multi","stem":"以下说法错误的是（）。","options":[["A","凡未经学校批准，不在规定时间内交清学费的，不予注册学籍"],["B","学生参加自主发展计划第二课堂活动的，需按所修课程的规定学分交纳学分学费"],["C","通过自主选课重修（做）课程的，按照重修学分交纳学分学费"],["D","学生申请免听、自修课程的，不需交纳学分学费"]],"answer":["B","D"],"source":"《中国石油大学（华东）学分制收费管理暂行办法》","category":"学分制收费","excerpt":"第十二条学生参加自主发展计划第二课堂活动的，免交学分学费。"},{"id":159,"type":"multi","stem":"以下说法正确的是（）。","options":[["A","学生因故休学、保留学籍的，停学期间不再交纳学费"],["B","学生在校期间转专业的，转入专业的专业注册学费和原专业不同的，按照多退少补的原则结算"],["C","学生毕业、结业、肄业离校时，应交清所欠学费方能办理离校手续"],["D","学生考试不及格的，如符合补考条件可免费补考二次，学生通过补考取得课程学分的，免交学分学费"]],"answer":["A","B","C"],"source":"《中国石油大学（华东）学分制收费管理暂行办法》","category":"学分制收费","excerpt":"第十五条学生在校期间转专业的，自学籍转换手续办理完成之日起，按照转入专业的标准交纳专业注册学费，转入专业的专业注册学费和原专业不同的，按照多退少补原则结算。"},{"id":160,"type":"multi","stem":"学生在本专业培养方案外（）、（）、（）的，按照所修课程的规定学分交纳学分学费，在基本修业年限内，免交加修专业的专业注册学费。","options":[["A","修读其他课程"],["B","修读双学位"],["C","参加自主发展计划第二课堂活动"],["D","辅修专业"]],"answer":["A","B","D"],"source":"《中国石油大学（华东）学分制收费管理暂行办法》","category":"学分制收费","excerpt":"第十一条学生修读双学位、双专业或本专业教学计划以外课程的，在基本修业年限内免收加修专业的专业注册学费；按照所修课程学分缴纳学分学费。"},{"id":161,"type":"multi","stem":"学生在校期间转专业的，自（）起，按照（）标准交纳专业注册学费。","options":[["A","学籍转换手续办理完成之日"],["B","下一学年"],["C","原专业"],["D","转入专业"]],"answer":["A","D"],"source":"《中国石油大学（华东）学分制收费管理暂行办法》","category":"学分制收费","excerpt":"第十五条学生在校期间转专业的，自学籍转换手续办理完成之日起，按照转入专业的标准交纳专业注册学费，转入专业的专业注册学费和原专业不同的，按照多退少补原则结算。"},{"id":162,"type":"multi","stem":"闭卷考试中下列（）情况，不论看与否，以考试作弊认定。","options":[["A","桌内、座位旁有翻开的或试卷下面垫有与考试内容相关的书、笔记、讲义、复习提纲等物品。"],["B","利用文具盒、衣物或其他用品夹带与考试内容相关的笔记、复习提纲、纸条。"],["C","在桌面、身上等处写有与考试相关的内容。"],["D","在允许使用的工具书上写有与考试相关的内容或夹带相关材料。"]],"answer":["A","B","C","D"],"source":"中国石油大学（华东）学生考试工作管理规定（修订）","category":"考试管理","excerpt":"第三十条考试过程中有下列情况之一者，以考试作弊认定，该门课程总成绩以零分记：（一）请人代考或代人考试；（二）强拿他人试卷、草稿纸（不论是否抄用）；（三）为他人提供偷看机会，或偷看他人试卷、草稿纸；（四）用某种示意、动作互相传递有关考试信息；（五）考试中直接或以借用工具书、文具、计算器等方式传接答卷或纸条的行为双方；（六）违反考场规则使用有文字存储功能的电子设……"},{"id":163,"type":"multi","stem":"下列（）情况，属于考试违纪行为。","options":[["A","未按考场规则就座。"],["B","闭卷考试至发试卷时仍将规定以外物品等带入座位。"],["C","自带空白答题纸或草稿纸。"],["D","未经监考人员允许借用他人的书、笔记、资料、计算器等物品。"]],"answer":["A","B","C","D"],"source":"中国石油大学（华东）学生考试工作管理规定（修订）","category":"考试管理","excerpt":"第二十八条考生要严格遵守考场规则，在规定的时间内独立完成答卷。凡不服从监考人员安排，违反考试纪律或作弊者，按学校有关规定处理。第八章考试违纪、作弊的认定及处理第二十九条考生有下列情况之一者，视为违反考试纪律，要当场给予口头警告并予以纠正：（一）未按考场规则就座；（二）闭卷考试至发试卷时仍将规定以外物品等带入座位；（三）自带空白答题纸或草稿纸；（四）未经监考人……"},{"id":164,"type":"multi","stem":"下列（）情况，属于考试违纪行为。","options":[["A","考试中东张西望，企图偷看他人试卷。"],["B","交卷后仍在考场逗留或在考场附近大声喧哗。"],["C","将试卷、答题卡、答题纸、草稿纸等带出考场。"],["D","请人代考或代人考试。"]],"answer":["A","B","C"],"source":"中国石油大学（华东）学生考试工作管理规定（修订）","category":"考试管理","excerpt":"第二十八条考生要严格遵守考场规则，在规定的时间内独立完成答卷。凡不服从监考人员安排，违反考试纪律或作弊者，按学校有关规定处理。第八章考试违纪、作弊的认定及处理第二十九条考生有下列情况之一者，视为违反考试纪律，要当场给予口头警告并予以纠正：（一）未按考场规则就座；（二）闭卷考试至发试卷时仍将规定以外物品等带入座位；（三）自带空白答题纸或草稿纸；（四）未经监考人……"},{"id":165,"type":"multi","stem":"下列（）情况，经调查核实，以作弊论处，该门课程总成绩以零分记。","options":[["A","将试卷、答题卡、答题纸、草稿纸等带出考场。"],["B","以请客、送礼、威胁等手段要求教师提分、加分或隐瞒违纪作弊事实。"],["C","毕业设计（论文）有严重剽窃、抄袭、伪造数据等学术不端行为。"],["D","在教师阅卷或其他情况下发现的作弊情况。"]],"answer":["B","C","D"],"source":"中国石油大学（华东）学生考试工作管理规定（修订）","category":"考试管理","excerpt":"第三十一条有下列情况之一者，经调查核实，以作弊论处，该门课程总成绩以零分记：（一）以请客、送礼、威胁等手段要求教师提分、加分或隐瞒违纪作弊事实；（二）毕业设计（论文）有严重剽窃、抄袭、伪造数据等学术不端行为；（三）在教师阅卷或其他情况下发现的作弊情况。"},{"id":166,"type":"multi","stem":"实验教学是培养学生综合实践能力和创新精神的重要教学环节，包括（）。","options":[["A","独立设置的实验课程"],["B","独立设置的上机课程"],["C","课程中含有的实验教学环节"],["D","课程中含有的上机教学环节"]],"answer":["A","B","C","D"],"source":"《中国石油大学（华东）本科实验教学管理办法》","category":"实验教学与实习","excerpt":"第二条实验教学包括独立设置的实验（上机）课程和课程中含有的实验（上机）教学环节（以下统称实验课）。第二章实验教学大纲与实验教材第三条实验教学大纲是开展实验教学的指导性文件，应符合本科培养方案要求，由开课单位负责制定。"},{"id":167,"type":"multi","stem":"在进行实验前，从（）等方面对实验进行预习。","options":[["A","实验原理"],["B","实验内容"],["C","实验方法步骤"],["D","仪器设备操作规程与注意事项"]],"answer":["A","B","C","D"],"source":"《中国石油大学（华东）本科实验教学管理办法》","category":"实验教学与实习","excerpt":"第十一条指导教师要主动开展实验教学内容、方法和手段的改革研究与实践，积极开发综合性、设计性、创新性实验项目，自主研制新仪器、新设备，注重将科研成果转化成实验项目，不断丰富实验教学资源，提升实验教学水平。第四章学生第十二条实验前，学生应认真预习实验内容，明确实验目的和要求，了解实验的基本原理、方法、步骤，熟悉仪器设备的操作规程及注意事项。"},{"id":168,"type":"multi","stem":"我校开展大学生创新创业训练计划的理念是（）。","options":[["A","兴趣驱动"],["B","学生为主"],["C","教师主导"],["D","注重过程"]],"answer":["A","B","D"],"source":"《中国石油大学（华东）大学生创新创业训练计划项目管理办法》","category":"创新创业","excerpt":"一、指导思想按照“兴趣驱动，学生为主，注重过程”的理念，进一步转变教育思想观念，以大学生创新创业训练计划为突破口，推进以学生为主体的人才培养模式改革，强化创新创业能力训练，增强大学生的创新能力和在创新基础上的创业能力，培养适应创新型国家建设需要的高水平创新人才。"},{"id":169,"type":"multi","stem":"大学生创新创业训练计划的项目类型包括（）。","options":[["A","创新训练项目"],["B","创新实践项目"],["C","创业训练项目"],["D","创业实践项目"]],"answer":["A","C","D"],"source":"《中国石油大学（华东）大学生创新创业训练计划项目管理办法》","category":"创新创业","excerpt":"三、计划内容大学生创新创业训练计划内容包括创新训练项目、创业训练项目和创业实践项目三类。创新训练项目是本科生个人或团队，在导师指导下，自主完成创新性研究项目设计、研究条件准备和项目实施、研究报告撰写、成果（学术）交流等工作。创业训练项目是本科生团队，在导师指导下，团队中每个学生在项目实施过程中扮演一个或多个具体的角色，完成编制商业计划书、开展可行性研究、模拟……"},{"id":170,"type":"multi","stem":"毕业设计成绩由哪基本部分综合组成。","options":[["A","评阅教师评价"],["B","答辩成绩"],["C","指导教师评价"],["D","学生自评"]],"answer":["A","B","C"],"source":"《中国石油大学（华东）本科毕业设计（论文）管理规定》","category":"其他","excerpt":"第十一条评阅与答辩1.毕业设计评阅包括指导教师评阅和评阅教师评阅，评阅工作应在答辩前完成。评阅教师由专业负责安排，须具备指导教师资格，且不能由该毕业设计指导教师本人担任。2.指导教师和评阅教师应参照毕业设计评价标准，客观、认真、公正地评阅毕业设计，给定评阅成绩、撰写评语。3.指导教师和评阅教师的评语应与毕业设计内容及完成情况吻合，避免重复、雷同、笼统、过于简……"},{"id":171,"type":"multi","stem":"学校对创新创业活动的资助主要包括以下哪几方面？","options":[["A","创新创业训练计划项目"],["B","科研创新项目"],["C","学科竞赛"],["D","课外科技活动"],["E","实验室开放"]],"answer":["B","C","D","E"],"source":"《中国石油大学（华东）本科生创新创业教育保障与激励暂行办法》","category":"创新创业","excerpt":"二、保障措施学校设立创新创业资助基金（700万元/年），包括创新创业实践基金、科研创新项目资助基金、学科竞赛资助基金、实验室开放资助基金、创业孵化基金、研究生创新创业专项资助基金等各类资助基金，用于保障学生创新创业实践活动开展。1.创新创业实践基金（150万元/年）。用于资助中国国际“互联网+”大学生创新创业大赛、“挑战杯”全国大学生课外学术科技作品竞赛、“……"},{"id":172,"type":"multi","stem":"学生获得哪些高水平创新成果可以得到学校的奖励","options":[["A","高水平学术论文"],["B","发明专利"],["C","科技成果"],["D","著作"]],"answer":["A","B","C","D"],"source":"《中国石油大学（华东）本科生创新成果奖励办法》","category":"学科竞赛","excerpt":"第二十四条免做毕业设计1.允许学生用创新创业成果申请免做毕业设计，要求学生为成果第一完成人且中国石油大学（华东）为第一完成单位。2.创新创业成果内容应与本专业紧密相关，学生取得该成果得到训练成效不能低于本专业毕业设计课程目标要求。成果可以是公开发表的学术论文、科技成果及著作、成立公司并取得较好收益等。3.学生应在选题之前向所在学院提出免做毕业设计申请，由所在……"},{"id":173,"type":"multi","stem":"获得学术论文奖励必要条件是（）","options":[["A","我校本科生作为第一作者"],["B","论文已公开发表"],["C","中国石油大学（华东）为第一署名单位"],["D","被SCI、SSCI、EI等检索"]],"answer":["A","B","C"],"source":"《中国石油大学（华东）本科生创新成果奖励办法》","category":"学科竞赛","excerpt":"第二十四条免做毕业设计1.允许学生用创新创业成果申请免做毕业设计，要求学生为成果第一完成人且中国石油大学（华东）为第一完成单位。2.创新创业成果内容应与本专业紧密相关，学生取得该成果得到训练成效不能低于本专业毕业设计课程目标要求。成果可以是公开发表的学术论文、科技成果及著作、成立公司并取得较好收益等。3.学生应在选题之前向所在学院提出免做毕业设计申请，由所在……"},{"id":174,"type":"multi","stem":"学校本科专业标准学制四年（建筑学专业五年），实行学分制管理和弹性学习年限，学生可以在标准学制的基础上（）或（）毕业。","options":[["A","提前一年"],["B","提前两年"],["C","延长两年"],["D","延长三年"],["E","延长四年"]],"answer":["A","C"],"source":"《中国石油大学（华东）本科生学籍管理规定》","category":"学籍管理","excerpt":"第三条学校本科专业标准学制四年（建筑学专业学制五年），实行学分制管理和弹性学习年限，学生可在标准学制的基础上提前一年或延长两年毕业。"},{"id":175,"type":"multi","stem":"以下哪些类型的课程，和通识教育选修课、包含实验环节的课程、实习以及其他须随堂修读的课程一样,均不得申请免修、免听？","options":[["A","思想政治理论课"],["B","体育课"],["C","独立实验课"],["D","军训"],["E","毕业设计(论文)"],["F","专业必修课"]],"answer":["A","B","C","D","E"],"source":"《本科生学籍管理规定》","category":"学籍管理","excerpt":"第十五条学生可根据自身情况申请课程免修、免听。1.课程免修（1）学生对本科培养方案规定的课程通过自学等途径确已掌握，可以申请免修；（2）学生申请免修原则上应在学期初2周内向开课院部提出申请；（3）开课院部根据课程学习要求等情况，决定是否接受免修申请。同意免修的，由开课院部确定课程的考核方式、考核内容、评价标准等报教务处审批。批准通过的，由教务处统一组织考核；……"},{"id":176,"type":"multi","stem":"学生有以下哪些情形者,不得参加该课程的结课考核（免听课程除外）？","options":[["A","累计缺课达到该课程计划学时的1/3者"],["B","累计缺交作业(含抄袭作业)达到该门课程所有作业量的1/3者"],["C","课程上课时间4次违反课堂纪律（如睡觉）者"],["D","独立设置的实验(上机)课程,缺做实验学时或缺交实验报告达到1/3者"]],"answer":["A","B","D"],"source":"《中国石油大学（华东）本科生学籍管理规定》","category":"学籍管理","excerpt":"第十六条学生有以下情形之一者，不得参加该课程的结课考核（免听课程除外）：1.累计缺课达到该课程计划学时的1/3者；2.累计缺交作业（含抄袭作业）达到该门课程所有作业量的1/3者；3.独立设置的实验（上机）课程，缺做实验学时或缺交实验报告达到1/3者。"},{"id":177,"type":"multi","stem":"学生参加学校认可的（）等活动以及发表论文、获得专利授权等与专业学习、学业要求相关的经历、成果,经学校认定,可记为相应学分。","options":[["A","开放式网络课程学习"],["B","创新创业"],["C","家教类兼职"],["D","社会实践"]],"answer":["A","B","D"],"source":"《中国石油大学（华东）本科生学籍管理规定》","category":"学籍管理","excerpt":"第二十三条学生参加学校认可的开放式网络课程学习、创新创业、社会实践等活动以及发表论文、获得专利授权等与专业学习、学业要求相关的经历、成果，经学校认定，可记为相应学分。"},{"id":178,"type":"multi","stem":"学生有以下哪些情形之一者,不得转学？","options":[["A","入学未满一学期或毕业前一年的"],["B","高考成绩低于拟转入学校相关专业同一生源地相应年份录取成绩的"],["C","由低学历层次转为高学历层次的"],["D","以定向就业招生录取的"],["E","无正当转学理由的"]],"answer":["A","B","C","D","E"],"source":"《中国石油大学（华东）本科生学籍管理规定》","category":"学籍管理","excerpt":"第二十六条学生有以下情形之一者，不得转学：1.入学未满一学期或毕业前一年的；2.高考成绩低于拟转入学校相关专业同一生源地相应年份录取成绩的；3.由低学历层次转为高学历层次的；4.以定向就业招生录取的；5.无正当转学理由的。"},{"id":179,"type":"multi","stem":"学生有以下哪些情形之一者,可以申请转专业？","options":[["A","对某专业有兴趣和专长,且转入该专业更能发挥特长的"],["B","学生主观上已努力学习,但确实存在学习上的特殊困难,不适合在原专业继续学习的"],["C","以定向就业招生录取的"],["D","休学创业或退役后复学的学生,因自身情况需要转专业的"],["E","学生通过自主选课获得学分满足拟转入专业准入要求的"]],"answer":["A","B","D","E"],"source":"《中国石油大学（华东）本科生学籍管理规定》","category":"学籍管理","excerpt":"第二十八条学生有以下情形之一者，可以申请转专业：1.对某专业有兴趣和专长，且转入该专业更能发挥特长的；2.学生通过自主选课获得学分满足拟转入专业准入要求的；3.因某种疾病或生理缺陷等身体原因，经校医院或校医院指定的二级甲等以上医院诊断证明，不适合在原专业继续学习的；4.学生主观上已努力学习，但确实存在学习上的特殊困难，不适合在原专业继续学习的；5.休学创业或……"},{"id":180,"type":"multi","stem":"学生有以下哪些情形之一者,应申请休学？","options":[["A","因病经校医院或校医院指定的二级甲等以上医院诊断后,须停课治疗、休养超过6周的"],["B","请假超过6周的"],["C","经学校认定同意创业休学的"],["D","因某种特殊原因,本人申请休学或学校认为须休学的"],["E","对所学专业暂时不感兴趣的"]],"answer":["A","B","C","D"],"source":"《中国石油大学（华东）本科生学籍管理规定》","category":"学籍管理","excerpt":"第三十二条学生转专业，应按学校规定办理手续；在未完成相关手续办理前，须参加原专业的学习。第六章休学、保留学籍与复学第三十三条学生有以下情形之一者，应申请休学：1.因病经校医院或校医院指定的二级甲等以上医院诊断后，须停课治疗、休养超过6周的（肝炎、肺结核等传染病患者须休学）；2.请假超过6周的；3.经学校认定同意创业休学的；4.因某种特殊原因，本人申请休学或学……"},{"id":181,"type":"multi","stem":"学生有以下哪些情形之一者,学校应予退学处理？","options":[["A","连续4学期每学期选课学分数均小于15学分的"],["B","未经批准连续两周未参加学校规定的教学活动的"],["C","试读不合格且本人未申请退学的"],["D","超过学校规定的期限未注册而又无正当理由的"],["E","学校规定的不能完成学业、应予退学的其他情形"]],"answer":["A","B","C","D","E"],"source":"《中国石油大学（华东）本科生学籍管理规定》","category":"学籍管理","excerpt":"第四十条学生有以下情形之一者，学校应予退学处理：1.已选必修课程中累计未取得学分数达到25学分及以上的；2.连续4学期每学期选课学分数均小于15学分的；3.休学、保留学籍期满，在学校规定的期限内未提出复学申请或者申请复学经复查不合格的；4.经校医院或校医院指定的二级甲等以上医院诊断，患有疾病或者意外伤残不能继续在校学习的；5.未经批准连续两周未参加学校规定的……"},{"id":182,"type":"multi","stem":"学校鼓励和支持学生实行（）。学生可根据个人情况,合理、灵活地通过选课安排自己的学习进程,但在校学习年限不能超过学校规定的最长学习年限。","options":[["A","自我管理"],["B","自我服务"],["C","自我教育"],["D","自我监督"]],"answer":["A","B","C","D"],"source":"《中国石油大学（华东）本科生学籍管理规定》","category":"学籍管理","excerpt":"第四条学校鼓励和支持学生实行自我管理、自我服务、自我教育、自我监督。学生可根据个人情况，合理、灵活地通过选课安排自己的学习进程，但在校学习年限不能超过学校规定的最长学习年限。第二章入学与注册第五条新生须持高考准考证、录取通知书和身份证，按照录取通知书规定的时间报到。报到时，学校对新生入学资格进行初步审查，审查合格的办理入学手续，予以注册学籍；审查发现新生的录……"},{"id":183,"type":"multi","stem":"中国石油大学（华东）本科毕业生符合下列条件者可授予学士学位。","options":[["A","遵守中华人民共和国宪法和法律"],["B","完成本专业培养方案规定的各项要求"],["C","遵守学校的规章制度"],["D","必修课程学分绩≥70分"]],"answer":["A","B","C","D"],"source":"《中国石油大学（华东）学士学位授予办法》","category":"学籍管理","excerpt":"第三条本细则适用于学校普通高等教育全日制本科毕业生。第二章学位授予标准第四条达到以下标准者，可在规定时间内向学校提出申请，经学校学位评定委员会审查通过后，授予学士学位：（一）拥护中国共产党的领导、拥护社会主义制度，遵守宪法和法律法规，遵守学校规章制度，遵守学术道德和学术规范。（二）在校学习且学习时间在学校规定最长学习年限内，或结业后不满1年。（三）完成本专业……"},{"id":184,"type":"multi","stem":"凡属下列情况之一者不授予学士学位","options":[["A","未按要求完成本专业的培养方案"],["B","必修课程学分＜70分"],["C","严重违背学术诚信，有考试作弊、剽窃他人学术成果"],["D","曾受记过及以上处分"]],"answer":["A","B","C","D"],"source":"《中国石油大学（华东）学士学位授予办法》","category":"学籍管理","excerpt":"第三条本细则适用于学校普通高等教育全日制本科毕业生。第二章学位授予标准第四条达到以下标准者，可在规定时间内向学校提出申请，经学校学位评定委员会审查通过后，授予学士学位：（一）拥护中国共产党的领导、拥护社会主义制度，遵守宪法和法律法规，遵守学校规章制度，遵守学术道德和学术规范。（二）在校学习且学习时间在学校规定最长学习年限内，或结业后不满1年。（三）完成本专业……"},{"id":185,"type":"multi","stem":"学生在下列哪些情况下，应交清所欠学费方能正常办理离校手续？","options":[["A","毕业"],["B","结业"],["C","肄业"],["D","休学"]],"answer":["A","B","C"],"source":"《中国石油大学（华东）学分制收费管理暂行办法》","category":"学分制收费","excerpt":"第二十条学生毕业、结业、肄业离校时，应交清所欠学费方能正常办理离校手续。第四章附则第二十一条中外合作办学、校企合作办学的学费标准按照山东省有关部门批复执行。"},{"id":186,"type":"multi","stem":"有以下哪些情况之一者取消其双学位修读资格？","options":[["A","因违纪受到过记过及以上处分者"],["B","主修专业学习成绩明显下降者"],["C","在当年取得的双学位课程学分少于该学年双学位教学培养方案学分一半者"],["D","未按要求修读相关课程者"]],"answer":["A","B","C"],"source":"《中国石油大学（华东）本科生双学位培养管理办法》","category":"双学位与辅修","excerpt":"二、跨专业学习介绍1.跨学科课程为培养学生的跨领域知识融通能力，拓宽学生多学科思维视野，我校在2024版本科专业人才培养方案中设置了跨学科课程，学生须跨专业类选择修读其他专业的专业课程不少于4学分。从2024级学生开始，4个学分跨学科课程是完成学业的必要条件（具体以本专业培养方案为准）。同学们在选课的时候，根据自己的兴趣合理安排修读计划。如果同学们学有余力，……"},{"id":187,"type":"multi","stem":"学生在修读辅修专业过程中,如果出现（）或（）时,学生所在院部有权取消其辅修资格,报教务处备案。","options":[["A","主修专业课程不及格"],["B","辅修专业课程不及格"],["C","主修专业课程成绩有明显下降"],["D","辅修专业课程成绩有明显下降"]],"answer":["A","C"],"source":"《中国石油大学（华东）本科生辅修培养管理办法》","category":"双学位与辅修","excerpt":"二、跨专业学习介绍1.跨学科课程为培养学生的跨领域知识融通能力，拓宽学生多学科思维视野，我校在2024版本科专业人才培养方案中设置了跨学科课程，学生须跨专业类选择修读其他专业的专业课程不少于4学分。从2024级学生开始，4个学分跨学科课程是完成学业的必要条件（具体以本专业培养方案为准）。同学们在选课的时候，根据自己的兴趣合理安排修读计划。如果同学们学有余力，……"},{"id":188,"type":"multi","stem":"辅修专业培养方案由辅修专业开设院部制定,所设课程应是本专业的主要（）和（）。","options":[["A","专业基础课"],["B","专业限选课"],["C","专业课"],["D","选修课"]],"answer":["A","C"],"source":"《中国石油大学（华东）本科生辅修培养管理办法》","category":"双学位与辅修","excerpt":"二、跨专业学习介绍1.跨学科课程为培养学生的跨领域知识融通能力，拓宽学生多学科思维视野，我校在2024版本科专业人才培养方案中设置了跨学科课程，学生须跨专业类选择修读其他专业的专业课程不少于4学分。从2024级学生开始，4个学分跨学科课程是完成学业的必要条件（具体以本专业培养方案为准）。同学们在选课的时候，根据自己的兴趣合理安排修读计划。如果同学们学有余力，……"},{"id":189,"type":"multi","stem":"因创业休学的学生，有下列哪些情况之一者,可申请复学？","options":[["A","创业休学期满"],["B","创业休学期未满,但主动提出复学申请"],["C","无理由"],["D","年度审查认定为不适合继续创业休学"]],"answer":["A","B","D"],"source":"《中国石油大学（华东）本科生创新创业学籍管理办法（试行）》","category":"创新创业","excerpt":"第十二条学分记载及资料存档工作由学生所在院（部）负责。第五章复学第十三条有下列情况之一者，可申请复学：1.创业休学期满；2.创业休学期未满，但主动提出复学申请；3.年度审查认定为不适合继续创业休学。"},{"id":190,"type":"multi","stem":"学生创业实践可申请认定为自主发展计划学分,每学年最高计（）分,累计不超过（）分。","options":[["A","4"],["B","5"],["C","8"],["D","10"]],"answer":["A","D"],"source":"《中国石油大学（华东）本科生创新创业学籍管理办法（试行）》","category":"创新创业","excerpt":"第九条学生创业实践可申请认定为自主发展计划（第二课堂）学分，每学年最高计2分，累计不超过自主发展计划（第二课堂）总学分。学生以团队形式参加创业实践，学分认定按团队成员贡献大小赋分。"},{"id":191,"type":"multi","stem":"每年12月底前,创业休学学生须向所在院（部）提交项目进展报告,创业满1年的还需提交（）或（）,由院（部）创新创业教育领导小组认定、学校创新创业教育工作领导小组办公审定。","options":[["A","完税证明"],["B","免税证明"],["C","缴税证明"],["D","营业执照副本"]],"answer":["A","B"],"source":"《中国石油大学（华东）本科生创新创业学籍管理办法（试行）》","category":"创新创业","excerpt":"第六条每年12月底前，创业休学学生须向所在院（部）提交项目进展报告，创业满1年的还需提交完税证明或免税证明，由院（部）创新创业教育领导小组认定、学校创新创业教育工作领导小组办公室审定。对于在创业休学期间创业项目无实际进展，或从事与创业计划无关活动，经认定不适合继续创业者，应终止休学。第四章学分认定第七条学生参加创新活动、创业实践，可申请学分认定。同一创新创业……"},{"id":192,"type":"multi","stem":"学生参加（）等创新活动,可申请认定为自主发展计划中的科技创新学分。","options":[["A","学科竞赛"],["B","课外科技活动"],["C","创新项目研究"],["D","发表论文"],["E","获得专利"]],"answer":["A","B","C","D","E"],"source":"《中国石油大学（华东）本科生创新创业学籍管理办法（试行）》","category":"创新创业","excerpt":"第八条学生参加学科竞赛、课外科技活动、创新项目研究、发表论文、获得专利等创新活动，可申请认定为自主发展计划（第二课堂）中的创新创业学分。"},{"id":193,"type":"multi","stem":"在优良学风班评选过程中，符合以下哪些情况之一者不得申报或取消其当年评选资格？","options":[["A","凡班级有学生在评选当年受到学校处分者"],["B","凡班级申报材料弄虚作假者"],["C","凡班级党团组织建设不全者"],["D","凡班级未获得集体荣誉者"]],"answer":["A","B"],"source":"《中国石油大学(华东)优良学风班评选办法》","category":"优良学风班","excerpt":"二、评选标准1.评选优良学风班需具备以下条件：（1）全班学生政治思想状况良好，拥护党的路线、方针、政策；（2）全班学生学习态度端正，学习目的明确，学习气氛浓厚；（3）全班学生遵守法纪，遵守《高等学校学生行为准则》和学校的各项规章制度；（4）班集体凝聚力强，开展集体活动效果良好；（5）全班学生学习效果显著：各门必修课程考试及格率达95%，优良率达60%，各种竞……"},{"id":194,"type":"multi","stem":"评选优良学风班需具备以下哪些条件?","options":[["A","全班学生学习态度端正,学习目的明确,学习气氛浓厚"],["B","全班学生政治思想状况良好,拥护党的路线、方针、政策"],["C","全班学生遵守法纪,遵守《高等学校学生行为准则》和学校的各项规章制度"],["D","班集体凝聚力强,开展集体活动效果良好"],["E","全班学生学习效果显著"]],"answer":["A","B","C","D","E"],"source":"《中国石油大学(华东)优良学风班评选办法》","category":"优良学风班","excerpt":"二、评选标准1.评选优良学风班需具备以下条件：（1）全班学生政治思想状况良好，拥护党的路线、方针、政策；（2）全班学生学习态度端正，学习目的明确，学习气氛浓厚；（3）全班学生遵守法纪，遵守《高等学校学生行为准则》和学校的各项规章制度；（4）班集体凝聚力强，开展集体活动效果良好；（5）全班学生学习效果显著：各门必修课程考试及格率达95%，优良率达60%，各种竞……"},{"id":195,"type":"multi","stem":"学生（）、开除学籍以及自愿申请退宿的，应当按照学校规定的流程办理退宿手续。","options":[["A","毕业"],["B","退学"],["C","休学"],["D","转学"],["E","出国"]],"answer":["A","B","C","D","E"],"source":"《中国石油大学（华东）学生公寓管理规定》","category":"学生公寓","excerpt":"第十条学生毕业、退学、休学、转学、出国、开除学籍以及自愿申请退宿的，应当按照学校规定的流程办理退宿手续，物业公司对学生宿舍进行检查，对丢失或损坏公共物品者，要追究赔偿责任。对故意损坏者，责令其赔偿相应损失，结清相关费用后，在规定时间内搬离宿舍。本校本科生、硕士生毕业后继续在我校攻读硕士学位、博士学位者，应按时办理毕业离校退宿手续，在规定时间入校时，再按相关要……"},{"id":196,"type":"multi","stem":"下列哪一项不允许在学生公寓内发生？","options":[["A","私自改电线路"],["B","饲养仓鼠"],["C","离开宿舍切断电源"],["D","卫生整洁"]],"answer":["A","B"],"source":"《中国石油大学（华东）学生公寓管理规定》","category":"学生公寓","excerpt":"第四十四条学生要爱护公物，养成节水、节电的良好习惯，严禁有踢、拆、砸、烧等损坏公共设施的行为。严禁在学生公寓内赌博、打麻将、酗酒、打架、斗殴及其他违法违纪活动。严禁在公寓内饲养和携带动物。"},{"id":197,"type":"multi","stem":"以下哪种方式不允许在学生公寓内进行？","options":[["A","长明灯"],["B","长流水"],["C","使用易燃易爆物品"],["D","发放广告宣传单"],["E","损坏公共设施"]],"answer":["A","B","C","D","E"],"source":"《中国石油大学（华东）学生公寓管理规定》","category":"学生公寓","excerpt":"第四十四条学生要爱护公物，养成节水、节电的良好习惯，严禁有踢、拆、砸、烧等损坏公共设施的行为。严禁在学生公寓内赌博、打麻将、酗酒、打架、斗殴及其他违法违纪活动。严禁在公寓内饲养和携带动物。"},{"id":198,"type":"multi","stem":"以下哪种方式不允许在学生公寓内进行？","options":[["A","装饰"],["B","出租"],["C","出借"],["D","私自加床"]],"answer":["B","C","D"],"source":"《中国石油大学（华东）学生公寓管理规定》","category":"学生公寓","excerpt":"第七条学生入学时与物业公司签订《入住承诺书》，学生按照学校规定流程办理入住手续后方可入住指定床位，要爱护室内门窗、桌椅、衣橱等公共设施。学生不得将床位出借、出租、私自加床或作其他用途。"},{"id":199,"type":"multi","stem":"学生公寓严禁（）等，严禁用任何方式自炊。","options":[["A","酗酒"],["B","抽烟"],["C","点蜡烛"],["D","焚烧物品"],["E","燃放鞭炮"]],"answer":["A","B","C","D","E"],"source":"《中国石油大学（华东）学生公寓管理规定》","category":"学生公寓","excerpt":"第二十六条学生公寓严禁酗酒、抽烟、点蜡烛、焚烧物品、燃放鞭炮等，严禁用任何方式自炊。"},{"id":200,"type":"multi","stem":"学生公寓内严禁使用（）。","options":[["A","明火"],["B","手机充电器"],["C","电暖器"],["D","防限电插座"]],"answer":["A","C","D"],"source":"《中国石油大学（华东）学生公寓管理规定》","category":"学生公寓","excerpt":"第二十七条宿舍内严禁储藏或使用易燃、易爆、强腐蚀性物品，严禁使用明火、违章电器、防限电插座，严禁盗用公共用电。"},{"id":201,"type":"multi","stem":"学生公寓凭借校园一卡通刷卡进入，严禁（）。","options":[["A","攀爬阳台进入"],["B","带领陌生人进入公寓"],["C","将校园一卡通转借他人"],["D","攀爬窗户进入"]],"answer":["A","B","C","D"],"source":"《中国石油大学（华东）学生公寓管理规定》","category":"学生公寓","excerpt":"第十九条学生凭校园一卡通刷卡（或智能门禁识别）进入学生公寓，严禁以攀爬阳台、护栏、窗户等非正常手段强行进入，严禁将校园一卡通转借他人，严禁带领陌生人进入公寓。对尾随跟入的陌生人，有义务劝止。"},{"id":202,"type":"multi","stem":"严禁在学生公寓内进行（）。","options":[["A","传销活动"],["B","封建迷信活动"],["C","娱乐阅读活动"],["D","传教活动"]],"answer":["A","B","D"],"source":"《中国石油大学（华东）学生公寓管理规定》","category":"学生公寓","excerpt":"第四十五条严禁在学生公寓内进行传销活动、封建迷信活动、宗教活动、传教活动。"},{"id":203,"type":"multi","stem":"关于宿舍门锁和钥匙，不得（）。","options":[["A","随意复制钥匙"],["B","转借舍友钥匙"],["C","私自换锁"],["D","另加门锁"]],"answer":["A","C","D"],"source":"《中国石油大学（华东）学生公寓管理规定》","category":"学生公寓","excerpt":"第二十条宿舍钥匙不得随意复制或转借他人，严禁私自换锁或另加门锁。"},{"id":204,"type":"multi","stem":"学校设立学生申诉处理委员会（以下简称申诉委），专门负责处理本校接受普通高等学历教育的（）（以下简称学生）因学校对其作出的处理或者处分决定不服而提出的申诉。","options":[["A","研究生"],["B","本科生"],["C","留学生"],["D","博士生"]],"answer":["A","B"],"source":"《中国石油大学（华东）学生申诉处理办法（修订）》","category":"申诉处理","excerpt":"第二条学校设立学生申诉处理委员会（以下简称申诉委），专门负责处理本校接受普通高等学历教育的研究生和本科生（以下简称学生）因学校对其作出的处理或者处分决定不服而提出的申诉。"},{"id":205,"type":"multi","stem":"申诉委主任由学校监察处处长担任，委员组成原则上应由学校相关负责人、职能部门负责人、（）、负责法律事务的相关机构负责人等组成，学生代表人数应占到委员总人数的1/5以上。","options":[["A","学生家长"],["B","教师代表"],["C","学生代表"],["D","家长委员会"]],"answer":["B","C"],"source":"《中国石油大学（华东）学生申诉处理办法（修订）》","category":"申诉处理","excerpt":"第三条申诉委以公平、公正为原则，以保障和维护学生合法权益为宗旨，对学生申诉的学校具体管理行为的合法性进行复查。第二章机构设置及职能第四条申诉委主任由学校监察处处长担任，委员组成原则上应由学校相关负责人、职能部门负责人、教师代表、学生代表、负责法律事务的相关机构负责人等组成，另外可以聘请校外法律、教育等方面专家参加，学生代表人数应占到委员总人数的1/5以上。具……"},{"id":206,"type":"multi","stem":"自主发展计划学分里至少要取得2个学分的有哪些模块","options":[["A","社会实践"],["B","创新创业"],["C","文体发展"],["D","技能培训"]],"answer":["A","B","C"],"source":"中国石油大学(华东)本科生自主发展计划","category":"自主发展计划","excerpt":"第三条对学生按照学校本科生自主发展计划要求取得的自主发展计划学分，明确具体要求，其中思想成长类不少于1个学分，创新创业类不少于1.5个学分，社会实践与志愿服务类不少于1.5个学分，文体发展类不少于1个学分，工作履历与技能培训不做学分要求。"},{"id":207,"type":"multi","stem":"大学生创业基金主要来源于（）。","options":[["A","学校拨款"],["B","社会捐赠"],["C","创业项目自身投资收益"],["D","自筹"]],"answer":["A","B","C"],"source":"中国石油大学(华东)大学生创业实践管理办法","category":"创新创业","excerpt":"第七条基地管理服务：1.入驻的项目由办公室统一管理，应定期向办公室提交项目运行情况报告，并接受中期检查和期满验收考核。2.入驻的项目可免缴场地租用费，免费享受创业培训、创业指导等服务，免费参加创业经验交流等活动。3.入驻的项目提前退出时，须提前提出书面申请，报办公室审核后，办理退出手续。第四章创业基金第八条创业基金主要来源于学校拨款、社会捐赠及创业项目自身投……"},{"id":208,"type":"multi","stem":"以下属于我校校级大学生创业基地的是（）。","options":[["A","创业孵化基地"],["B","创客空间"],["C","大学科技园创业孵化器"],["D","学生创新实践中心"]],"answer":["A","B","C","D"],"source":"中国石油大学(华东)大学生创业实践管理办法","category":"创新创业","excerpt":"第三条大学生创业协会作为校级学生组织，负责全校大学生创业氛围的营造和创业活动的开展，协助办公室负责创业项目和创业基地的管理。第三章创业基地第四条校级大学生创业基地包括学生创新实践中心、创业孵化基地、创客空间和大学科技园创业孵化器。"},{"id":209,"type":"multi","stem":"图书借阅期限有哪几种类型？（ ）","options":[["A","所有读者均 60天"],["B","教职工、研究生120天"],["C","本科生 30天"],["D","校外读者 60天"]],"answer":["B","C","D"],"source":"中国石油大学（华东）图书馆开架书库借阅管理规定","category":"图书馆","excerpt":"四、借书数量与期限，预约与续借。读者类型最大续借次数最大借书量|借期教职工、研究生2次不限|120天本科生、留学生2次不限|30天校外读者2次2册|60天读者所借图书须按期归还，有逾期未还图书将导致无法继续借阅图书。凡借阅图书超过规定期限，均需缴纳超期资源占用费，每册书每超一天需缴纳超期资源占用费0.1元。对于累积超期30日以上仍未还书的读者，图书馆将取消其……"},{"id":210,"type":"multi","stem":"图书归还时所产生的超期费如何缴纳？图书续借怎么办？如果不及时归还会有什么影响？（ ）","options":[["A","超期费可在各开架书库刷卡缴纳"],["B","读者可通过“网上图书馆”或各服务台续借图书"],["C","每本图书仅能续借1次"],["D","所借图书超过借阅期限，每册每超1天交纳资源占用费0.1元"]],"answer":["A","B","D"],"source":"中国石油大学（华东）图书馆开架书库借阅管理规定","category":"图书馆","excerpt":"四、借书数量与期限，预约与续借。读者类型最大续借次数最大借书量|借期教职工、研究生2次不限|120天本科生、留学生2次不限|30天校外读者2次2册|60天读者所借图书须按期归还，有逾期未还图书将导致无法继续借阅图书。凡借阅图书超过规定期限，均需缴纳超期资源占用费，每册书每超一天需缴纳超期资源占用费0.1元。对于累积超期30日以上仍未还书的读者，图书馆将取消其……"},{"id":211,"type":"multi","stem":"读者从图书馆所借的图书丢失了应该如何赔偿？（ ）","options":[["A","购买原版图书赔偿"],["B","原价直接赔偿"],["C","视图书的出版年份处以原价的最低3倍赔偿"],["D","置之不理"]],"answer":["A","C"],"source":"中国石油大学（华东）图书馆开架书库借阅管理规定","category":"图书馆","excerpt":"六、读者借阅图书资料逾期、损坏或遗失的处理。根据石大东发暡1996暢100号文件规定，对读者借阅图书资料逾期、损坏及遗失的处理规定如下。1.所借图书超过借阅期限，须将超期图书归还或续借后，方能继续借书。2.读者如遗失所借图书资料，需在应还日期之前向唐岛湾校区图书馆总馆一楼大厅总服务台或古镇口东区学习中心三楼服务台、古镇口西区图书馆二楼服务台登记，并在1个月内……"},{"id":212,"type":"multi","stem":"将条形码更换撕毁、故意损毁图书资料磁条、不办理借阅手续将书带出书库等视为偷窃图书资料行为，应当如何让处置？（ ）","options":[["A","处以图书资料价格10倍罚款"],["B","停止其继续使用图书馆的资格"],["C","在图书馆张榜公布进行批评，并通报当事人所在学院或单位，情节严重的报学校从严处分"],["D","不处罚"]],"answer":["A","B","C"],"source":"中国石油大学（华东）图书馆开架书库借阅管理规定","category":"图书馆","excerpt":"六、读者借阅图书资料逾期、损坏或遗失的处理。根据石大东发暡1996暢100号文件规定，对读者借阅图书资料逾期、损坏及遗失的处理规定如下。1.所借图书超过借阅期限，须将超期图书归还或续借后，方能继续借书。2.读者如遗失所借图书资料，需在应还日期之前向唐岛湾校区图书馆总馆一楼大厅总服务台或古镇口东区学习中心三楼服务台、古镇口西区图书馆二楼服务台登记，并在1个月内……"},{"id":213,"type":"multi","stem":"请读者自觉爱护图书，不得在书上（ ）","options":[["A","圈划"],["B","撕页"],["C","毁坏条码"],["D","毁坏磁条"]],"answer":["A","B","C","D"],"source":"中国石油大学（华东）图书馆开架书库借阅管理规定","category":"图书馆","excerpt":"五、文明借阅。请读者自觉爱护图书，不得在书上圈划、撕页、毁坏条码磁条芯片；爱护图书馆家具设备，不得随意刻写张贴，不得以任何形式占座。读者入馆后应保持安静，将手机或电脑等设备调至静音，自觉维护图书馆良好学习环境；自觉保持书库和各类阅览学习空间的清洁卫生；离开座位时要关闭各类设备电源，防止发生火灾。严禁携带食品、有色饮料入馆，严禁吸烟，禁止随地吐痰、乱扔废弃物；……"},{"id":214,"type":"multi","stem":"我校进入双一流学科建设的学科是（）。","options":[["A","石油与天然气工程"],["B","地质资源与地质工程"],["C","石油工程"],["D","油气储运工程"]],"answer":["A","B"],"source":"《学校概况》 无》","category":"学校概况","excerpt":"二、跨专业学习介绍1.跨学科课程为培养学生的跨领域知识融通能力，拓宽学生多学科思维视野，我校在2024版本科专业人才培养方案中设置了跨学科课程，学生须跨专业类选择修读其他专业的专业课程不少于4学 ,"answer":["B","C","D"],"source":"《中国石油大学（华东）学生文明行为规范》","category":"其他","excerpt":"中国石油大学（华东）学生文明行为规范一、品德修养篇（一）爱国荣校1.认真学习马克思列宁主义、毛泽东思想、邓小平理论、“三个代表”重要思想、科学发展观理论和习近平总书记系列重要讲话精神，坚持四项基本原则，拥护党的政策，维护党和国家的利益，关心时事，在思想和行动上与党中央保持一致。2.热爱祖国，坚决维护祖国统一和民族团结，坚决与分裂祖国和破坏民族团结的行为作斗争……"},{"id":220,"type":"multi","stem":"以下行为属于遵守教室文明规范的是（）。","options":[["A","遵守课堂纪律,不迟到、不早退、不旷课。"],["B","上课专心听讲,手机关机或调成震动、静音，不接打电话、收发短信，浏览网页。"],["C","课间休息时，不大声喧哗，主动擦黑板，整理讲台。"],["D","仪容整洁、衣着大方,不穿拖鞋、背心、超短裤、超短裙等进入教室。"]],"answer":["A","B","C","D"],"source":"《中国石油大学（华东）学生文明行为规范》","category":"其他","excerpt":"二、学习场所篇（一）教室文明规范1.遵守课堂纪律，不迟到、不早退、不旷课。2.上课专心听讲，手机关机或调成震动、静音，不接打电话、收发短信、浏览网络。3.课间休息时，不大声喧哗，主动擦黑板，整理讲台。4.仪容整洁、衣着大方，不穿拖鞋、背心、超短裤、超短裙等进入教室。5.爱护教学设施，不乱刻乱画，不拆移或损坏室内设备。6.保持教室卫生，不在教室内抽烟、乱扔垃圾……"},{"id":221,"type":"multi","stem":"以下行为属于遵守教室文明规范的是（）。","options":[["A","爱护教学设施,不乱刻乱画,不拆移或损坏室内设备。"],["B","不在教室内占座、聊天、睡觉、看电影,不随便占用教室从他与学习无关的活动。"],["C","保持教室卫生,不在教室内抽烟、乱扔垃圾、随地吐痰等。"],["D","不带食品进入教室,不在教室吃东西。"]],"answer":["A","B","C","D"],"source":"《中国石油大学（华东）学生文明行为规范》","category":"其他","excerpt":"二、学习场所篇（一）教室文明规范1.遵守课堂纪律，不迟到、不早退、不旷课。2.上课专心听讲，手机关机或调成震动、静音，不接打电话、收发短信、浏览网络。3.课间休息时，不大声喧哗，主动擦黑板，整理讲台。4.仪容整洁、衣着大方，不穿拖鞋、背心、超短裤、超短裙等进入教室。5.爱护教学设施，不乱刻乱画，不拆移或损坏室内设备。6.保持教室卫生，不在教室内抽烟、乱扔垃圾……"},{"id":222,"type":"multi","stem":"关于在图书馆中的行为举止，以下说法中正确的是（）。","options":[["A","刷卡入馆,按时离馆。衣着得体,不穿拖鞋。"],["B","遵章守纪,举止文明。自觉不占座,规范乘电梯。"],["C","保持安静,交谈低声。不在馆内朗读,手机震动静音。"],["D",".公共空间,保持卫生。不带食品,严禁吸烟。"]],"answer":["A","B","C","D"],"source":"《中国石油大学（华东）学生文明行为规范》","category":"其他","excerpt":"二、学习场所篇（一）教室文明规范1.遵守课堂纪律，不迟到、不早退、不旷课。2.上课专心听讲，手机关机或调成震动、静音，不接打电话、收发短信、浏览网络。3.课间休息时，不大声喧哗，主动擦黑板，整理讲台。4.仪容整洁、衣着大方，不穿拖鞋、背心、超短裤、超短裙等进入教室。5.爱护教学设施，不乱刻乱画，不拆移或损坏室内设备。6.保持教室卫生，不在教室内抽烟、乱扔垃圾……"},{"id":223,"type":"multi","stem":"关于在计算机机房中的行为举止，以下说法中正确的是（）。","options":[["A","严格按规程操作机器,不随便操作教师主控台机器。"],["B","机房内保持安静,控制音响音量,手机关机或调成震动、静音,不接打电话。"],["C","自由上机时,不玩游戏,不浏览色情网站。"],["D","上机结束后,将设备整理好放回原位。"]],"answer":["A","B","C","D"],"source":"《中国石油大学（华东）学生文明行为规范》","category":"其他","excerpt":"二、学习场所篇（一）教室文明规范1.遵守课堂纪律，不迟到、不早退、不旷课。2.上课专心听讲，手机关机或调成震动、静音，不接打电话、收发短信、浏览网络。3.课间休息时，不大声喧哗，主动擦黑板，整理讲台。4.仪容整洁、衣着大方，不穿拖鞋、背心、超短裤、超短裙等进入教室。5.爱护教学设施，不乱刻乱画，不拆移或损坏室内设备。6.保持教室卫生，不在教室内抽烟、乱扔垃圾……"},{"id":224,"type":"multi","stem":"以下行为中属于遵守宿舍文明规范的是（）。","options":[["A","遵守公寓管理规定,自觉营造安全、文明、整洁的生活和学习环境。"],["B","出入公寓时,主动配合工作人员检查,刷卡进入,不翻越阳台。"],["C","访客进入宿舍时,应主动问好,热情交谈,访客离开时应起身相送。"],["D","严禁无故夜不归宿,晚归要主动如实登记并说明原因。"]],"answer":["A","B","C","D"],"source":"《中国石油大学（华东）学生文明行为规范》","category":"其他","excerpt":"三、生活场所篇（一）宿舍文明规范1.遵守公寓管理规定，自觉营造安全、文明、整洁的生活和学习环境。2.出入公寓时，主动配合工作人员检查，刷卡进入，不翻越阳台。3.遵守作息制度，按时起床就寝，合理制定并严格执行宿舍值日制度。4.起床后及时整理内务卫生，保持床铺、桌面、地面、阳台干净整洁。5.宿舍环境布置要健康向上、高雅大方，不乱拉电线、网线，不乱贴乱画。6.宿舍……"},{"id":225,"type":"multi","stem":"以下行为中属于遵守宿舍文明规范的是（）。","options":[["A","公寓内不抽烟、不酗酒,不大声喧哗,不饲养宠物,不留宿他人。"],["B","不将易燃、易爆物品带入宿舍,不使用明火,不焚烧杂物,不使用违规电器,不在宿舍内做饭。"],["C","增强自我防范意识,休息或外出时锁好门、关好窗、关闭电源,发现可疑人员立即询问、报告。"],["D","尊重宗教活动自由，可一定程度上在公寓内从事小规模的宗教活动,但禁止在公寓内张贴、散发宗教类宣传品。"]],"answer":["A","B","C"],"source":"《中国石油大学（华东）学生文明行为规范》","category":"其他","excerpt":"三、生活场所篇（一）宿舍文明规范1.遵守公寓管理规定，自觉营造安全、文明、整洁的生活和学习环境。2.出入公寓时，主动配合工作人员检查，刷卡进入，不翻越阳台。3.遵守作息制度，按时起床就寝，合理制定并严格执行宿舍值日制度。4.起床后及时整理内务卫生，保持床铺、桌面、地面、阳台干净整洁。5.宿舍环境布置要健康向上、高雅大方，不乱拉电线、网线，不乱贴乱画。6.宿舍……"},{"id":226,"type":"multi","stem":"现代生活越来越离不开网络，以下说法中正确的是（）。","options":[["A","合理安排上网时间,不占用正常的学习时间上网,不通宵上网以免影响他人的正常作息。"],["B","合理使用网络,利用网络资源充实自己,不沉迷于网络游戏或网络小说。"],["C","遵守不同网站和论坛的相关规则,不进行网络欺诈、网络赌博、网络恶意投票等行为。"],["D","增强自我保护意识,不轻易相信网络信息,不随意与网友见面。"]],"answer":["A","B","C","D"],"source":"《中国石油大学（华东）学生文明行为规范》","category":"其他","excerpt":"三、生活场所篇（一）宿舍文明规范1.遵守公寓管理规定，自觉营造安全、文明、整洁的生活和学习环境。2.出入公寓时，主动配合工作人员检查，刷卡进入，不翻越阳台。3.遵守作息制度，按时起床就寝，合理制定并严格执行宿舍值日制度。4.起床后及时整理内务卫生，保持床铺、桌面、地面、阳台干净整洁。5.宿舍环境布置要健康向上、高雅大方，不乱拉电线、网线，不乱贴乱画。6.宿舍……"},{"id":227,"type":"multi","stem":"现代生活越来越离不开网络，以下说法中正确的是（）。","options":[["A","明辨网络信息,保持清醒头脑,不造谣,不信谣,不传谣。"],["B","文明上网,不使用粗俗和挑衅的语言,不对他人进行人身攻击,不公开他人隐私。"],["C","不浏览不良信息,不转发、推送不文明、不健康的信息或邮件,不观看或传播色情网站。"],["D","大的门户网站推送的信息都是经过严格审查的，可以根据标题直接转发，以尽快起到宣传效果。"]],"answer":["A","B","C"],"source":"《中国石油大学（华东）学生文明行
