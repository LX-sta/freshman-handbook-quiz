<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0d5b9e">
  <title>新生手册刷题</title>
  <style>
/* ============ 基础 ============ */
:root {
  --primary: #0d5b9e;
  --primary-deep: #094a80;
  --primary-light: #e8f2fb;
  --accent: #f5a623;
  --bg: #f0f4f8;
  --card: #ffffff;
  --text: #1f2d3d;
  --text-sub: #6b7a8c;
  --line: #e3e9ef;
  --green: #1e9e5a;
  --green-bg: #e9f9f0;
  --red: #d93838;
  --red-bg: #fdeeee;
  --radius: 14px;
  --shadow: 0 2px 10px rgba(16, 42, 67, 0.07);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html { -webkit-text-size-adjust: 100%; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.65;
  font-size: 15px;
}
.app { max-width: 760px; margin: 0 auto; min-height: 100vh; display: flex; flex-direction: column; }

button { font-family: inherit; font-size: 15px; cursor: pointer; border: none; background: none; }
input[type="text"] { font-family: inherit; font-size: 15px; }

/* ============ 通用组件 ============ */
.topbar {
  position: sticky; top: 0; z-index: 20;
  display: flex; align-items: center; gap: 10px;
  padding: 12px 16px;
  background: linear-gradient(135deg, var(--primary) 0%, #1173c4 100%);
  color: #fff;
}
.topbar .title { font-size: 17px; font-weight: 600; flex: 1; }
.topbar .btn-ghost {
  color: #fff; padding: 5px 12px; border-radius: 999px;
  background: rgba(255, 255, 255, 0.16); font-size: 13px;
}
.topbar .btn-ghost:active { background: rgba(255, 255, 255, 0.28); }

.page { padding: 16px; flex: 1; }

.card {
  background: var(--card); border-radius: var(--radius);
  box-shadow: var(--shadow); padding: 18px 16px; margin-bottom: 14px;
}

.btn-main {
  display: block; width: 100%; padding: 14px;
  background: linear-gradient(135deg, var(--primary) 0%, #1173c4 100%);
  color: #fff; border-radius: 12px; font-size: 17px; font-weight: 600;
  letter-spacing: 2px;
}
.btn-main:active { opacity: 0.88; }
.btn-main[disabled] { opacity: 0.5; cursor: not-allowed; }
.btn-sub {
  display: block; width: 100%; padding: 12px;
  background: var(--primary-light); color: var(--primary-deep);
  border-radius: 12px; font-size: 15px; font-weight: 500;
}
.btn-sub:active { opacity: 0.8; }
.btn-row { display: flex; gap: 10px; }
.btn-row > button { flex: 1; }

.badge {
  display: inline-block; padding: 1px 9px; border-radius: 999px;
  font-size: 12px; line-height: 1.7; margin-right: 6px; white-space: nowrap;
}
.badge.type { background: var(--primary-light); color: var(--primary-deep); }
.badge.cat { background: #f2f0eb; color: #8a7440; }
.badge.ok { background: var(--green-bg); color: var(--green); }
.badge.bad { background: var(--red-bg); color: var(--red); }

/* ============ 首页 ============ */
.hero {
  background: linear-gradient(135deg, var(--primary) 0%, #1173c4 100%);
  border-radius: var(--radius); color: #fff;
  padding: 26px 20px 22px; margin-bottom: 14px; box-shadow: var(--shadow);
}
.hero h1 { font-size: 24px; letter-spacing: 1px; }
.hero p { opacity: 0.85; font-size: 13px; margin-top: 4px; }
.hero .total {
  margin-top: 14px; display: flex; align-items: baseline; gap: 8px;
}
.hero .total b { font-size: 30px; font-weight: 700; }
.hero .total span { font-size: 13px; opacity: 0.85; }

.stat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 14px; }
.stat-cell {
  background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow);
  padding: 12px 8px; text-align: center;
}
.stat-cell b { display: block; font-size: 19px; color: var(--primary-deep); }
.stat-cell span { font-size: 12px; color: var(--text-sub); }

.section-title { font-size: 15px; font-weight: 600; margin: 4px 2px 10px; display: flex; align-items: center; justify-content: space-between; }
.section-title .hint { font-size: 12px; color: var(--text-sub); font-weight: 400; }

.chip-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.chip-grid.type-grid { grid-template-columns: repeat(4, 1fr); }
.chip {
  position: relative; text-align: center; padding: 10px 4px;
  border: 1.5px solid var(--line); border-radius: 10px;
  background: #fff; color: var(--text-sub); font-size: 13px;
  transition: all .15s;
}
.chip b { display: block; font-size: 17px; color: var(--text); font-weight: 600; }
.chip.on { border-color: var(--primary); background: var(--primary-light); color: var(--primary-deep); }
.chip.on b { color: var(--primary-deep); }
.chip.mini { padding: 6px 4px; font-size: 12.5px; }
.link-btn { color: var(--primary); font-size: 13px; }
.link-btn:active { opacity: .6; }

.wrong-entry {
  display: flex; align-items: center; gap: 12px;
  background: var(--card); border-radius: var(--radius);
  box-shadow: var(--shadow); padding: 16px; margin-bottom: 14px; width: 100%; text-align: left;
}
.wrong-entry .icon {
  width: 44px; height: 44px; border-radius: 12px; flex: none;
  background: var(--red-bg); color: var(--red);
  display: flex; align-items: center; justify-content: center; font-size: 22px;
}
.wrong-entry .info { flex: 1; }
.wrong-entry .info b { font-size: 15px; }
.wrong-entry .info span { display: block; font-size: 12.5px; color: var(--text-sub); }
.wrong-entry .arrow { color: var(--text-sub); font-size: 18px; }

/* ============ 答题页 ============ */
.quiz-top { padding: 10px 16px 12px; }
.quiz-top .meta { display: flex; justify-content: space-between; align-items: baseline; color: #fff; }
.quiz-top .meta .no { font-size: 16px; font-weight: 600; }
.quiz-top .meta .no b { font-size: 22px; }
.quiz-top .meta .timer { font-size: 13px; opacity: .9; font-variant-numeric: tabular-nums; }
.quiz-top .quit { background: rgba(255,255,255,.16); color: #fff; border-radius: 999px; padding: 3px 12px; font-size: 12.5px; margin-top: 6px; }

.anscard { display: grid; grid-template-columns: repeat(10, 1fr); gap: 6px; padding: 12px 16px 4px; }
.anscard button {
  aspect-ratio: 1; border-radius: 8px; background: rgba(255,255,255,.92);
  color: var(--text-sub); font-size: 12.5px; font-weight: 600;
}
.anscard button.answered { background: #fff; color: var(--primary-deep); box-shadow: inset 0 0 0 2px var(--primary); }
.anscard button.current { background: var(--accent); color: #fff; box-shadow: none; }

.qcard { animation: fadein .18s ease; }
@keyframes fadein { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
.qcard .qhead { display: flex; flex-wrap: wrap; align-items: center; margin-bottom: 10px; }
.qcard .stem { font-size: 16px; white-space: pre-wrap; }
.qcard .note {
  margin-top: 10px; font-size: 12.5px; color: #8a7440;
  background: #faf6ec; border-radius: 8px; padding: 8px 10px;
}

.opts { margin-top: 16px; display: flex; flex-direction: column; gap: 10px; }
.opt {
  display: flex; align-items: flex-start; gap: 10px; text-align: left;
  padding: 12px 14px; border: 1.5px solid var(--line); border-radius: 12px;
  background: #fff; font-size: 15px; line-height: 1.55; color: var(--text);
  width: 100%;
}
.opt .letter {
  flex: none; width: 26px; height: 26px; border-radius: 50%;
  border: 1.5px solid #c3cfdb; color: var(--text-sub);
  display: flex; align-items: center; justify-content: center;
  font-size: 13px; font-weight: 600; margin-top: 1px;
}
.opt.on { border-color: var(--primary); background: var(--primary-light); }
.opt.on .letter { background: var(--primary); border-color: var(--primary); color: #fff; }
.opt.correct { border-color: var(--green); background: var(--green-bg); }
.opt.correct .letter { background: var(--green); border-color: var(--green); color: #fff; }
.opt.wrong { border-color: var(--red); background: var(--red-bg); }
.opt.wrong .letter { background: var(--red); border-color: var(--red); color: #fff; }

.judge-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 16px; }
.judge-btns .opt { justify-content: center; align-items: center; padding: 18px; font-size: 17px; font-weight: 600; }
.judge-btns .opt .letter { display: none; }

.fills { margin-top: 16px; display: flex; flex-direction: column; gap: 10px; }
.fill-item { display: flex; align-items: center; gap: 10px; }
.fill-item label { flex: none; font-size: 13px; color: var(--text-sub); width: 44px; }
.fill-item input {
  flex: 1; padding: 11px 12px; border: 1.5px solid var(--line); border-radius: 10px;
  outline: none; background: #fff; transition: border .15s;
}
.fill-item input:focus { border-color: var(--primary); }
.fill-item input.ok { border-color: var(--green); background: var(--green-bg); }
.fill-item input.bad { border-color: var(--red); background: var(--red-bg); }
.fill-item .std { flex: 1; font-size: 14px; padding: 8px 10px; border-radius: 8px; }

.quiz-nav { display: flex; gap: 10px; margin-top: 16px; }
.quiz-nav button {
  flex: 1; padding: 13px; border-radius: 12px; font-size: 15px; font-weight: 500;
  background: var(--primary-light); color: var(--primary-deep);
}
.quiz-nav button:disabled { opacity: .4; }
.quiz-nav button.primary {
  background: linear-gradient(135deg, var(--primary) 0%, #1173c4 100%);
  color: #fff; font-weight: 600;
}

/* 即时反馈面板 */
.feedback { margin-top: 16px; border-radius: 12px; padding: 14px; font-size: 14px; }
.feedback.good { background: var(--green-bg); color: var(--green); }
.feedback.bad { background: var(--red-bg); color: var(--red); }
.feedback b { font-size: 15px; }
.feedback .why { margin-top: 6px; color: var(--text-sub); font-size: 13px; }
.feedback .why em { font-style: normal; color: var(--text); }

/* ============ 结果页 ============ */
.score-card { text-align: center; padding: 26px 16px; }
.score-ring {
  width: 132px; height: 132px; margin: 0 auto 12px; border-radius: 50%;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  background: conic-gradient(var(--primary) var(--p, 0%), #e6edf3 0);
  position: relative;
}
.score-ring::before {
  content: ""; position: absolute; inset: 10px; border-radius: 50%; background: #fff;
}
.score-ring .val { position: relative; font-size: 32px; font-weight: 700; color: var(--primary-deep); }
.score-ring .val small { font-size: 14px; font-weight: 400; color: var(--text-sub); }
.score-ring .lab { position: relative; font-size: 12px; color: var(--text-sub); }
.score-card .sub { color: var(--text-sub); font-size: 13.5px; }
.score-card .sub b { color: var(--text); }
.score-card .sub .sep { margin: 0 8px; color: var(--line); }

.r-item { padding: 14px 0; border-bottom: 1px solid var(--line); }
.r-item:last-child { border-bottom: none; }
.r-item .qline { display: flex; gap: 8px; align-items: flex-start; }
.r-item .mark { flex: none; font-size: 13px; font-weight: 700; margin-top: 2px; }
.r-item.right .mark { color: var(--green); }
.r-item.wrong .mark { color: var(--red); }
.r-item .stem { font-size: 14.5px; }
.r-detail { margin-top: 8px; font-size: 13.5px; display: flex; flex-direction: column; gap: 3px; }
.r-detail .row { display: flex; gap: 6px; }
.r-detail .k { flex: none; color: var(--text-sub); }
.r-detail .v { color: var(--text); word-break: break-all; }
.r-detail .v.you-bad { color: var(--red); }
.r-detail .v.ans { color: var(--green); font-weight: 600; }
.r-detail .src { color: var(--text-sub); font-size: 12.5px; }
.r-detail .fill-line { padding: 2px 0; }
.r-detail .fill-line .u { margin-right: 6px; }

/* ============ 错题集 ============ */
.w-item { padding: 14px 0; border-bottom: 1px solid var(--line); }
.w-item:last-child { border-bottom: none; }
.w-item .head { display: flex; align-items: center; gap: 8px; }
.w-item .head .stem-s { flex: 1; font-size: 14px; overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; }
.w-item .cnt { flex: none; font-size: 12px; color: var(--red); background: var(--red-bg); border-radius: 999px; padding: 1px 8px; }
.w-item .del { flex: none; color: var(--text-sub); font-size: 17px; padding: 0 4px; }
.w-item .body { display: none; margin-top: 10px; font-size: 13.5px; }
.w-item.open .body { display: block; }
.w-item .body .stem-full { font-size: 14.5px; margin-bottom: 8px; white-space: pre-wrap; }
.w-item .body .opts-mini { display: flex; flex-direction: column; gap: 4px; margin-bottom: 8px; color: var(--text-sub); }
.w-item .body .opts-mini .is-ans { color: var(--green); font-weight: 600; }

.empty { text-align: center; color: var(--text-sub); padding: 40px 0; font-size: 14px; }
.empty .big { font-size: 40px; margin-bottom: 8px; }

/* ============ 弹窗 & Toast ============ */
.toast {
  position: fixed; left: 50%; bottom: 12vh; transform: translateX(-50%);
  background: rgba(23, 32, 43, 0.92); color: #fff; font-size: 13.5px;
  border-radius: 999px; padding: 9px 20px; z-index: 99;
  max-width: 86vw; text-align: center;
}
.modal-mask {
  position: fixed; inset: 0; background: rgba(15, 25, 36, 0.5); z-index: 90;
  display: flex; align-items: center; justify-content: center; padding: 24px;
}
.modal {
  background: #fff; border-radius: 16px; padding: 22px 18px; max-width: 340px; width: 100%;
  box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
}
.modal h3 { font-size: 16px; margin-bottom: 8px; }
.modal p { font-size: 14px; color: var(--text-sub); margin-bottom: 18px; }
.modal .btn-row button { padding: 10px; border-radius: 10px; }
.modal .btn-danger { background: var(--red); color: #fff; font-weight: 500; }
.modal .btn-cancel { background: #eef2f6; color: var(--text-sub); }

@media (min-width: 600px) {
  body { font-size: 16px; }
  .anscard { grid-template-columns: repeat(20, 1fr); }
  .chip-grid { grid-template-columns: repeat(4, 1fr); }
  .chip-grid.type-grid { grid-template-columns: repeat(4, 1fr); }
}

</style>
</head>

年度审查认定为不适合继续创业休学"]],"answer":["A","B","D"],"source":"《中国石油大学（华东）本科生创新创业学籍管理办法（试行）》","category":"创新创业"},{"id":190,"type":"multi","stem":"学生创业实践可申请认定为自主发展计划学分,每学年最高计（）分,累计不超过（）分。","options":[["A","4"],["B","5"],["C","8"],["D","10"]],"answer":["A","D"],"source":"《中国石油大学（华东）本科生创新创业学籍管理办法（试行）》","category":"创新创业"},{"id":191,"type":"multi","stem":"每年12月底前,创业休学学生须向所在院（部）提交项目进展报告,创业满1年的还需提交（）或（）,由院（部）创新创业教育领导小组认定、学校创新创业教育工作领导小组办公审定。","options":[["A","完税证明"],["B","免税证明"],["C","缴税证明"],["D","营业执照副本"]],"answer":["A","B"],"source":"《中国石油大学（华东）本科生创新创业学籍管理办法（试行）》","category":"创新创业"},{"id":192,"type":"multi","stem":"学生参加（）等创新活动,可申请认定为自主发展计划中的科技创新学分。","options":[["A","学科竞赛"],["B","课外科技活动"],["C","创新项目研究"],["D","发表论文"],["E","获得专利"]],"answer":["A","B","C","D","E"],"source":"《中国石油大学（华东）本科生创新创业学籍管理办法（试行）》","category":"创新创业"},{"id":193,"type":"multi","stem":"在优良学风班评选过程中，符合以下哪些情况之一者不得申报或取消其当年评选资格？","options":[["A","凡班级有学生在评选当年受到学校处分者"],["B","凡班级申报材料弄虚作假者"],["C","凡班级党团组织建设不全者"],["D","凡班级未获得集体荣誉者"]],"answer":["A","B"],"source":"《中国石油大学(华东)优良学风班评选办法》","category":"优良学风班"},{"id":194,"type":"multi","stem":"评选优良学风班需具备以下哪些条件?","options":[["A","全班学生学习态度端正,学习目的明确,学习气氛浓厚"],["B","全班学生政治思想状况良好,拥护党的路线、方针、政策"],["C","全班学生遵守法纪,遵守《高等学校学生行为准则》和学校的各项规章制度"],["D","班集体凝聚力强,开展集体活动效果良好"],["E","全班学生学习效果显著"]],"answer":["A","B","C","D","E"],"source":"《中国石油大学(华东)优良学风班评选办法》","category":"优良学风班"},{"id":195,"type":"multi","stem":"学生（）、开除学籍以及自愿申请退宿的，应当按照学校规定的流程办理退宿手续。","options":[["A","毕业"],["B","退学"],["C","休学"],["D","转学"],["E","出国"]],"answer":["A","B","C","D","E"],"source":"《中国石油大学（华东）学生公寓管理规定》","category":"学生公寓"},{"id":196,"type":"multi","stem":"下列哪一项不允许在学生公寓内发生？","options":[["A","私自改电线路"],["B","饲养仓鼠"],["C","离开宿舍切断电源"],["D","卫生整洁"]],"answer":["A","B"],"source":"《中国石油大学（华东）学生公寓管理规定》","category":"学生公寓"},{"id":197,"type":"multi","stem":"以下哪种方式不允许在学生公寓内进行？","options":[["A","长明灯"],["B","长流水"],["C","使用易燃易爆物品"],["D","发放广告宣传单"],["E","损坏公共设施"]],"answer":["A","B","C","D","E"],"source":"《中国石油大学（华东）学生公寓管理规定》","category":"学生公寓"},{"id":198,"type":"multi","stem":"以下哪种方式不允许在学生公寓内进行？","options":[["A","装饰"],["B","出租"],["C","出借"],["D","私自加床"]],"answer":["B","C","D"],"source":"《中国石油大学（华东）学生公寓管理规定》","category":"学生公寓"},{"id":199,"type":"multi","stem":"学生公寓严禁（）等，严禁用任何方式自炊。","options":[["A","酗酒"],["B","抽烟"],["C","点蜡烛"],["D","焚烧物品"],["E","燃放鞭炮"]],"answer":["A","B","C","D","E"],"source":"《中国石油大学（华东）学生公寓管理规定》","category":"学生公寓"},{"id":200,"type":"multi","stem":"学生公寓内严禁使用（）。","options":[["A","明火"],["B","手机充电器"],["C","电暖器"],["D","防限电插座"]],"answer":["A","C","D"],"source":"《中国石油大学（华东）学生公寓管理规定》","category":"学生公寓"},{"id":201,"type":"multi","stem":"学生公寓凭借校园一卡通刷卡进入，严禁（）。","options":[["A","攀爬阳台进入"],["B","带领陌生人进入公寓"],["C","将校园一卡通转借他人"],["D","攀爬窗户进入"]],"answer":["A","B","C","D"],"source":"《中国石油大学（华东）学生公寓管理规定》","category":"学生公寓"},{"id":202,"type":"multi","stem":"严禁在学生公寓内进行（）。","options":[["A","传销活动"],["B","封建迷信活动"],["C","娱乐阅读活动"],["D","传教活动"]],"answer":["A","B","D"],"source":"《中国石油大学（华东）学生公寓管理规定》","category":"学生公寓"},{"id":203,"type":"multi","stem":"关于宿舍门锁和钥匙，不得（）。","options":[["A","随意复制钥匙"],["B","转借舍友钥匙"],["C","私自换锁"],["D","另加门锁"]],"answer":["A","C","D"],"source":"《中国石油大学（华东）学生公寓管理规定》","category":"学生公寓"},{"id":204,"type":"multi","stem":"学校设立学生申诉处理委员会（以下简称申诉委），专门负责处理本校接受普通高等学历教育的（）（以下简称学生）因学校对其作出的处理或者处分决定不服而提出的申诉。","options":[["A","研究生"],["B","本科生"],["C","留学生"],["D","博士生"]],"answer":["A","B"],"source":"《中国石油大学（华东）学生申诉处理办法（修订）》","category":"申诉处理"},{"id":205,"type":"multi","stem":"申诉委主任由学校监察处处长担任，委员组成原则上应由学校相关负责人、职能部门负责人、（）、负责法律事务的相关机构负责人等组成，学生代表人数应占到委员总人数的1/5以上。","options":[["A","学生家长"],["B","教师代表"],["C","学生代表"],["D","家长委员会"]],"answer":["B","C"],"source":"《中国石油大学（华东）学生申诉处理办法（修订）》","category":"申诉处理"},{"id":206,"type":"multi","stem":"自主发展计划学分里至少要取得2个学分的有哪些模块","options":[["A","社会实践"],["B","创新创业"],["C","文体发展"],["D","技能培训"]],"answer":["A","B","C"],"source":"中国石油大学(华东)本科生自主发展计划","category":"自主发展计划"},{"id":207,"type":"multi","stem":"大学生创业基金主要来源于（）。","options":[["A","学校拨款"],["B","社会捐赠"],["C","创业项目自身投资收益"],["D","自筹"]],"answer":["A","B","C"],"source":"中国石油大学(华东)大学生创业实践管理办法","category":"创新创业"},{"id":208,"type":"multi","stem":"以下属于我校校级大学生创业基地的是（）。","options":[["A","创业孵化基地"],["B","创客空间"],["C","大学科技园创业孵化器"],["D","学生创新实践中心"]],"answer":["A","B","C","D"],"source":"中国石油大学(华东)大学生创业实践管理办法","category":"创新创业"},{"id":209,"type":"multi","stem":"图书借阅期限有哪几种类型？（ ）","options":[["A","所有读者均 60天"],["B","教职工、研究生120天"],["C","本科生 30天"],["D","校外读者 60天"]],"answer":["B","C","D"],"source":"中国石油大学（华东）图书馆开架书库借阅管理规定","category":"图书馆"},{"id":210,"type":"multi","stem":"图书归还时所产生的超期费如何缴纳？图书续借怎么办？如果不及时归还会有什么影响？（ ）","options":[["A","超期费可在各开架书库刷卡缴纳"],["B","读者可通过“网上图书馆”或各服务台续借图书"],["C","每本图书仅能续借1次"],["D","所借图书超过借阅期限，每册每超1天交纳资源占用费0.1元"]],"answer":["A","B","D"],"source":"中国石油大学（华东）图书馆开架书库借阅管理规定","category":"图书馆"},{"id":211,"type":"multi","stem":"读者从图书馆所借的图书丢失了应该如何赔偿？（ ）","options":[["A","购买原版图书赔偿"],["B","原价直接赔偿"],["C","视图书的出版年份处以原价的最低3倍赔偿"],["D","置之不理"]],"answer":["A","C"],"source":"中国石油大学（华东）图书馆开架书库借阅管理规定","category":"图书馆"},{"id":212,"type":"multi","stem":"将条形码更换撕毁、故意损毁图书资料磁条、不办理借阅手续将书带出书库等视为偷窃图书资料行为，应当如何让处置？（ ）","options":[["A","处以图书资料价格10倍罚款"],["B","停止其继续使用图书馆的资格"],["C","在图书馆张榜公布进行批评，并通报当事人所在学院或单位，情节严重的报学校从严处分"],["D","不处罚"]],"answer":["A","B","C"],"source":"中国石油大学（华东）图书馆开架书库借阅管理规定","category":"图书馆"},{"id":213,"type":"multi","stem":"请读者自觉爱护图书，不得在书上（ ）","options":[["A","圈划"],["B","撕页"],["C","毁坏条码"],["D","毁坏磁条"]],"answer":["A","B","C","D"],"source":"中国石油大学（华东）图书馆开架书库借阅管理规定","category":"图书馆"},{"id":214,"type":"multi","stem":"我校进入双一流学科建设的学科是（）。","options":[["A","石油与天然气工程"],["B","地质资源与地质工程"],["C","石油工程"],["D","油气储运工程"]],"answer":["A","B"],"source":"《学校概况》 无》","category":"学校概况"},{"id":215,"type":"multi","stem":"我校现已成为为一所（）的大学。","options":[["A","以工为主"],["B","以理工为主"],["C","石油石化特色鲜明"],["D","多学科协调发展"]],"answer":["A","C","D"],"source":"《学校概况》 前言 第I页》","category":"学校概况"},{"id":216,"type":"multi","stem":"以下属于我校二级教学院部的是（）。","options":[["A","石油工程学院"],["B","机电工程学院"],["C","荟萃学院"],["D","后备军官学院"]],"answer":["A","B"],"source":"《学校概况》 前言 第Ⅱ页》","category":"学校概况"},{"id":217,"type":"multi","stem":"以下属于我校国家及省部重点实验室和研究机构的是（）。","options":[["A","重质油国家重点实验室"],["B","海洋物探及勘探设备国家工程实验室"],["C","油气加工新技术教育部工程研究中心"],["D","石油石化新型装备与技术教育部工程研究中心"]],"answer":["A","B","C","D"],"source":"《学校概况》 前言 第Ⅳ页》","category":"学校概况"},{"id":218,"type":"multi","stem":"以下说法中属于好学乐业表现的是（）。","options":[["A","以学习为中心,走全面发展之路,践行“勤奋、严谨、求实、创新”优良学风。"],["B","夯实专业基础,善于独立思考,培养自主学习能力。"],["C","只要学好专业知识,就能提高综合素质，应尽量减少课外活动以保证充足的学习时间。"],["D","增强心理素质,勇于面对学习困难和挫折。"]],"answer":["A","B","D"],"source":"《中国石油大学（华东）学生文明行为规范》","category":"其他"},{"id":219,"type":"multi","stem":"以下说法中属于诚信守纪表现的是（）。","options":[["A","遵守宪法、法律法规，不参加非法组织和活动，但大学生属于弱势群体，为保护自身安全，应尽量减少与违纪违法行为的冲突，减少斗争。"],["B","遵守校规校纪，自觉维护正常的学习生活秩序。"],["C","遵守考试纪律，诚信应考，不作弊。"],["D","选择正常渠道和合理方式反映意见和诉求，不损害他人利益。"]],"answer":["B","C","D"],"source":"《中国石油大学（华东）学生文明行为规范》","category":"其他"},{"id":220,"type":"multi","stem":"以下行为属于遵守教室文明规范的是（）。","options":[["A","遵守课堂纪律,不迟到、不早退、不旷课。"],["B","上课专心听讲,手机关机或调成震动、静音，不接打电话、收发短信，浏览网页。"],["C","课间休息时，不大声喧哗，主动擦黑板，整理讲台。"],["D","仪容整洁、衣着大方,不穿拖鞋、背心、超短裤、超短裙等进入教室。"]],"answer":["A","B","C","D"],"source":"《中国石油大学（华东）学生文明行为规范》","category":"其他"},{"id":221,"type":"multi","stem":"以下行为属于遵守教室文明规范的是（）。","options":[["A","爱护教学设施,不乱刻乱画,不拆移或损坏室内设备。"],["B","不在教室内占座、聊天、睡觉、看电影,不随便占用教室从他与学习无关的活动。"],["C","保持教室卫生,不在教室内抽烟、乱扔垃圾、随地吐痰等。"],["D","不带食品进入教室,不在教室吃东西。"]],"answer":["A","B","C","D"],"source":"《中国石油大学（华东）学生文明行为规范》","category":"其他"},{"id":222,"type":"multi","stem":"关于在图书馆中的行为举止，以下说法中正确的是（）。","options":[["A","刷卡入馆,按时离馆。衣着得体,不穿拖鞋。"],["B","遵章守纪,举止文明。自觉不占座,规范乘电梯。"],["C","保持安静,交谈低声。不在馆内朗读,手机震动静音。"],["D",".公共空间,保持卫生。不带食品,严禁吸烟。"]],"answer":["A","B","C","D"],"source":"《中国石油大学（华东）学生文明行为规范》","category":"其他"},{"id":223,"type":"multi","stem":"关于在计算机机房中的行为举止，以下说法中正确的是（）。","options":[["A","严格按规程操作机器,不随便操作教师主控台机器。"],["B","机房内保持安静,控制音响音量,手机关机或调成震动、静音,不接打电话。"],["C","自由上机时,不玩游戏,不浏览色情网站。"],["D","上机结束后,将设备整理好放回原位。"]],"answer":["A","B","C","D"],"source":"《中国石油大学（华东）学生文明行为规范》","category":"其他"},{"id":224,"type":"multi","stem":"以下行为中属于遵守宿舍文明规范的是（）。","options":[["A","遵守公寓管理规定,自觉营造安全、文明、整洁的生活和学习环境。"],["B","出入公寓时,主动配合工作人员检查,刷卡进入,不翻越阳台。"],["C","访客进入宿舍时,应主动问好,热情交谈,访客离开时应起身相送。"],["D","严禁无故夜不归宿,晚归要主动如实登记并说明原因。"]],"answer":["A","B","C","D"],"source":"《中国石油大学（华东）学生文明行为规范》","category":"其他"},{"id":225,"type":"multi","stem":"以下行为中属于遵守宿舍文明规范的是（）。","options":[["A","公寓内不抽烟、不酗酒,不大声喧哗,不饲养宠物,不留宿他人。"],["B","不将易燃、易爆物品带入宿舍,不使用明火,不焚烧杂物,不使用违规电器,不在宿舍内做饭。"],["C","增强自我防范意识,休息或外出时锁好门、关好窗、关闭电源,发现可疑人员立即询问、报告。"],["D","尊重宗教活动自由，可一定程度上在公寓内从事小规模的宗教活动,但禁止在公寓内张贴、散发宗教类宣传品。"]],"answer":["A","B","C"],"source":"《中国石油大学（华东）学生文明行为规范》","category":"其他"},{"id":226,"type":"multi","stem":"现代生活越来越离不开网络，以下说法中正确的是（）。","options":[["A","合理安排上网时间,不占用正常的学习时间上网,不通宵上网以免影响他人的正常作息。"],["B","合理使用网络,利用网络资源充实自己,不沉迷于网络游戏或网络小说。"],["C","遵守不同网站和论坛的相关规则,不进行网络欺诈、网络赌博、网络恶意投票等行为。"],["D","增强自我保护意识,不轻易相信网络信息,不随意与网友见面。"]],"answer":["A","B","C","D"],"source":"《中国石油大学（华东）学生文明行为规范》","category":"其他"},{"id":227,"type":"multi","stem":"现代生活越来越离不开网络，以下说法中正确的是（）。","options":[["A","明辨网络信息,保持清醒头脑,不造谣,不信谣,不传谣。"],["B","文明上网,不使用粗俗和挑衅的语言,不对他人进行人身攻击,不公开他人隐私。"],["C","不浏览不良信息,不转发、推送不文明、不健康的信息或邮件,不观看或传播色情网站。"],["D","大的门户网站推送的信息都是经过严格审查的，可以根据标题直接转发，以尽快起到宣传效果。"]],"answer":["A","B","C"],"source":"《中国石油大学（华东）学生文明行为规范》","category":"其他"},{"id":228,"type":"multi","stem":"学生综合素质测评工作分（）、班级测评、（）、院部复核和学校审批五个步骤进行。","options":[["A","个人测评"],["B","个人自评"],["C","年级测评"],["D","学联测评"]],"answer":["B","C"],"source":"《中国石油大学（华东）学生综合素质测评办法（试行）》","category":"综合素质测评"},{"id":229,"type":"multi","stem":"学生综合素质测评成绩由以下哪些部分组成。","options":[["A","专业学习测评成绩"],["B","基础性素质测评成绩"],["C","发展性素质测评成绩"],["D","第二课堂素质测评成绩"]],"answer":["A","B","C"],"source":"《中国石油大学（华东）学生综合素质测评办法（试行）》","category":"综合素质测评"},{"id":230,"type":"multi","stem":"基础性素质内容包括（）等测评指标,满分100分。","options":[["A","思想政治表现"],["B","道德品质修养"],["C","身康素质"],["D","日常行为规范"]],"answer":["A","B","C","D"],"source":"《中国石油大学（华东）学生综合素质测评办法（试行）》","category":"综合素质测评"},{"id":231,"type":"multi","stem":"基础性素质测评成绩由（）分值与（）分值相加组成。","options":[["A","记实"],["B","评议"],["C","必修"],["D","选修"]],"answer":["A","B"],"source":"《中国石油大学（华东）学生综合素质测评办法（试行）》","category":"综合素质测评"},{"id":232,"type":"multi","stem":"我校的奖学金的类别主要有（）。","options":[["A","综合奖学金"],["B","单项奖学金"],["C","专项奖学金"],["D","集体奖学金"]],"answer":["A","B","C","D"],"source":"《中国石油大学（华东）学生奖学金管理细则》","category":"奖学金与资助"},{"id":233,"type":"multi","stem":"单项奖学金主要奖励在校生某一方面表现特别突出的情况，主要包括（）。","options":[["A","学习优秀奖学金"],["B","社会工作奖学金"],["C","文体奖学金"],["D","科技创新奖学金"],["E","学习进步奖学金"],["F","突出成绩奖学金"]],"answer":["A","B","C","D","E","F"],"source":"《中国石油大学（华东）学生奖学金管理细则(试行)》","category":"奖学金与资助"},{"id":234,"type":"multi","stem":"综合奖学金是指考虑学生多方面综合情况发放的奖学金，主要包括（）。","options":[["A","国家奖学金"],["B","国家励志奖学金"],["C","综合优秀奖学金"],["D","学习优秀奖学金"],["E","企事业奖学金"]],"answer":["A","B","C","E"],"source":"《中国石油大学（华东）学生奖学金管理细则(试行)》","category":"奖学金与资助"},{"id":235,"type":"multi","stem":"以下奖学金种类，属于专项奖学金奖的是（）。","options":[["A","创新创业实践卓越之星奖学金"],["B","国际交流奖学金"],["C","道德风尚奖学金"],["D","国家奖学金"]],"answer":["A","B","C"],"source":"《中国石油大学（华东）学生奖学金管理细则(试行)》","category":"奖学金与资助"},{"id":236,"type":"multi","stem":"集体奖学金包括（）。","options":[["A","先进班集体"],["B","创新创业实践卓越之星奖学金"],["C","道德风尚奖学金"],["D","优良学风班"]],"answer":["A","D"],"source":"《中国石油大学（华东）学生奖学金管理细则(试行)》","category":"奖学金与资助"},{"id":237,"type":"multi","stem":"“十大学生标兵”是指在某一方面或者多个方面表现突出的在校学生，以属于加分项目的是（）。","options":[["A","学习优秀"],["B","科技创新能力强"],["C","组织能力突出"],["D","具有文体特长"],["E","积极参加社会实践和志愿服务活动"],["F","自强不息"]],"answer":["A","B","C","D","E","F"],"source":"《中国石油大学（华东）十大学生标兵评选实施细则》","category":"其他"},{"id":238,"type":"multi","stem":"申请国家励志奖学金者需具备以下条件（）。","options":[["A","热爱祖国,拥护中国共产党的领导,坚持四项基本原则,积极践行社会主义核心价值观"],["B","参评学生应为二年级以上(含二年级)的全日制普通本科在校生,且学习态度端正,勤奋刻苦,当学年修读的课程不低于30学分,原则上专业学习测评成绩与综合素质测评成绩排名均位于前30%。"],["C","家庭经济困难，生活简朴"],["D","品行端正,诚实守信,当学年基础性素质测评等级为“B”及以上"]],"answer":["A","B","C","D"],"source":"《中国石油大学（华东）“国家奖学金”、“国家励志奖学金”、“国家助学金”评选实施细则》","category":"奖学金与资助"},{"id":239,"type":"multi","stem":"申请国家助学金者需具备以下条件（）。","options":[["A","热爱祖国,拥护中国共产党的领导,坚持四项基本原则,积极践行社会主义核心价值观"],["B","自觉遵守国家法律,无违法违纪记录;遵守各项校规校纪,未受警告及以上处分"],["C","品行端正,诚实守信,当学年基础性素质测评等级为“C”及以上"],["D","家庭经济困难，生活简朴"]],"answer":["A","B","C","D"],"source":"《中国石油大学（华东）“国家奖学金”、“国家励志奖学金”、“国家助学金”评选实施细则》","category":"奖学金与资助"},{"id":240,"type":"multi","stem":"以下属于对违反学校纪律的学生的处分的是（）。","options":[["A","警告"],["B","严重警告"],["C","记过"],["D","留校察看"],["E","开除学籍"],["F","开除党籍"]],"answer":["A","B","C","D","E"],"source":"《中国石油大学（华东）学生纪律处分规定》","category":"学生纪律处分"},{"id":241,"type":"multi","stem":"违反治安管理处罚法,受行政拘留者,视情节轻重，给予（）处分。","options":[["A","严重警告"],["B","记过"],["C","留校察看"],["D","开除学籍"]],"answer":["B","C","D"],"source":"《中国石油大学（华东）学生纪律处分规定》","category":"学生纪律处分"},{"id":242,"type":"multi","stem":"对侵犯学校知识产权行为者的处分（）。","options":[["A","未经许可,私自转让、许可使用学校知识产权者,给予严重警告处分,情节严重的,给予记过或者留校察看处分;"],["B","违反保密规定,泄露学校科技成果,包括技术秘密者,给予记过处分,造成严重后果的,给予留校察看或者开除学籍处分;"],["C","其他违反学校有关知识产权规定行为者,给予警告或者严重警告处分,使学校权益受到损失者,给予记过、留校察看或者开除学籍处分。"],["D","学生对于知识产权的概念不清的，可以从轻处分。"]],"answer":["A","B","C"],"source":"《中国石油大学（华东）学生纪律处分规定》","category":"学生纪律处分"},{"id":243,"type":"multi","stem":"以下行为中，属于违反考试纪律的是（）。","options":[["A","未按考场规则就座。"],["B","携带规定以外的物品进入考场或者未放在指定位置"],["C","用自带的草稿纸和计算器进行演算"],["D","经过监考人员许可后，借用给其他人书、笔记、资料、计算器等"],["E","考试中东张西望,企图偷看他人试卷,不服从考试工作人员管理"]],"answer":["A","B","C","E"],"source":"《中国石油大学（华东）学生纪律处分规定》","category":"学生纪律处分"},{"id":244,"type":"multi","stem":"对有违纪行为的学生,学校给予批评教育,批评教育的方式包括（）。","options":[["A","口头批评"],["B","书面警示"],["C","通报批评"],["D","开除学籍"]],"answer":["A","B","C"],"source":"《中国石油大学（华东）学生纪律处分规定》","category":"学生纪律处分"},{"id":245,"type":"multi","stem":"心理咨询服务的时间为每周一至周五的（）。","options":[["A","上午8:00-12:00"],["B","上午8:00-11:00"],["C","下午14:00-17:30"],["D","下午14:00-18:00"]],"answer":["A","C"],"source":"《心理咨询来访者须知》","category":"心理咨询"},{"id":246,"type":"multi","stem":"自主发展计划学分里至少要取得2个学分的有哪些模块","options":[["A","社会实践"],["B","创新创业"],["C","文体发展"],["D","技能培训"]],"answer":["A","B","C"],"source":"中国石油大学(华东)本科生自主发展计划","category":"自主发展计划"},{"id":247,"type":"multi","stem":"“第二课堂成绩单”思想成长类课程主要包括（）","options":[["A","入党入团情况"],["B","党团主题教育"],["C","社会实践"],["D","形式政策教育"]],"answer" "对"],["B","错"]],"answer":["B"],"source":"中国石油大学（华东）学生考试工作管理规定（修订）","category":"考试管理"},{"id":258,"type":"judge","stem":"请人代考或代人考试，以考试作弊认定，该门课程总成绩以零分记。","options":[["A","对"],["B","错"]],"answer":["A"],"source":"中国石油大学（华东）学生考试工作管理规定（修订）","category":"考试管理"},{"id":259,"type":"judge","stem":"强拿他人试卷、草稿纸（不论是否抄用），以考试违纪认定。","options":[["A","对"],["B","错"]],"answer":["B"],"source":"中国石油大学（华东）学生考试工作管理规定（修订）","category":"考试管理"},{"id":260,"type":"judge","stem":"为他人提供偷看机会，或偷看他人试卷、草稿纸，以考试作弊认定。","options":[["A","对"],["B","错"]],"answer":["A"],"source":"中国石油大学（华东）学生考试工作管理规定（修订）","category":"考试管理"},{"id":261,"type":"judge","stem":"用某种示意、动作互相传递有关考试信息，以考试违纪认定。","options":[["A","对"],["B","错"]],"answer":["B"],"source":"中国石油大学（华东）学生考试工作管理规定（修订）","category":"考试管理"},{"id":262,"type":"judge","stem":"考试中直接或以借用工具书、文具、计算器等方式传接答卷或纸条的行为双方，以考试作弊认定。","options":[["A","对"],["B","错"]],"answer":["A"],"source":"中国石油大学（华东）学生考试工作管理规定（修订）","category":"考试管理"},{"id":263,"type":"judge","stem":"用某种示意、动作互相传递有关考试信息，以违反考试纪律认定。","options":[["A","对"],["B","错"]],"answer":["B"],"source":"中国石油大学（华东）学生考试工作管理规定（修订）","category":"考试管理"},{"id":264,"type":"judge","stem":"违反考场规则使用有文字存储功能的电子设备，或使用手机等无线通讯工具查看信息，以考试违纪认定。","options":[["A","对"],["B","错"]],"answer":["B"],"source":"中国石油大学（华东）学生考试工作管理规定（修订）","category":"考试管理"},{"id":265,"type":"judge","stem":"偷看有关考试内容的资料,或与他人交谈有关考试内容，以考试作弊认定。","options":[["A","对"],["B","错"]],"answer":["A"],"source":"中国石油大学（华东）学生考试工作管理规定（修订）","category":"考试管理"},{"id":266,"type":"judge","stem":"故意损毁试卷、答题卡、答题纸等考试材料，以考试违纪认定。","options":[["A","对"],["B","错"]],"answer":["B"],"source":"中国石油大学（华东）学生考试工作管理规定（修订）","category":"考试管理"},{"id":267,"type":"judge","stem":"监考人员发现的考生违纪作弊行为会进行处理，巡考人员发现的，不进行处理。","options":[["A","对"],["B","错"]],"answer":["B"],"source":"中国石油大学（华东）学生考试工作管理规定（修订）","category":"考试管理"},{"id":268,"type":"judge","stem":"学校内部的考试，迟到40分钟以内，可以入场。","options":[["A","对"],["B","错"]],"answer":["B"],"source":"中国石油大学（华东）学生考试工作管理规定（修订）","category":"考试管理"},{"id":269,"type":"judge","stem":"考试中东张西望，企图偷看他人试卷，但没有成功，不属于考试违纪行为。","options":[["A","对"],["B","错"]],"answer":["B"],"source":"中国石油大学（华东）学生考试工作管理规定（修订）","category":"考试管理"},{"id":270,"type":"judge","stem":"提前交卷后，在不影响他人的情况下，可以继续坐在考场中。","options":[["A","对"],["B","错"]],"answer":["B"],"source":"中国石油大学（华东）学生考试工作管理规定（修订）","category":"考试管理"},{"id":271,"type":"judge","stem":"闭卷考试中，桌内、座位旁有翻开的或试卷下面垫有与考试内容相关的书、笔记、讲义、复习提纲等物品，没有翻看的话，不算考试作弊。","options":[["A","对"],["B","错"]],"answer":["B"],"source":"中国石油大学（华东）学生考试工作管理规定（修订）","category":"考试管理"},{"id":272,"type":"judge","stem":"闭卷考试中，利用文具盒、衣物或其他用品夹带与考试内容相关的笔记、复习提纲、纸条，拿出观看的，以考试作弊认定，未拿出观看的认定为违反考试纪律。","options":[["A","对"],["B","错"]],"answer":["B"],"source":"中国石油大学（华东）学生考试工作管理规定（修订）","category":"考试管理"},{"id":273,"type":"judge","stem":"用某种示意、动作互相传递有关考试信息，没有实物证据，不以考试作弊认定，可从轻处理。","options":[["A","对"],["B","错"]],"answer":["B"],"source":"中国石油大学（华东）学生考试工作管理规定（修订）","category":"考试管理"},{"id":274,"type":"judge","stem":"实验课如因特殊情况请假的，须经指导教师同意，可不用进行补做。","options":[["A","对"],["B","错"]],"answer":["B"],"source":"《中国石油大学（华东）本科实验教学管理办法》","category":"实验教学与实习"},{"id":275,"type":"judge","stem":"实验课成绩考核可采用百分制或五级记分制记载。","options":[["A","对"],["B","错"]],"answer":["A"],"source":"《中国石油大学（华东）本科实验教学管理办法》","category":"实验教学与实习"},{"id":276,"type":"judge","stem":"大学生创新创业训练计划中的创业实践项目实行学校和企业双导师制。","options":[["A","对"],["B","错"]],"answer":["A"],"source":"《中国石油大学（华东）大学生创新创业训练计划项目管理办法》","category":"创新创业"},{"id":277,"type":"judge","stem":"大学生创新创业训练计划项目负责人可以任意更换。","options":[["A","对"],["B","错"]],"answer":["B"],"source":"《中国石油大学（华东）大学生创新创业训练计划项目管理办法》","category":"创新创业"},{"id":278,"type":"judge","stem":"大学生创新创业训练计划项目中，对未能通过中期检查或工作无明显进展的项目，学校将终止其运行并追回垫付费用。","options":[["A","对"],["B","错"]],"answer":["B"],"source":"《中国石油大学（华东）大学生创新创业训练计划项目管理办法》","category":"创新创业"},{"id":279,"type":"judge","stem":"申报大学生创新创业训练计划项目时，同一研究内容已获学校其他项目资助的只要研究主题符合，可重复申报。","options":[["A","对"],["B","错"]],"answer":["B"],"source":"《中国石油大学（华东）大学生创新创业训练计划项目管理办法》","category":"创新创业"},{"id":280,"type":"judge","stem":"对存在学术不端兴伟或经费使用不当的大学生创新创业训练计划项目，学校将终止项目运行并收回资助费用。","options":[["A","对"],["B","错"]],"answer":["A"],"source":"《中国石油大学（华东）大学生创新创业训练计划项目管理办法》","category":"创新创业"},{"id":281,"type":"judge","stem":"学生在实习期间，经指导教师批准，可以调换实习岗位。","options":[["A","对"],["B","错"]],"answer":["A"],"source":"《中国石油大学（华东）本科实习教学管理办法》","category":"实验教学与实习"},{"id":282,"type":"judge","stem":"毕业设计题目为防止工作量计算上的困难，须一人一题。","options":[["A","对"],["B","错"]],"answer":["B"],"source":"《中国石油大学（华东）本科毕业设计（论文）管理规定》","category":"其他"},{"id":283,"type":"judge","stem":"在校外做毕业设计的学生不需要配备校内指导教师。","options":[["A","对"],["B","错"]],"answer":["B"],"source":"《中国石油大学（华东）本科毕业设计（论文）管理规定》","category":"其他"},{"id":284,"type":"judge","stem":"对在创新创业实践活动中取得优秀成绩的学生，学校将给予自主发展计划学分认定、综合素质测评加分等奖励，并在研究生“推免”工作中予以政策倾斜。","options":[["A","对"],["B","错"]],"answer":["A"],"source":"《中国石油大学（华东）本科生创新创业教育保障与激励暂行办法》","category":"创新创业"},{"id":285,"type":"judge","stem":"学校设有创新创业专项奖学金。","options":[["A","对"],["B","错"]],"answer":["A"],"source":"《中国石油大学（华东）本科生创新创业教育保障与激励暂行办法》","category":"创新创业"},{"id":286,"type":"judge","stem":"因健康原因不能正常上体育课的学生,经校医院或校医院指定的二级甲等以上医院诊断证明,并经体育教学部同意后,可改修保健课并免予执行《学生体质健康标准》。","options":[["A","对"],["B","错"]],"answer":["A"],"source":"《中国石油大学（华东）本科生学籍管理规定》","category":"学籍管理"},{"id":287,"type":"judge","stem":"新生入学后，学校在3个月内按照国家招生规定对其进行复查。","options":[["A","对"],["B","错"]],"answer":["A"],"source":"《中国石油大学（华东）本科生学籍管理规定》","category":"学籍管理"},{"id":288,"type":"judge","stem":"学生不请假或请假未获批准而无故缺席的,以旷课论处,并根据学校学生纪律处分相关规定给予批评教育;情节严重的,直接给予开除学籍的纪律处分。","options":[["A","对"],["B","错"]],"answer":["B"],"source":"《中国石油大学（华东）本科生学籍管理规定》","category":"学籍管理"},{"id":289,"type":"judge","stem":"学生对本科培养方案规定的课程通过自学等途径确已掌握,可以申请免修。","options":[["A","对"],["B","错"]],"answer":["A"],"source":"《中国石油大学（华东）本科生学籍管理规定》","category":"学籍管理"},{"id":290,"type":"judge","stem":"学生补考时间为每学期的开学初,补考课程为前一学期考核不及格的必修或限选课程,且申请补考的课程成绩必须达45分（含）以上。","options":[["A","对"],["B","错"]],"answer":["B"],"source":"《中国石油大学（华东）本科生学籍管理规定》","category":"学籍管理"},{"id":291,"type":"judge","stem":"本校学生学分绩的计算方式为：学分绩=Σ（修读课程成绩X课程总学分）/Σ修读课程学分。","options":[["A","对"],["B","错"]],"answer":["B"],"source":"《中国石油大学（华东）本科生学籍管理规定》","category":"学籍管理"},{"id":292,"type":"judge","stem":"因病（持校医院或校医院指定的二级甲等以上医院诊断证明）或其他特殊原因确实不能参加结课考核的学生,应于考试前提出申请并提供相关证明材料办理缓考手续,经所在院部同意,报教务处审批。","options":[["A","对"],["B","错"]],"answer":["A"],"source":"《中国石油大学（华东）本科生学籍管理规定》","category":"学籍管理"},{"id":293,"type":"judge","stem":"转专业学生须达到原专业本科培养方案规定的要求方可毕业。","options":[["A","对"],["B","错"]],"answer":["B"],"source":"《中国石油大学（华东）本科生学籍管理规定》","category":"学籍管理"},{"id":294,"type":"judge","stem":"学生转专业,应按学校规定办理手续;在未完成相关手续办理前,应参加两个专业共有的或可完成学分认证的相应课程。","options":[["A","对"],["B","错"]],"answer":["B"],"source":"《中国石油大学（华东）本科生学籍管理规定》","category":"学籍管理"},{"id":295,"type":"judge","stem":"学生毕业时未修满本科培养方案规定的学分要求,可申请延长学习年限或结业。","options":[["A","对"],["B","错"]],"answer":["A"],"source":"《中国石油大学（华东）本科生学籍管理规定》","category":"学籍管理"},{"id":296,"type":"judge","stem":"学校所发的毕业证书、学位证书、结业证书和肄业证书等如有遗失或者损坏,经本人申请,学校可提供其副本。","options":[["A","对"],["B","错"]],"answer":["B"],"source":"《中国石油大学（华东）本科生学籍管理规定》","category":"学籍管理"},{"id":297,"type":"judge","stem":"学生退学且学满2学年以上的,学校可发给肄业证书。","options":[["A","对"],["B","错"]],"answer":["B"],"source":"《中国石油大学（华东）本科生学籍管理规定》","category":"学籍管理"},{"id":298,"type":"judge","stem":"新生和在校学生应征参加中国人民解放军（含中国人民武装警察部队）,学校保留其入学资格或学籍至退役后2年,保留学籍时间不计入学习年限。","options":[["A","对"],["B","错"]],"answer":["A"],"source":"《中国石油大学（华东）本科生学籍管理规定》","category":"学籍管理"},{"id":299,"type":"judge","stem":"学生应当诚实守信,遵从学术规范,恪守学术道德,遵守保护知识产权的有关规定。 对学生学业、学术、品行等方面有严重失信行为的,可按相关规定给予相应的纪律处分,对违背学术诚信的,学校将对其获得学位及学术称号、荣誉等作出限制。","options":[["A","对"],["B","错"]],"answer":["A"],"source":"《中国石油大学（华东）本科生学籍管理规定》","category":"学籍管理"},{"id":300,"type":"judge","stem":"对违反国家招生规定入学者,学校取消其学籍,不发给学历、学位证书;已发的学历、学位证书,学校依法予以撤销。","options":[["A","对"],["B","错"]],"answer":["A"],"source":"《中国石油大学（华东）本科生学籍管理规定》","category":"学籍管理"},{"id":301,"type":"judge","stem":"学业警示级别根据学生已选必修课程中累计未取得学分数（Q）或每学期选课学分数（X）确定,分为一级警示、二级警示、三级警示等3个级别。","options":[["A","对"],["B","错"]],"answer":["A"],"source":"《中国石油大学（华东）本科生学籍管理规定》","category":"学籍管理"},{"id":302,"type":"judge","stem":"学校真实、完整地记载、出具学生学业成绩,学生重学成绩、补考成绩视情况予以标注。","options":[["A","对"],["B","错"]],"answer":["B"],"source":"《中国石油大学（华东）本科生学籍管理规定》","category":"学籍管理"},{"id":303,"type":"judge","stem":"学生入学后,一般不予转学。 如因患病或者确有特殊困难和需要,无法继续在校学习者或不适应学校学习要求的,可以申请转学。","options":[["A","对"],["B","错"]],"answer":["A"],"source":"《中国石油大学（华东）本科生学籍管理规定》","category":"学籍管理"},{"id":304,"type":"judge","stem":"本科毕业生，曾有记过及以上处分，不可授予学士学位。","options":[["A","对"],["B","错"]],"answer":["A"],"source":"《中国石油大学（华东）学士学位授予办法》","category":"学籍管理"},{"id":305,"type":"judge","stem":"学生因退学、转学等原因终止学业的，按月结算专业注册学费；每学年按10个月计算，不足1个月的，按1个月计算。学分学费按实际修读学分结算。","options":[["A","对"],["B","错"]],"answer":["A"],"source":"《中国石油大学（华东）学分制收费管理暂行办法》","category":"学分制收费"},{"id":306,"type":"judge","stem":"学生参加自主发展计划第二课堂活动的，免交学分学费。","options":[["A","对"],["B","错"]],"answer":["A"],"source":"《中国石油大学（华东）学分制收费管理暂行办法》","category":"学分制收费"},{"id":307,"type":"judge","stem":"入学复查不合格取消入学资格的新生，学校不予退还已交学费。","options":[["A","对"],["B","错"]],"answer":["B"],"source":"《中国石油大学（华东）学分制收费管理暂行办法》","category":"学分制收费"},{"id":308,"type":"judge","stem":"学生确因家庭经济困难无法及时足额交费的，可通过学校大学生资助中心申请缓交，经认定后方可注册、选课，学费缓交期间课程成绩暂不登记入档。","options":[["A","对"],["B","错"]],"answer":["A"],"source":"《中国石油大学（华东）学分制收费管理暂行办法》","category":"学分制收费"},{"id":309,"type":"judge","stem":"凡在校普通全日制本科生，品学兼优、学有余力者均可申请修读双学位。","options":[["A","对"],["B","错"]],"answer":["A"],"source":"《中国石油大学（华东）本科生双学位培养管理办法》","category":"双学位与辅修"},{"id":310,"type":"judge","stem":"双学位专业开设院部对申请双学位的同学进行必要考核，并根据考核择优录取。","options":[["A","对"],["B","错"]],"answer":["A"],"source":"《中国石油大学（华东）本科生双学位培养管理办法》","category":"双学位与辅修"},{"id":311,"type":"judge","stem":"双学位单个专业人数较少且公共时间难以调整，因此不单独组班上课。","options":[["A","对"],["B","错"]],"answer":["B"],"source":"《中国石油大学（华东）本科生双学位培养管理办法》","category":"双学位与辅修"},{"id":312,"type":"judge","stem":"修读双学位学生须获得主修专业学士学位，同时达到双学位专业培养方案的要求，方可授予双学位。","options":[["A","对"],["B","错"]],"answer":["A"],"source":"《中国石油大学（华东）本科生双学位培养管理办法》","category":"双学位与辅修"},{"id":313,"type":"judge","stem":"辅修专业开设院部和学生所在院部共同负责辅修学生的学习成绩管理。","options":[["A","对"],["B","错"]],"answer":["B"],"source":"《中国石油大学（华东）本科生辅修培养管理办法》","category":"双学位与辅修"},{"id":314,"type":"judge","stem":"主、辅修专业应属于相同专业类。","options":[["A","对"],["B","错"]],"answer":["B"],"source":"《中国石油大学（华东）本科生辅修培养管理办法》","category":"双学位与辅修"},{"id":315,"type":"judge","stem":"在校本科生学生因创业需要,可申请创业休学。","options":[["A","对"],["B","错"]],"answer":["A"],"source":"《中国石油大学（华东）本科生创新创业学籍管理办法（试行）》","category":"创新创业"},{"id":316,"type":"judge","stem":"对于在创业休学期间创业项目无实际进展,或从事与创业计划无关活动,经认定不适合继续创业者,应终止休学。","options":[["A","对"],["B","错"]],"answer":["A"],"source":"《中国石油大学（华东）本科生创新创业学籍管理办法（试行）》","category":"创新创业"},{"id":317,"type":"judge","stem":"连续创业2年及以上,且表现突出、成效显著的,可免修自主发展计划全部学分。","options":[["A","对"],["B","错"]],"answer":["B"],"source":"《中国石油大学（华东）本科生创新创业学籍管理办法（试行）》","category":"创新创业"},{"id":318,"type":"judge","stem":"学生参与创新活动,研究过程和取得成绩确能体现其学科专长和创新潜质,且转入相关专业更利于其发展的,可申请转专业。","options":[["A","对"],["B","错"]],"answer":["A"],"source":"《中国石油大学（华东）本科生创新创业学籍管理办法（试行）》","category":"创新创业"},{"id":319,"type":"judge","stem":"“优良学风班”评选每年组织一次,同一个行政班级在两年内不可以连续申报。","options":[["A","对"],["B","错"]],"answer":["B"],"source":"《中国石油大学(华东)优良学风班评选办法》","category":"优良学风班"},{"id":320,"type":"judge","stem":"宿舍夜间断电后，违规使用计算机影响他人休息者，学校师生、宿舍管理人员等均有权进行劝说、制止。","options":[["A","对"],["B","错"]],"answer":["A"],"source":"《中国石油大学（华东）学生公寓管理规定》","category":"学生公寓"},{"id":321,"type":"judge","stem":"严禁私自在学生公寓内安装使用洗衣机。","options":[["A","对"],["B","错"]],"answer":["A"],"source":"《中国石油大学（华东）学生公寓管理规定》","category":"学生公寓"},{"id":322,"type":"judge","stem":"学生在公寓中的表现纳入学生素质综合评价体系，与学生荣誉称号评选及奖学金评定等结合。","options":[["A","对"],["B","错"]],"answer":["A"],"source":"《中国石油大学（华东）学生公寓管理规定》","category":"学生公寓"},{"id":323,"type":"judge","stem":"学生公寓卫生的总体要求是：洁净、整齐。","options":[["A","对"],["B","错"]],"answer":["A"],"source":"《中国石油大学（华东）学生公寓管理规定》","category":"学生公寓"},{"id":324,"type":"judge","stem":"学生公寓内学生在使用充电器具时，房间内无须有人，但离开宿舍须切断电源。","options":[["A","对"],["B","错"]],"answer":["B"],"source":"《中国石油大学（华东）学生公寓管理规定》","category":"学生公寓"},{"id":325,"type":"judge","stem":"学生进入学生公寓时，对尾随跟入的陌生人，有义务劝止。","options":[["A","对"],["B","错"]],"answer":["A"],"source":"《中国石油大学（华东）学生公寓管理规定》","category":"学生公寓"},{"id":326,"type":"judge","stem":"毕业生办理完退宿手续后不必保持学生公寓房间内卫生洁净、整齐。","options":[["A","对"],["B","错"]],"answer":["B"],"source":"《中国石油大学（华东）学生公寓管理规定》","category":"学生公寓"},{"id":327,"type":"judge","stem":"学生公寓楼道内严禁停放自行车。","options":[["A","对"],["B","错"]],"answer":["A"],"source":"《中国石油大学（华东）学生公寓管理规定》","category":"学生公寓"},{"id":328,"type":"judge","stem":"学生公寓严禁乱拉线（灯），特殊情况须经后勤管理处批准，由物业公司统一布线，违者拆除。","options":[["A","对"],["B","错"]],"answer":["A"],"source":"《中国石油大学（华东）学生公寓管理规定》","category":"学生公寓"},{"id":329,"type":"judge","stem":"学生公寓用电按照“满足基本需要、杜绝浪费、定额管理、超额自负”的原则，实行定额内免费供电和超定额部分自己承担费用相结合的管理办法.","options":[["A","对"],["B","错"]],"answer":["A"],"source":"《中国石油大学（华东）学生公寓管理规定》","category":"学生公寓"},{"id":330,"type":"judge","stem":"学生公寓原则上不允许异性进入，特殊情况须持有效证件登记后方可进入。","options":[["A","对"],["B","错"]],"answer":["A"],"source":"《中国石油大学（华东）学生公寓管理规定》","category":"学生公寓"},{"id":331,"type":"judge","stem":"学生公寓内发现可疑人员应及时报告公寓值班人员或公安（保卫）处。","options":[["A","对"],["B","错"]],"answer":["A"],"source":"《中国石油大学（华东）学生公寓管理规定》","category":"学生公寓"},{"id":332,"type":"judge","stem":"学生公寓配备消防设备，可以移动、挪用，但不能损坏消防器材。","options":[["A","对"],["B","错"]],"answer":["B"],"source":"《中国石油大学（华东）学生公寓管理规定》","category":"学生公寓"},{"id":333,"type":"judge","stem":"学生公寓实行传染病申报制度。凡有《中华人民共和国传染病防治法》规定的各类传染病患者，应主动报告学生工作部门或校医院，在治愈前或排除传染病嫌疑前，应服从学校安排。","options":[["A","对"],["B","错"]],"answer":["A"],"source":"《中国石油大学（华东）学生公寓管理规定》","category":"学生公寓"},{"id":334,"type":"judge","stem":"学生公寓早5:30开门，晚24：00关门。晚归或断电后外出学生需主动出示有效证件，配合物业管理人员做好登记后方可出入。","options":[["A","对"],["B","错"]],"answer":["B"],"source":"《中国石油大学（华东）学生公寓管理规定》","category":"学生公寓"},{"id":335,"type":"judge","stem":"本校本科生、硕士生毕业后继续在我校攻读硕士学位、博士学位者，应按时办理毕业离校退宿手续，在规定时间入校时，再按相关要求办理住宿手续。","options":[["A","对"],["B","错"]],"answer":["A"],"source":"《中国石油大学（华东）学生公寓管理规定》","category":"学生公寓"},{"id":336,"type":"judge","stem":"宿舍内可以储藏但不能使用易燃、易爆、强腐蚀性物品。","options":[["A","对"],["B","错"]],"answer":["B"],"source":"《中国石油大学（华东）学生公寓管理规定》","category":"学生公寓"},{"id":337,"type":"judge","stem":"学生要爱护公物，养成节水、节电的良好习惯，严禁有踢、拆、砸、烧等损坏公共设施的行为。","options":[["A","对"],["B","错"]],"answer":["A"],"source":"《中国石油大学（华东）学生公寓管理规定》","category":"学生公寓"},{"id":338,"type":"judge","stem":"申诉委应在接到书面申诉之日起15日内作出复查结论，告知申诉人，并出具复查决定书。情况复杂不能在规定限期内作出结论的，经学校负责人批准，可延长15日。","options":[["A","对"],["B","错"]],"answer":["A"],"source":"《中国石油大学（华东）学生申诉处理办法（修订）》","category":"申诉处理"},{"id":339,"type":"judge","stem":"学生申诉过程中，自处理、处分或者复查决定书送达之日起，学生在申诉期内未提出申诉的视为放弃申诉，学校或者省级教育行政部门不再受理其提出的申诉。","options":[["A","对"],["B","错"]],"answer":["A"],"source":"《普通高等学校学生管理规定》（教育部令第 号）》","category":"其他"},{"id":340,"type":"judge","stem":"学校本科专业标准学制四年（建筑学专业学制五年），实行学分制管理和弹性学习年限，学生可在标准学制的基础上提前两年或延长一年毕业。","options":[["A","对"],["B","错"]],"answer":["B"],"source":"《中国石油大学（华东）本科生学籍管理规定》","category":"学籍管理"},{"id":341,"type":"judge","stem":"成绩的评定，可采用百分制（60分为及格）、五级记分制（优秀、良好、中等、及格、不及格）或二级记分制（及格、不及格）记载，及格及以上成绩取得该门课程学分。","options":[["A","对"],["B","错"]],"answer":["B"],"source":"《中国石油大学（华东）本科生学籍管理规定》","category":"学籍管理"},{"id":342,"type":"judge","stem":"连续4学期每学期选课学分数均小于20学分的学生，学校应予退学处理。","options":[["A","对"],["B","错"]],"answer":["B"],"source":"《中国石油大学（华东）本科生学籍管理规定》","category":"学籍管理"},{"id":343,"type":"judge","stem":"学分制收费，是按照学分计收学费的收费管理制度。","options":[["A","对"],["B","错"]],"answer":["B"],"source":"中国石油大学（华东）学分制收费管理暂行办法","category":"学分制收费"},{"id":344,"type":"judge","stem":"社团会员可以不是我校学生。","options":[["A","对"],["B","错"]],"answer":["B"],"source":"中国石油大学（华东）学生社团管理办法","category":"学生社团"},{"id":345,"type":"judge","stem":"本专科生奖学金每人每年最高不超过6000元，研究生奖学金每人每年最高不超过10000元。","options":[["A","对"],["B","错"]],"answer":["B"],"source":"中国石油大学（华东）国家助学贷款实施办法（修订）","category":"奖学金与资助"},{"id":346,"type":"judge","stem":"学生公寓严禁酗酒、抽烟、点蜡烛、焚烧物品、燃放鞭炮等，严禁用任何方式自炊。","options":[["A","对"],["B","错"]],"answer":["A"],"source":"中国石油大学（华东）学生公寓管理规定","category":"学生公寓"},{"id":347,"type":"judge","stem":"获得计算机三级等级证书，可以计2学分。","options":[["A","对"],["B","错"]],"answer":["B"],"source":"中国石油大学(华东)本科生自主发展计划","category":"自主发展计划"},{"id":348,"type":"judge","stem":"校级大学生创业基地入驻条件中要求项目负责人为我校在读学生。","options":[["A","对"],["B","错"]],"answer":["B"],"source":"中国石油大学(华东)大学生创业实践管理办法","category":"创新创业"},{"id":349,"type":"judge","stem":"大学生创业基地入驻项目应定期向办公室提交项目运行情况报告,并接受中期检查和期满验收考核","options":[["A","对"],["B","错"]],"answer":["A"],"source":"中国石油大学(华东)大学生创业实践管理办法","category":"创新创业"},{"id":350,"type":"judge","stem":"读者可以通过“网上图书馆”或在各服务台预约图书，预约仅限不在馆藏图书，每次预约仅限5册。","options":[["A","对"],["B","错"]],"answer":["B"],"source":"中国石油大学（华东）图书馆开架书库借阅管理规定","category":"图书馆"},{"id":351,"type":"judge","stem":"文艺书库每日开放时间为上午8点至12点，下午2点至5点半，晚上7点至10点。","options":[["A","对"],["B","错"]],"answer":["B"],"source":"中国石油大学（华东）图书馆开架书库借阅管理规定","category":"图书馆"},{"id":352,"type":"judge","stem":"借书时需要消磁，人工还书时需要充磁。","options":[["A","对"],["B","错"]],"answer":["A"],"source":"中国石油大学（华东）图书馆开架书库借阅管理规定","category":"图书馆"},{"id":353,"type":"judge","stem":"自助还书机无法识别的图书，在工作时间交给值班人员，非工作时间扔在还书台的台面上即可。","options":[["A","对"],["B","错"]],"answer":["B"],"source":"中国石油大学（华东）图书馆开架书库借阅管理规定","category":"图书馆"},{"id":354,"type":"judge","stem":"书太多，背来背去很麻烦，索性放在图书馆的阅览桌上，还可以占座。","options":[["A","对"],["B","错"]],"answer":["B"],"source":"中国石油大学（华东）图书馆开架书库借阅管理规定","category":"图书馆"},{"id":355,"type":"judge","stem":"2005年1月，学校更名为中国石油大学。","options":[["A","对"],["B","错"]],"answer":["A"],"source":"《学校概况》 前言 第I页》","category":"学校概况"},{"id":356,"type":"judge","stem":"2010年,学校成为国家首批实施“卓越工程师教育培养计的61所高校之一。","options":[["A","对"],["B","错"]],"answer":["A"],"source":"《学校概况》 前言 第Ⅱ页》","category":"学校概况"},{"id":357,"type":"judge","stem":"学校现有青岛、东营两个校区,校园总面积2500亩,建筑面积99万平方米,图书馆藏书140万册。","options":[["A","对"],["B","错"]],"answer":["B"],"source":"《学校概况》 前言 第Ⅱ页》","category":"学校概况"},{"id":358,"type":"judge","stem":"个人自评:学生根据自己日常表现,向院部测评小组提交相关证明材料。","options":[["A","对"],["B","错"]],"answer":["B"],"source":"《中国石油大学（华东）学生综合素质测评办法（试行）》","category":"综合素质测评"},{"id":359,"type":"judge","stem":"发展性素质成绩根据记实和评议得出；基础性素质成绩根据学生所获荣誉、奖励及实际参加各类活动情况记实得出。","options":[["A","对"],["B","错"]],"answer":["B"],"source":"《中国石油大学（华东）学生综合素质测评办法（试行）》","category":"综合素质测评"},{"id":360,"type":"judge","stem":"思想政治表现:主要评议学生政治表现、思想水平、法纪观念等。","options":[["A","对"],["B","错"]],"answer":["A"],"source":"《中国石油大学（华东）学生综合素质测评办法（试行）》","category":"综合素质测评"},{"id":361,"type":"judge","stem":"道德品质修养:主要评议学生道德品质、集体观念、劳动观念、生活态度等。","options":[["A","对"],["B","错"]],"answer":["A"],"source":"《中国石油大学（华东）学生综合素质测评办法（试行）》","category":"综合素质测评"},{"id":362,"type":"judge","stem":"身心健康素质:主要评议学生体育活动情况、体能测试情况、心理健康状况等。","options":[["A","对"],["B","错"]],"answer":["A"],"source":"《中国石油大学（华东）学生综合素质测评办法（试行）》","category":"综合素质测评"},{"id":363,"type":"judge","stem":"日常行为规范:主要评议学生遵守校规校纪情况、《学生文明行为规范》及《学生公寓管理规定》表现等。","options":[["A","对"],["B","错"]],"answer":["A"],"source":"《中国石油大学（华东）学生综合素质测评办法（试行）》","category":"综合素质测评"},{"id":364,"type":"judge","stem":"基础性素质测评成绩中的记实部分是指院部对学生在日常学习、生活和工作中的行为记录。","options":[["A","对"],["B","错"]],"answer":["A"],"source":"《中国石油大学（华东）学生综合素质测评办法（试行）》","category":"综合素质测评"},{"id":365,"type":"judge","stem":"学生违纪处理后，应在发展性素质测评分数中扣除相应分值。","options":[["A","对"],["B","错"]],"answer":["B"],"source":"《中国石油大学（华东）学生综合素质测评办法（试行）》","category":"综合素质测评"},{"id":366,"type":"judge","stem":"基础性素质测评成绩中的评议部分是指，根据思想政治表现、道德品质修养、身心健康、日常行为规范等方面相关内容,对学生的现实表现做出评议。","options":[["A","对"],["B","错"]],"answer":["A"],"source":"《中国石油大学（华东）学生综合素质测评办法（试行）》","category":"综合素质测评"},{"id":367,"type":"judge","stem":"发展性素质内容包括:“创新创业能力”、“社会实践能力”、“文体活动能力”及“其他4类测评指标,满分100分。","options":[["A","对"],["B","错"]],"answer":["A"],"source":"《中国石油大学（华东）学生综合素质测评办法（试行）》","category":"综合素质测评"},{"id":368,"type":"judge","stem":"发展性素质中的社会实践能力主要评议学生参与社会实践活动、志愿服务活动等校外实践活动情况。","options":[["A","对"],["B","错"]],"answer":["B"],"source":"《中国石油大学（华东）学生综合素质测评办法（试行）》","category":"综合素质测评"},{"id":369,"type":"judge","stem":"发展性素质中的文体活动能力主要评议学生参与各级各类文化、艺术、体育活动情况及表现等。","options":[["A","对"],["B","错"]],"answer":["A"],"source":"《中国石油大学（华东）学生综合素质测评办法（试行）》","category":"综合素质测评"},{"id":370,"type":"judge","stem":"发展性素质中的创新创业能力主要评议学生参与各类科技竞赛、科技活动、大学生创新创业训练计划项目、创新创业推广、创新创业实施情况及表现等。","options":[["A","对"],["B","错"]],"answer":["A"],"source":"《中国石油大学（华东）学生综合素质测评办法（试行）》","category":"综合素质测评"},{"id":371,"type":"judge","stem":"综合优秀一等奖学金4000元/人,按学生数的3%评定;二等奖学金2000元/人,按学生数的6%评定;三等奖学金1000元/人,按学生数的10%评定。","options":[["A","对"],["B","错"]],"answer":["B"],"source":"《中国石油大学（华东）学生奖学金管理细则(试行)》","category":"奖学金与资助"},{"id":372,"type":"judge","stem":"社会工作奖学金奖励标准是800元/人,按学生数的10%评定。","options":[["A","对"],["B","错"]],"answer":["B"],"source":"《中国石油大学（华东）学生奖学金管理细则(试行)》","category":"奖学金与资助"},{"id":373,"type":"judge","stem":"文体奖学金奖励标准是800元/人,按学生数的10%评定。","options":[["A","对"],["B","错"]],"answer":["A"],"source":"《中国石油大学（华东）学生奖学金管理细则(试行)》","category":"奖学金与资助"},{"id":374,"type":"judge","stem":"科技创新奖学金奖励标准是800元/人,按学生数的5%评定。","options":[["A","对"],["B","错"]],"answer":["A"],"source":"《中国石油大学（华东）学生奖学金管理细则(试行)》","category":"奖学金与资助"},{"id":375,"type":"judge","stem":"按照学生申办地点及工作流程不同,国家助学贷款分为校园地国家助学贷款与生源地信用助学贷款两种模式。","options":[["A","对"],["B","错"]],"answer":["A"],"source":"《中国石油大学（华东）国家助学贷款实施办法》","category":"奖学金与资助"},{"id":376,"type":"judge","stem":"全日制普通本专科生在同一学年可以重复申请获得校园地国家助学贷款和生源地信用助学贷款。","options":[["A","对"],["B","错"]],"answer":["B"],"source":"《中国石油大学（华东）国家助学贷款实施办法》","category":"奖学金与资助"},{"id":377,"type":"judge","stem":"校园地国家助学贷款借款学生在校学习期间利息全部由财政补贴,毕业后的利息由借款学生本人全额支付。","options":[["A","对"],["B","错"]],"answer":["A"],"source":"《中国石油大学（华东）国家助学贷款实施办法》","category":"奖学金与资助"},{"id":378,"type":"judge","stem":"校园地国家助学贷款借款学生毕业后,在还款期内继续攻读学位的,可申请继续财政贴息。","options":[["A","对"],["B","错"]],"answer":["A"],"source":"《中国石油大学（华东）国家助学贷款实施办法》","category":"奖学金与资助"},{"id":379,"type":"judge","stem":"生源地信用助学贷款申请学生在新学期开始前,需向家庭所在县（市、区）的学生资助管理中心提出贷款申请（有的地区直接到相关金融机构申请）。","options":[["A","对"],["B","错"]],"answer":["A"],"source":"《中国石油大学（华东）国家助学贷款实施办法》","category":"奖学金与资助"},{"id":380,"type":"judge","stem":"生源地信用助学贷款借款学生在校学习期间利息全部由财政补贴,毕业后的利息由借款学生本人全额支付。","options":[["A","对"],["B","错"]],"answer":["B"],"source":"《中国石油大学（华东）国家助学贷款实施办法》","category":"奖学金与资助"},{"id":381,"type":"judge","stem":"生源地信用助学贷款借款学生毕业后,在还款期内继续攻读学位的,可申请继续财政贴息。","options":[["A","对"],["B","错"]],"answer":["A"],"source":"《中国石油大学（华东）国家助学贷款实施办法》","category":"奖学金与资助"},{"id":382,"type":"judge","stem":"同一学年内,获得国家奖学金的家庭经济困难学生可以同时申请并获得国家助学金,但不能同时获得国家励志奖学金。","options":[["A","对"],["B","错"]],"answer":["A"],"source":"《中国石油大学（华东）“国家奖学金”、“国家励志奖学金”、“国家助学金”评选实施细则》","category":"奖学金与资助"},{"id":383,"type":"judge","stem":"十大学生标兵的事迹将通过校报、网络等媒体进行广泛宣传,并将在此范围内推荐山东省十大优秀学生人选。","options":[["A","对"],["B","错"]],"answer":["A"],"source":"《中国石油大学（华东）十大学生标兵评选实施细则》","category":"其他"},{"id":384,"type":"judge","stem":"个别同学出现违纪行为是个人行为，不应该让其他班级同学受到牵连，其所在班级仍然具有参评先进班集体的资格，但应按相关规定扣除一部分分数。","options":[["A","对"],["B","错"]],"answer":["B"],"source":"《中国石油大学（华东）先进班集体、优秀学生、优秀学生干部评选标准》","category":"优良学风班"},{"id":385,"type":"judge","stem":"同一学年内,获得国家奖学金、国家励志奖学金的学生只要条件符合，可重复获得其它1000元（含1000元）以上奖学金。","options":[["A","对"],["B","错"]],"answer":["B"],"source":"《中国石油大学（华东）“国家奖学金”、“国家励志奖学金”、“国家助学金”评选实施细则》","category":"奖学金与资助"},{"id":386,"type":"judge","stem":"学生违反法律法规，并依照有关法律追究其法律责任的，学校应以法律优先，不再予以其校内处分。","options":[["A","对"],["B","错"]],"answer":["B"],"source":"《中国石油大学（华东）学生纪律处分规定》","category":"学生纪律处分"},{"id":387,"type":"judge","stem":"在违纪过程中,主动有效地制止事件（事态）发生、发展的，可以减轻处分。","options":[["A","对"],["B","错"]],"answer":["A"],"source":"《中国石油大学（华东）学生纪律处分规定》","category":"学生纪律处分"},{"id":388,"type":"judge","stem":"主动交待错误事实,承认错误,且有明显悔改表现的，可以减轻处分。","options":[["A","对"],["B","错"]],"answer":["A"],"source":"《中国石油大学（华东）学生纪律处分规定》","category":"学生纪律处分"},{"id":389,"type":"judge","stem":"积极配合有关部门调查、核实情况或者提供重要证据、线索,能主动提供情况揭发他人违纪行为并经查证属实的，可以减轻处分。","options":[["A","对"],["B","错"]],"answer":["A"],"source":"《中国石油大学（华东）学生纪律处分规定》","category":"学生纪律处分"},{"id":390,"type":"judge","stem":"被他人胁迫或者诱骗,并能主动揭发事件，可以减轻处分。","options":[["A","对"],["B","错"]],"answer":["A"],"source":"《中国石油大学（华东）学生纪律处分规定》","category":"学生纪律处分"},{"id":391,"type":"judge","stem":"曾为学校获得过较高荣誉的，可凭对学校的突出贡献减轻处分。","options":[["A","对"],["B","错"]],"answer":["B"],"source":"《中国石油大学（华东）学生纪律处分规定》","category":"学生纪律处分"},{"id":392,"type":"judge","stem":"在供认违纪过程中，互相串供,隐瞒真相的，应从重处分。","options":[["A","对"],["B","错"]],"answer":["A"],"source":"《中国石油大学（华东）学生纪律处分规定》","category":"学生纪律处分"},{"id":393,"type":"judge","stem":"为逃避责任，对有关人员打击报复、威胁恫吓的，应从重处分。","options":[["A","对"],["B","错"]],"answer":["A"],"source":"《中国石油大学（华东）学生纪律处分规定》","category":"学生纪律处分"},{"id":394,"type":"judge","stem":"为逃避责任，贿赂违纪处理人员或者以其他方式干扰违纪处理工作，应从重处分。","options":[["A","对"],["B","错"]],"answer":["A"],"source":"《中国石油大学（华东）学生纪律处分规定》","category":"学生纪律处分"},{"id":395,"type":"judge","stem":"作为集体违纪事件组织策划者,或者教唆、煽动他人违纪并造成严重后果的，应从重处分。","options":[["A","对"],["B","错"]],"answer":["A"],"source":"《中国石油大学（华东）学生纪律处分规定》","category":"学生纪律处分"},{"id":396,"type":"judge","stem":"学生同时有两种以上违纪行为或者屡次违纪,可以从重或者加重处分。","options":[["A","对"],["B","错"]],"answer":["A"],"source":"《中国石油大学（华东）学生纪律处分规定》","category":"学生纪律处分"},{"id":397,"type":"judge","stem":"对泄露党和国家机密者,视情节轻重,给予留校察看或者开除学籍处分。","options":[["A","对"],["B","错"]],"answer":["A"],"source":"《中国石油大学（华东）学生纪律处分规定》","category":"学生纪律处分"},{"id":398,"type":"judge","stem":"对破坏民族团结、挑拨民族纠纷者,给予记过处分;情节严重的,给予留校察看或者开除学籍处分。","options":[["A","对"],["B","错"]],"answer":["A"],"source":"《中国石油大学（华东）学生纪律处分规定》","category":"学生纪律处分"},{"id":399,"type":"judge","stem":"组织、煽动闹事、破坏安定团结、扰乱校园秩序未造成严重后果,经教育尚能改正者,给予记过处分。","options":[["A","对"],["B","错"]],"answer":["B"],"source":"《中国石油大学（华东）学生纪律处分规定》","category":"学生纪律处分"},{"id":400,"type":"judge","stem":"组织、煽动闹事、破坏安定团结、扰乱校园秩序未造成严重后果者,给予开除学籍处分。","options":[["A","对"],["B","错"]],"answer":["B"],"source":"《中国石油大学（华东）学生纪律处分规定》","category":"学生纪律处分"},{"id":401,"type":"judge","stem":"张贴、投递、散发非法宣传品,散布、传播虚假信息或者有害信息者,情节较轻的，给予严重警告或者记过处分。","options":[["A","对"],["B","错"]],"answer":["B"],"source":"《中国石油大学（华东）学生纪律处分规定》","category":"学生纪律处分"},{"id":402,"type":"judge","stem":"参与各种非法集会、游行、示威,不听劝阻者,给予警告或者严重警告处分。","options":[["A","对"],["B","错"]],"answer":["A"],"source":"《中国石油大学（华东）学生纪律处分规定》","category":"学生纪律处分"},{"id":403,"type":"judge","stem":"在校内参与宗教活动、封建迷信活动者,给予严重警告处分,情节严重的,给予记过处分。","options":[["A","对"],["B","错"]],"answer":["A"],"source":"《中国石油大学（华东）学生纪律处分规定》","category":"学生纪律处分"},{"id":404,"type":"judge","stem":"在校内组织宗教活动或者传播宗教者,给予记过处分,情节严重的,给予留校察看或者开除学籍处分。","options":[["A","对"],["B","错"]],"answer":["A"],"source":"《中国石油大学（华东）学生纪律处分规定》","category":"学生纪律处分"},{"id":405,"type":"judge","stem":"破坏学校教育教学秩序、生活秩序以及公共场所管理秩序者,给予记过或者留校察看处分,情节严重的,给予开除学籍处分。","options":[["A","对"],["B","错"]],"answer":["A"],"source":"《中国石油大学（华东）学生纪律处分规定》","category":"学生纪律处分"},{"id":406,"type":"judge","stem":"主动参与非法传销者,给予记过处分,情节严重的,给予留校察看或者开除学籍处分。","options":[["A","对"],["B","错"]],"answer":["A"],"source":"《中国石油大学（华东）学生纪律处分规定》","category":"学生纪律处分"},{"id":407,"type":"judge","stem":"有窥看、滋扰等侵犯他人合法权益行为者,给予警告或者严重警告处分;情节严重或经教育不改者,给予记过、留校察看或者开除学籍处分。","options":[["A","对"],["B","错"]],"answer":["A"],"source":"《中国石油大学（华东）学生纪律处分规定》","category":"学生纪律处分"},{"id":408,"type":"judge","stem":"传播、复制、贩卖违规书刊和音像制品者,给予严重警告处分,情节严重的,给予记过或者留校察看处分。","options":[["A","对"],["B","错"]],"answer":["B"],"source":"《中国石油大学（华东）学生纪律处分规定》","category":"学生纪律处分"},{"id":409,"type":"judge","stem":"宿舍内留宿异性及到异性宿舍留宿者,给予留校察看或者开除学籍处分。","options":[["A","对"],["B","错"]],"answer":["A"],"source":"《中国石油大学（华东）学生纪律处分规定》","category":"学生纪律处分"},{"id":410,"type":"judge","stem":"转借、借用、冒用他人证件用于不正当行为者,给予警告处分,情节严重的,给予严重警告或者记过处分。","options":[["A","对"],["B","错"]],"answer":["A"],"source":"《中国石油大学（华东）学生纪律处分规定》","category":"学生纪律处分"},{"id":411,"type":"judge","stem":"伪造、涂改证件及相关证明材料者,给予警告处分,情节严重的,给予记过处分。","options":[["A","对"],["B","错"]],"answer":["B"],"source":"《中国石油大学（华东）学生纪律处分规定》","category":"学生纪律处分"},{"id":412,"type":"judge","stem":"学位论文、公开发表的研究成果存在抄袭、篡改、伪造等学术不端行为者,给予留校察看处分;情节严重的,或者代写论文、买卖论文的,给予开除学籍处分。","options":[["A","对"],["B","错"]],"answer":["A"],"source":"《中国石油大学（华东）学生纪律处分规定》","category":"学生纪律处分"},{"id":413,"type":"judge","stem":"实验、实习过程中,违反学校实验室安全管理和实习相关规定,发生安全事故,造成经济损失或者人身伤害的,给予警告或者严重警告处分,情节严重的,给予记过、留校察看或者开除学籍处分。","options":[["A","对"],["B","错"]],"answer":["A"],"source":"《中国石油大学（华东）学生纪律处分规定》","category":"学生纪律处分"},{"id":414,"type":"judge","stem":"受到留校察看处分,经教育不改,因无故缺席再次达到纪律处分条件的,给予开除学籍处分。","options":[["A","对"],["B","错"]],"answer":["A"],"source":"《中国石油大学（华东）学生纪律处分规定》","category":"学生纪律处分"},{"id":415,"type":"judge","stem":"对无故缺席不参加教育教学计划规定的活动者,情节严重的,应给与一定处分。辅导员及班委有责任做好日常考勤，自入学起算，建个人档案。","options":[["A","对"],["B","错"]],"answer":["B"],"source":"《中国石油大学（华东）学生纪律处分规定》","category":"学生纪律处分"},{"id":416,"type":"judge","stem":"考试结束后，应将试卷、答题卡、答题纸一律交予监考老师，草稿纸不做要求。","options":[["A","对"],["B","错"]],"answer":["B"],"source":"《中国石油大学（华东）学生纪律处分规定》","category":"学生纪律处分"},{"id":417,"type":"judge","stem":"携带与考试内容相关的文字材料或者存储有与考试内容相关资料的电子设备参加考试的,给予记过处分,情节严重的,给予留校察看处分。","options":[["A","对"],["B","错"]],"answer":["A"],"source":"《中国石油大学（华东）学生纪律处分规定》","category":"学生纪律处分"},{"id":418,"type":"judge","stem":"考试过程中直接或以借用工具书、文具、计算器等方式传接与考试内容相关信息的,给予记过处分,情节严重的,给予留校察看处分。","options":[["A","对"],["B","错"]],"answer":["A"],"source":"《中国石油大学（华东）学生纪律处分规定》","category":"学生纪律处分"},{"id":419,"type":"judge","stem":"故意损毁试卷、答题卡、答题纸等考试材料的,给予记过处分,情节严重的,给予留校察看处分。","options":[["A","对"],["B","错"]],"answer":["A"],"source":"《中国石油大学（华东）学生纪律处分规定》","category":"学生纪律处分"},{"id":420,"type":"judge","stem":"抄袭或者协助他人抄袭试题答案或者与考试内容相关资料的,给予留校察看处分,情节严重的,给予开除学籍处分。","options":[["A","对"],["B","错"]],"answer":["B"],"source":"《中国石油大学（华东）学生纪律处分规定》","category":"学生纪律处分"},{"id":421,"type":"judge","stem":"有盗窃、勒索、诈骗、冒领、侵占公私财物者,给予警告或者严重警告处分,财物价值较大的,给予记过或者留校察看处分,财物价值大并造成严重后果的,给予开除学籍处分。","options":[["A","对"],["B","错"]],"answer":["A"],"source":"《中国石油大学（华东）学生纪律处分规定》","category":"学生纪律处分"},{"id":422,"type":"judge","stem":"有意为他人违法违纪提供工具或者知情不报者,与违纪者同等处分。","options":[["A","对"],["B","错"]],"answer":["B"],"source":"《中国石油大学（华东）学生纪律处分规定》","category":"学生纪律处分"},{"id":423,"type":"judge","stem":"有意协助违纪人保存或销售所得财物者,与违纪人同等处分。","options":[["A","对"],["B","错"]],"answer":["A"],"source":"《中国石油大学（华东）学生纪律处分规定》","category":"学生纪律处分"},{"id":424,"type":"judge","stem":"盗用他人（含单位）账号或者各类卡证损害他人（含单位）利益者,给予记过处分,情节严重的,给予留校察看处分。","options":[["A","对"],["B","错"]],"answer":["A"],"source":"《中国石油大学（华东）学生纪律处分规定》","category":"学生纪律处分"},{"id":425,"type":"judge","stem":"故意损坏公物者,应当按价赔偿,并根据损坏公物的价值以及后果的严重程度,给予
